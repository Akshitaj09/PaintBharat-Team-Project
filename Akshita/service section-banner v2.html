<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-loop Interior Design Banner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            font-family: 'Poppins', sans-serif;
        }

        .banner {
            width: 1200px;
            height: 550px;
            background-color: #C3B1A0;
            position: relative;
            overflow: hidden;
            display: flex;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        /* Right Side Angled Background */
        .banner::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: #5c4e46;
            clip-path: polygon(25% 0%, 100% 0%, 100% 100%, 0% 100%);
            z-index: 1;
        }

        /* --- AUTO-LOOP IMAGE GALLERY --- */
        .main-image-container {
            position: absolute;
            right: 0;
            top: 0;
            width: 48%;
            height: 100%;
            clip-path: polygon(20% 0%, 100% 0%, 100% 90%, 5% 100%);
            z-index: 2;
            background-color: #333;
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 100%;
            filter: blur(4px);
            background-size: cover;
            background-position: center;
            /* Animation starts automatically: 8s total (2s per image) */
            animation: autoImageCycle 8s infinite ease-in-out;
        }

        @keyframes autoImageCycle {
            /* Image 1 */
            0%, 20% { background-image: url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=1000'); filter: blur(0px); }
            /* Blur Transition */
            22.5% { filter: blur(10px); }
            /* Image 2 */
            25%, 45% { background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1000'); filter: blur(0px); }
            /* Blur Transition */
            47.5% { filter: blur(10px); }
            /* Image 3 */
            50%, 70% { background-image: url(img/interior\ 1.jfif); filter: blur(0px); }
            /* Blur Transition */
            72.5% { filter: blur(10px); }
            /* Image 4 */
            75%, 95% { background-image: url(img/interior\ 2.jfif); filter: blur(0px); }
            /* Back to start with blur */
            97.5% { filter: blur(10px); }
        }

        /* --- CONTENT & BUTTON --- */
        .content {
            position: relative;
            z-index: 3;
            width: 50%;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .url { position: absolute; 
            top: 500px; 
            margin-left: 60px;
            font-size: 18px; 
            color: #5c4e46; 
            text-decoration: none; }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 70px;
            line-height: 1;
            margin: 0;
            text-transform: uppercase;
            color: #000;
        }

        p { font-size: 20px; color: #444; margin: 20px 0 40px 0; max-width: 350px; }

        .cta-btn {
            background-color: #5c4e46;
            color: white;
            padding: 15px 40px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            width: fit-content;
            clip-path: polygon(0% 0%, 90% 0%, 100% 50%, 90% 100%, 0% 100%);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left;
        }

        .cta-btn:hover {
            background-color: #332b26;
            transform: scale(1.15); /* Slightly more expansion */
            box-shadow: 15px 15px 30px rgba(0,0,0,0.1);
        }

        /* Hexagons and Branding */
        .hexagon {
            position: absolute;
            background-color: #5c4e46;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 4;
        }

        .price-tag { width: 130px; height: 140px; top: 150px; left: 480px; }
        .price-tag span { font-size: 10px; }
        .price-tag b { font-size: 18px; }

        .hex-img-1 { width: 180px; height: 200px; bottom: 20px; left: 380px; background: white; padding: 5px; }
        .hex-inner-1 { width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=400') center/cover; clip-path: inherit; }

        .hex-img-2 { width: 160px; height: 180px; bottom: 40px; left: 550px; background: white; padding: 5px; }
        .hex-inner-2 { width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1556912177-c54030639a8c?q=80&w=400') center/cover; clip-path: inherit; }

        .brand { position: absolute; top: 30px; right: 40px; z-index: 5; font-weight: bold; color: #444; }
    </style>
</head>
<body>

    <div class="banner">
        <a href="#" class="url">www.paintbharat.com</a>
        <div class="brand">PAINTBHARAT CO.</div>

        <div class="content">
            <h1>HOME<br>INTERIOR DESIGN</h1>
            <p>Elevate Your Space, Elevate Your Life: Discover the Art of Home Design!</p>
            <div class="cta-btn">Get Your Free Estimate</div>
        </div>

        <div class="main-image-container">
            <div class="main-image"></div>
        </div>

    </div>

</body>
</html>
