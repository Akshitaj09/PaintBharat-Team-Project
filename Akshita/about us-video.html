<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Bharat Section</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1000px;
            background: #fff;
            margin: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 20px;
            overflow: hidden;
            align-items: center; /* Vertical alignment */
        }

        /* --- VIDEO SECTION IMPROVED --- */
        .video-section {
            flex: 1.2; /* Isse video side thodi badi rahegi text se */
            min-width: 200px;
            padding: 60px; /* Isse video ke side mein space aayega */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- CONTENT SECTION --- */
        .content-section {
            flex: 1;
            min-width: 300px;
            padding: 40px;
        }

        .content-section h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            margin-bottom: 15px;
        }

        .content-section h3 {
            font-size: 1.1rem;
            color: #555;
            font-weight: 400;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            text-decoration: none;
            font-size: 1.4rem;
            color: #333;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #007bff;
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .video-section { padding: 20px; }
            .content-section { text-align: center; padding-top: 0; }
            .social-icons { justify-content: center; }
        }
    </style>
</head>
<body>

    <section class="container">
        <div class="video-section">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/dQw4w9WgXc" 
                    title="Paint Bharat Video" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="content-section">
            <h1>About Paint Bharat</h1>
            <h3>Transforming India's landscapes one stroke at a time. Join our mission to bring color and life to every corner of the nation.</h3>
            
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </section>

</body>
</html>
