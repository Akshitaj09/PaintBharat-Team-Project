  body {

  /* CARD BASE */
  .card {
    position: absolute;
    top: 50%;
    width: 240px;
    height: 380px;
    opacity: 0;
    cursor: pointer;
    transition:
      transform 1s ease,
      left 1s ease,
      opacity 1s ease,
      box-shadow 0.6s ease;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }

  /* POSITIONS */
  .center {
    left: 58%;
    opacity: 1;
    z-index: 3;
    transform: translate(-50%, -50%) scale(1);
  }

  .left {
    left: 38%;
    opacity: 0.55;
    z-index: 1;
    transform: translate(-50%, -50%) scale(0.85);
  }

  .right {
    left: 78%;
    opacity: 0.55;
    z-index: 1;
    transform: translate(-50%, -50%) scale(0.85);
  }

  /* GOLD BORDER (CENTER ONLY) */
  .gold-border {
    outline: 2px solid #d4af37;
    outline-offset: 6px;
    box-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
  }

  /* ========================= */
  /* ✨ HOVER EFFECT ✨ */
  /* ========================= */

  .center:hover {
    transform: translate(-50%, -50%) scale(1.06);
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.55),
      0 0 30px rgba(212, 175, 55, 0.45);
  }

  .center:hover img {
    transform: scale(1.08);
  }

  /* subtle hover for side cards */
  .left:hover,
  .right:hover {
    opacity: 0.75;
  }
</style>
</head>

<script>
  const cards = document.querySelectorAll('.card');
  let order = ['center', 'right', 'left'];

  setInterval(() => {
    order.unshift(order.pop());

    cards.forEach((card, i) => {
      card.className = `card ${order[i]}`;
      if (order[i] === 'center') {
        card.classList.add('gold-border');
      }
    });
  }, 3500);
</script>

        let activeStyle = 'all';
        let activeRoom = 'all';

        function render() {
            const gallery = document.getElementById('main-gallery');
            gallery.innerHTML = '';
            let displayList = [];

            if (activeStyle === 'all' && activeRoom === 'all') {
                // ALL CLICKED: Show 2 images from EVERY room type
                roomTypes.forEach(r => {
                    displayList.push(...items.filter(item => item.room === r).slice(0, 2));
                });
            } 
            else if (activeRoom !== 'all' && activeStyle === 'all') {
                // SPECIFIC ROOM CLICKED: Show 20 images of that room
                displayList = items.filter(i => i.room === activeRoom).slice(0, 20);
            }
            else if (activeStyle !== 'all' && activeRoom === 'all') {
                // SPECIFIC STYLE CLICKED: Show 20 images of that style
                displayList = items.filter(i => i.style === activeStyle).slice(0, 20);
            }
            else {
                // BOTH FILTERS ACTIVE: Show matches
                displayList = items.filter(i => i.room === activeRoom && i.style === activeStyle).slice(0, 20);
            }

            displayList.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'opacity-0 animate-fade-in-up group';
                card.style.animationDelay = `${idx * 0.05}s`;
                card.innerHTML = `
                    <div class="relative overflow-hidden rounded-2xl aspect-[4/5] bg-slate-200">
                        <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-6">
                            <p class="text-brand-gold text-xs font-bold uppercase">${item.style}</p>
                            <h3 class="text-white font-serif text-xl">${item.title}</h3>
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Room Tabs (Top)
        document.querySelectorAll('.room-pill').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.room-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeRoom = btn.dataset.room;
                render();
            };
        });

        // Style Sidebar (Left)
        document.querySelectorAll('.category-pill').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeStyle = btn.dataset.filter;
                render();
            };
        });

        // Sidebar Reveal Logic
        window.addEventListener('scroll', () => {
    const sidebar = document.getElementById('style-aside');
    const content = document.getElementById('after-hero-container');
    const logo = document.getElementById('logo-container');
    const myBanner = document.getElementById('my-custom-banner'); // Aapka banner

    if (window.pageYOffset > window.innerHeight - 100) {
        sidebar.classList.remove('-translate-x-full');

        logo.classList.add('lg:pl-64');
        if(myBanner) myBanner.classList.add('lg:pl-64'); // Banner ko shift karega
    } else {
        sidebar.classList.add('-translate-x-full');
        content.classList.remove('lg:pl-64');
        logo.classList.remove('lg:pl-64');
        if(myBanner) myBanner.classList.remove('lg:pl-64'); // Wapas normal

});
