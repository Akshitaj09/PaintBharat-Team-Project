<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrablox Team - Full Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Fonts: Plus Jakarta Sans for Body, Space Grotesk as fallback for Motter Corpus -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
            --card-bg: #020303;
            --accent-blue: #dfc57b;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --beige-bg: #F5F1E8;
            --beige-text: #1a1a1a;
            --beige-muted: #555555;
            /* Applying ITC Motter Corpus as the primary heading font */
            --font-heading: "ITC Motter Corpus", "Space Grotesk", sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* --- Hero Section & Carousel (Black Background) --- */
        .hero {
            text-align: center;
            padding: 80px 20px 40px 20px;
            background: radial-gradient(circle at top, #0b0e14 0%, #000 80%);
            overflow: hidden;
        }
        
        .hero h1 { 
            font-family: var(--font-heading);
            font-size: 65px; 
            font-weight: 800;
            margin-bottom: 12px; 
            letter-spacing: -0.01em; /* Adjusted for Motter Corpus weight */
            text-transform: uppercase;
            line-height: 1.1;
        }
        
        .hero p {
            font-size: 16px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .carousel-wrapper {
            position: relative;
            max-width: 1200px;
            margin: 80px auto 40px auto; 
            height: 380px;
        }

        .carousel-container {
            position: relative;
            height: 320px;
            display: flex;
            justify-content: center;
            perspective: 1200px;
        }

        .carousel-item {
            position: absolute;
            width: 190px;
            height: 260px;
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 7-Position System - Upward U-Shape Curve */
        .pos-1 { transform: translateX(-420px) translateY(-100px) rotate(25deg) scale(0.7); opacity: 0.1; z-index: 1; }
        .pos-2 { transform: translateX(-280px) translateY(-50px) rotate(15deg) scale(0.8); opacity: 0.4; z-index: 2; }
        .pos-3 { transform: translateX(-140px) translateY(-15px) rotate(8deg) scale(0.9); opacity: 0.7; z-index: 3; }
        .pos-4 { transform: translateX(0) translateY(0) rotate(0deg) scale(1.1); opacity: 1; z-index: 10; border: 3px solid var(--accent-blue); }
        .pos-5 { transform: translateX(140px) translateY(-15px) rotate(-8deg) scale(0.9); opacity: 0.7; z-index: 3; }
        .pos-6 { transform: translateX(280px) translateY(-50px) rotate(-15deg) scale(0.8); opacity: 0.4; z-index: 2; }
        .pos-7 { transform: translateX(420px) translateY(-100px) rotate(-25deg) scale(0.7); opacity: 0.1; z-index: 1; }

        .nav-btn {
            position: absolute;
            top: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            transform: translateY(-50%);
            transition: 0.3s;
        }
        .prev { left: 40px; }
        .next { right: 40px; }
        .nav-btn:hover { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }

        .active-meta { margin-top: 20px; text-align: center; }
        .active-meta h2 { font-family: var(--font-heading); font-size: 26px; margin: 0; font-weight: 700; }
        .active-meta p { color: var(--accent-blue); font-weight: bold; font-size: 13px; text-transform: uppercase; margin-top: 4px; }

        /* --- Team Grid (Beige Background) --- */
        .team-grid-section {
            padding: 90px 8%;
            background-color: var(--beige-bg);
            color: var(--beige-text);
            position: relative;
        }
        
        .section-title { text-align: center; margin-bottom: 50px; }
        .section-title h2 { 
            font-family: var(--font-heading); 
            font-size: 55px; 
            font-weight: 700;
            color: var(--beige-text); 
            text-transform: uppercase;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
        }
        .section-title p { color: var(--beige-muted); max-width: 500px; margin: 0 auto; font-size: 16px; }

        /* Slider Navigation */
        .slider-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }
        .slide-btn {
            background: white;
            border: 1px solid #e0e0e0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--beige-text);
        }
        .slide-btn:hover { background: var(--accent-blue); color: white; border-color: var(--accent-blue); transform: scale(1.05); }
        .category-label { font-family: var(--font-heading); font-weight: 700; font-size: 18px; min-width: 220px; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Slider Logic */
        .slider-viewport {
            overflow: hidden;
            width: 100%;
        }
        .grid-slider {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            width: 400%; 
        }
        .grid-container {
            width: 25%; 
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 18px;
            justify-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .team-card { 
            text-align: left; 
            width: 100%;
        }

        .team-card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
            filter: grayscale(20%);
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        
        .team-card img:hover { filter: grayscale(0%); transform: translateY(-6px); }

        .team-card h3 { 
            font-family: var(--font-heading);
            font-size: 16px; 
            margin: 4px 0 2px 0; 
            color: var(--beige-text); 
            font-weight: 700;
        }
        .team-card .role { color: #6e3020c4; font-size: 11px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        /* Social Icons */
        .social-icons { 
            color: #b0b0b0; 
            display: flex; 
            gap: 12px; 
            font-size: 14px; 
        }

        .social-icons i {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-icons i:hover {
            color: var(--accent-blue);
            transform: scale(1.2) translateY(-1px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
            .hero h1 { font-size: 48px; }
            .section-title h2 { font-size: 34px; }
        }
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            .hero h1 { font-size: 34px; }
            .section-title h2 { font-size: 26px; }
            .carousel-wrapper { margin-top: 40px; height: 340px; }
            .carousel-item { width: 150px; height: 210px; }
            .category-label { font-size: 15px; min-width: 160px; }
        }
    </style>
</head>
<body>

<section class="hero">
    <h1>Meet our Team</h1>
    <p>Designing the architecture of innovation & intelligence</p>
    
    <div class="carousel-wrapper">
        <button class="nav-btn prev" onclick="shift(-1)"><i class="fas fa-arrow-left"></i></button>
        <button class="nav-btn next" onclick="shift(1)"><i class="fas fa-arrow-right"></i></button>

        <div class="carousel-container" id="carousel-box">
            <div class="carousel-item pos-1" onclick="jumpTo(1)"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400" alt="Team member"></div>
            <div class="carousel-item pos-2" onclick="jumpTo(2)"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" alt="Team member"></div>
            <div class="carousel-item pos-3" onclick="jumpTo(3)"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400" alt="Team member"></div>
            <div class="carousel-item pos-4" onclick="jumpTo(4)"><img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400" alt="Team member"></div>
            <div class="carousel-item pos-5" onclick="jumpTo(5)"><img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400" alt="Team member"></div>
            <div class="carousel-item pos-6" onclick="jumpTo(6)"><img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400" alt="Team member"></div>
            <div class="carousel-item pos-7" onclick="jumpTo(7)"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Team member"></div>
        </div>

        <div class="active-meta">
            <h2 id="name-display">Tom White</h2>
            <p id="role-display">Head of Product</p>
        </div>
    </div>
</section>

<section class="team-grid-section">
    <div class="section-title">
        <h2>Our Core Team</h2>
        <p>Where Talent, Strategy, and Creativity Meet.</p>
    </div>

    <div class="slider-controls">
        <button class="slide-btn" onclick="moveSlider(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="category-label" id="category-name">Creative Team</div>
        <button class="slide-btn" onclick="moveSlider(1)"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="slider-viewport">
        <div class="grid-slider" id="main-slider">
            <div class="grid-container" id="creative-grid"></div>
            <div class="grid-container" id="backend-grid"></div>
            <div class="grid-container" id="media-grid"></div>
            <div class="grid-container" id="marketing-grid"></div>
        </div>
    </div>
</section>

<script>
    const teamData = [
        { n: "Alex Rivera", r: "Full Stack Developer" },
        { n: "Sarah Connor", r: "UX Researcher" },
        { n: "David Chen", r: "UI Designer" },
        { n: "Tom White", r: "Head of Product" },
        { n: "Elena Rose", r: "Marketing Director" },
        { n: "Marcus Thorne", r: "Software Engineer" },
        { n: "Sophia Lee", r: "Project Manager" }
    ];

    let positions = [1, 2, 3, 4, 5, 6, 7];
    const cards = document.querySelectorAll('.carousel-item');

    function updateCarousel() {
        cards.forEach((card, i) => {
            card.className = `carousel-item pos-${positions[i]}`;
            if(positions[i] === 4) {
                document.getElementById('name-display').innerText = teamData[i].n;
                document.getElementById('role-display').innerText = teamData[i].r;
            }
        });
    }

    function shift(dir) {
        positions = positions.map(p => {
            let next = p + dir;
            if(next > 7) next = 1;
            if(next < 1) next = 7;
            return next;
        });
        updateCarousel();
    }

    function jumpTo(posInArray) {
        const currentPosOfElement = positions[posInArray-1];
        const diff = 4 - currentPosOfElement;
        if(diff !== 0) {
            for(let i=0; i<Math.abs(diff); i++) {
                shift(diff > 0 ? 1 : -1);
            }
        }
    }
    updateCarousel();

    const categories = ["Creative Team", "Backend Team", "Media Team", "Marketing Team"];
    const members = {
        creative: [
            { n: "Lisa Thompson", r: "Creative Lead", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400" },
            { n: "Laura Davis", r: "Art Director", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" },
            { n: "James Wilson", r: "Visual Designer", img: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400" },
            { n: "Elena Rose", r: "Illustrator", img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400" },
            { n: "Marcus Thorne", r: "Motion Artist", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400" }
        ],
        backend: [
            { n: "Kevin Heart", r: "System Architect", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400" },
            { n: "Sarah Jenkins", r: "Database Expert", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" },
            { n: "Mike Ross", r: "API Developer", img: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400" },
            { n: "Anna Scott", r: "DevOps Engineer", img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400" },
            { n: "Will Smith", r: "Security Lead", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400" }
        ],
        media: [
            { n: "Chris Evans", r: "Video Producer", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400" },
            { n: "Jessica Alba", r: "Photographer", img: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400" },
            { n: "Ryan Gosling", r: "Sound Designer", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400" },
            { n: "Emma Stone", r: "Content Creator", img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400" },
            { n: "Tom Hardy", r: "Editor", img: "https://images.unsplash.com/photo-1463453091185-61582044d556?w=400" }
        ],
        marketing: [
            { n: "Steve Jobs", r: "Growth Lead", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400" },
            { n: "Sheryl Sand", r: "SEO Specialist", img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400" },
            { n: "Jack Dorsey", r: "Social Manager", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400" },
            { n: "Indra Nooyi", r: "Brand Strategist", img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400" },
            { n: "Jeff Bezos", r: "Ads Expert", img: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400" }
        ]
    };

    function populateGrids() {
        const grids = ['creative', 'backend', 'media', 'marketing'];
        grids.forEach(g => {
            const container = document.getElementById(`${g}-grid`);
            members[g].forEach(m => {
                container.innerHTML += `
                    <div class="team-card">
                        <img src="${m.img}" alt="${m.n}">
                        <h3>${m.n}</h3>
                        <div class="role">${m.r}</div>
                        <div class="social-icons">
                            <i class="fab fa-linkedin"></i>
                            <i class="fab fa-twitter"></i>
                            <i class="fab fa-github"></i>
                        </div>
                    </div>
                `;
            });
        });
    }

    let currentSlide = 0;
    function moveSlider(dir) {
        currentSlide += dir;
        if(currentSlide < 0) currentSlide = 3;
        if(currentSlide > 3) currentSlide = 0;
        
        document.getElementById('main-slider').style.transform = `translateX(-${currentSlide * 25}%)`;
        document.getElementById('category-name').innerText = categories[currentSlide];
    }

    populateGrids();
</script>

</body>
</html>
