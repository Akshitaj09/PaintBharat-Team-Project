<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Services Slideshow</title>
    <!-- Premium Google Fonts: Syne for high-impact titles, Montserrat for clean body -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-white: #ffffff;
            --accent-red: #ec1348;
            --transition-speed: 1.2s;
            --slide-duration: 5000ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: var(--primary-white);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .services-section {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* --- Background Layers --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            filter: blur(12px) brightness(0.5);
            transform: scale(1.1);
        }

        .bg-slide.active {
            opacity: 1;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.85) 0%, 
                rgba(0,0,0,0.2) 50%, 
                rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        /* --- Vertical Navigation --- */
        .sidebar-nav {
            position: absolute;
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 100;
        }

        .sidebar-line {
            position: absolute;
            left: 20px;
            top: 0;
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            z-index: -1;
        }

        .nav-item {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-item.active {
            background: var(--primary-white);
            color: #000;
            transform: scale(1.25);
            border-color: var(--primary-white);
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        /* --- Main Content Layout --- */
        .main-container {
            width: 100%;
            padding-left: 180px;
            z-index: 10;
        }

        .text-content {
            max-width: 900px;
            position: relative;
        }

        .slide-text-item {
            display: none;
            animation: massiveAppear 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .slide-text-item.active {
            display: block;
        }

        .service-title {
            font-family: 'Syne', sans-serif;
            font-size: 7.5rem; 
            font-weight: 800;
            line-height: 0.95;
            margin-bottom: 35px;
            color: #fff;
            text-shadow: 0 10px 40px rgba(0,0,0,0.5);
            letter-spacing: -3px;
        }

        .service-desc {
            font-size: 1.6rem; 
            color: rgba(255, 255, 255, 0.9); 
            line-height: 1.4;
            margin-bottom: 60px;
            max-width: 650px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            font-weight: 300;
        }

        .explore-btn {
            display: inline-flex;
            align-items: center;
            padding: 20px 60px;
            background: var(--accent-red);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            border-radius: 100px;
            font-size: 1.1rem;
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 45px rgba(236, 19, 72, 0.4);
        }

        .explore-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 25px 60px rgba(236, 19, 72, 0.6);
            background: #ff1a53;
        }

        /* --- THE WHEEL --- */
        .wheel-outer {
            position: absolute;
            right: -15vw;
            top: 50%;
            transform: translateY(-50%);
            width: 90vh; 
            height: 90vh;
            z-index: 5;
        }

        .circular-strip {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 80px solid rgba(255, 255, 255, 0.15); 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform var(--transition-speed) cubic-bezier(0.645, 0.045, 0.355, 1);
            box-shadow: 0 0 100px rgba(0,0,0,0.7);
        }

        .inner-content {
            position: absolute;
            width: calc(100% + 160px);
            height: calc(100% + 160px);
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease, transform 1.2s ease;
        }

        .strip-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 80px solid transparent;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 6;
        }

        /* --- Animations --- */
        @keyframes massiveAppear {
            from { 
                opacity: 0; 
                transform: translateX(-60px); 
                filter: blur(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
                filter: blur(0); 
            }
        }

        /* Responsive Adjustments */
        @media (max-width: 1600px) {
            .service-title { font-size: 6rem; }
            .service-desc { font-size: 1.4rem; }
            .main-container { padding-left: 150px; }
        }

        @media (max-width: 1200px) {
            .service-title { font-size: 4.5rem; }
            .wheel-outer { width: 70vh; height: 70vh; right: -20vw; }
            .main-container { padding-left: 130px; }
        }

        @media (max-width: 768px) {
            .wheel-outer {
                width: 100vw;
                height: 100vw;
                top: 20%;
                right: 50%;
                transform: translate(50%, -50%);
            }
            .main-container {
                padding: 0 30px;
                padding-top: 50vh;
                text-align: center;
            }
            .sidebar-nav {
                flex-direction: row;
                top: auto;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
            }
            .sidebar-line { display: none; }
            .service-desc { margin: 0 auto 35px; font-size: 1.1rem; }
            .service-title { font-size: 3rem; margin-bottom: 20px; }
            .explore-btn { padding: 15px 40px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <section class="services-section">
        <div class="bg-container" id="bg-container"></div>
        <div class="bg-overlay"></div>

        <div class="sidebar-nav" id="sidebar-nav">
            <div class="sidebar-line"></div>
        </div>

        <div class="main-container">
            <div class="text-content">
                <div id="text-items"></div>
            </div>
        </div>

        <div class="wheel-outer" id="wheel-outer">
            <div class="circular-strip" id="circular-strip">
                <div class="inner-content">
                    <img src="" alt="Service" class="panel-image" id="panel-image">
                </div>
            </div>
            <div class="strip-overlay"></div>
        </div>
    </section>

    <script>
        const services = [
            { 
                title: "Interior\nDesign Mastery", 
                desc: "Transforming living spaces with bespoke aesthetic designs that blend modern luxury with functional elegance.", 
                img: "https://images.unsplash.com/photo-1616489953149-755e37829219?auto=format&fit=crop&q=80&w=1200" 
            },
            { 
                title: "Wallpaper\nArtistry", 
                desc: "Premium wall textures and designer patterns curated to bring character, depth, and personality to any room.", 
                img: "https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&q=80&w=1200" 
            },
            { 
                title: "Exterior\nArchitecture", 
                desc: "High-performance facade solutions and painting that protect your structure while maximizing architectural curb appeal.", 
                img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80&w=1200" 
            },
            { 
                title: "Advanced\nWaterproofing", 
                desc: "Industrial-grade moisture barriers for roofs and foundations to ensure your property remains dry and damage-free.", 
                img: "https://images.unsplash.com/photo-1621905252507-b35222407548?auto=format&fit=crop&q=80&w=1200" 
            },
            { 
                title: "Premium\nWood Varnish", 
                desc: "Expert finishing for fine woodwork that preserves natural textures while providing a brilliant, high-gloss protective shield.", 
                img: "https://images.unsplash.com/photo-1541123437800-1bb1317badc2?auto=format&fit=crop&q=80&w=1200" 
            }
        ];

        const sidebarNav = document.getElementById('sidebar-nav');
        const textItems = document.getElementById('text-items');
        const bgContainer = document.getElementById('bg-container');
        const panelImage = document.getElementById('panel-image');
        const circularStrip = document.getElementById('circular-strip');

        let currentIndex = 0;
        let slideTimer;
        let currentRotation = 0;
        const duration = 5000;
        const step = 360 / services.length;

        function init() {
            services.forEach((service, i) => {
                const navItem = document.createElement('div');
                navItem.className = `nav-item ${i === 0 ? 'active' : ''}`;
                navItem.innerText = i + 1;
                navItem.onclick = () => goToSlide(i);
                sidebarNav.appendChild(navItem);

                const textItem = document.createElement('div');
                textItem.className = `slide-text-item ${i === 0 ? 'active' : ''}`;
                textItem.innerHTML = `
                    <h1 class="service-title">${service.title.replace('\n', '<br>')}</h1>
                    <p class="service-desc">${service.desc}</p>
                    <a href="#" class="explore-btn">explore more</a>
                `;
                textItems.appendChild(textItem);

                const bg = document.createElement('div');
                bg.className = `bg-slide ${i === 0 ? 'active' : ''}`;
                bg.style.backgroundImage = `url(${service.img})`;
                bgContainer.appendChild(bg);
            });

            panelImage.src = services[0].img;
            startAutoSlide();
        }

        function updateSlide(index, direction = 1) {
            currentIndex = index;
            currentRotation += (direction * step);
            circularStrip.style.transform = `rotate(${currentRotation}deg)`;

            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));
            document.querySelectorAll('.slide-text-item').forEach((el, i) => el.classList.toggle('active', i === index));
            document.querySelectorAll('.bg-slide').forEach((el, i) => el.classList.toggle('active', i === index));
            
            panelImage.style.opacity = '0.2';
            panelImage.style.transform = `rotate(${-currentRotation}deg) scale(1.4)`;
            
            setTimeout(() => {
                panelImage.src = services[index].img;
                panelImage.style.opacity = '1';
                panelImage.style.transform = `rotate(${-currentRotation}deg) scale(1)`;
            }, 400);
        }

        function startAutoSlide() {
            clearInterval(slideTimer);
            slideTimer = setInterval(() => {
                let next = (currentIndex + 1) % services.length;
                updateSlide(next, 1);
            }, duration);
        }

        function goToSlide(index) {
            if(index === currentIndex) return;
            const direction = index > currentIndex ? 1 : -1;
            updateSlide(index, direction);
            startAutoSlide();
        }

        window.onload = init;
    </script>
</body>
</html>
