<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrablox Team - Full Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000;
            --card-bg: #020303;
            --accent-blue: #dfc57b;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .logo { font-size: 22px; font-weight: bold; }
        .logo span { color: var(--accent-blue); }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin: 0 15px; font-size: 14px; }
        .btn-primary { background: var(--accent-blue); padding: 10px 20px; border-radius: 5px; color: white; text-decoration: none; }

        /* --- Hero Section & Carousel --- */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at top, #0b0e14 0%, #000 80%);
            overflow: hidden;
        }
        .hero h1 { font-size: 50px; margin-bottom: 10px; }
        
        .carousel-wrapper {
            position: relative;
            max-width: 1200px;
            margin: 50px auto;
            height: 450px;
        }

        .carousel-container {
            position: relative;
            height: 320px;
            display: flex;
            justify-content: center;
            perspective: 1200px;
        }

        .carousel-item {
            position: absolute;
            width: 200px;
            height: 280px;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 7-Position System */
        .pos-1 { transform: translateX(-450px) translateY(120px) rotate(-30deg) scale(0.7); opacity: 0.1; z-index: 1; }
        .pos-2 { transform: translateX(-300px) translateY(60px) rotate(-20deg) scale(0.8); opacity: 0.4; z-index: 2; }
        .pos-3 { transform: translateX(-150px) translateY(20px) rotate(-10deg) scale(0.9); opacity: 0.7; z-index: 3; }
        .pos-4 { transform: translateX(0) translateY(0) rotate(0deg) scale(1.1); opacity: 1; z-index: 10; border: 3px solid var(--accent-blue); }
        .pos-5 { transform: translateX(150px) translateY(20px) rotate(10deg) scale(0.9); opacity: 0.7; z-index: 3; }
        .pos-6 { transform: translateX(300px) translateY(60px) rotate(20deg) scale(0.8); opacity: 0.4; z-index: 2; }
        .pos-7 { transform: translateX(450px) translateY(120px) rotate(30deg) scale(0.7); opacity: 0.1; z-index: 1; }

        .nav-btn {
            position: absolute;
            top: 40%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
        }
        .prev { left: 30px; }
        .next { right: 30px; }
        .nav-btn:hover { background: var(--accent-blue); }

        .active-meta { margin-top: 25px; text-align: center; }
        .active-meta h2 { font-size: 26px; margin: 0; }
        .active-meta p { color: var(--accent-blue); font-weight: bold; font-size: 13px; text-transform: uppercase; margin-top: 5px; }

        /* --- Team Grid (COMPACT VERSION) --- */
        .team-grid-section {
            padding: 60px 8%;
            background-color: var(--bg-color);
        }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-size: 32px; }
        .section-title p { color: var(--text-muted); max-width: 600px; margin: 10px auto; font-size: 14px; }

        .grid-container {
            display: grid;
            /* Ek line mein 5 images fix */
            grid-template-columns: repeat(5, 1fr); 
            gap: 15px; /* Gap kam kiya */
            justify-items: center;
        }

        .team-card { 
            text-align: left; 
            width: 100%;
        }

        .team-card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
            filter: grayscale(10%);
            transition: 0.3s;
        }
        
        .team-card img:hover { filter: grayscale(0%); transform: translateY(-5px); }

        .team-card h3 { font-size: 16px; margin: 5px 0 2px 0; }
        .team-card .role { color: var(--accent-blue); font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        
        /* Description hide ki taaki layout clean lage */
        .team-card .desc { display: none; }
        
        .social-icons { color: var(--text-muted); display: flex; gap: 8px; font-size: 12px; }

        /* Responsive */
        @media (max-width: 1024px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            .hero h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

<section class="hero">
    <h1>Meet our Team</h1>
    <p>Creativity and technology combined.</p>
    
    <div class="carousel-wrapper">
        <button class="nav-btn prev" onclick="shift(-1)"><i class="fas fa-arrow-left"></i></button>
        <button class="nav-btn next" onclick="shift(1)"><i class="fas fa-arrow-right"></i></button>

        <div class="carousel-container" id="carousel-box">
            <div class="carousel-item pos-1" onclick="jumpTo(1)"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400"></div>
            <div class="carousel-item pos-2" onclick="jumpTo(2)"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400"></div>
            <div class="carousel-item pos-3" onclick="jumpTo(3)"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400"></div>
            <div class="carousel-item pos-4" onclick="jumpTo(4)"><img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400"></div>
            <div class="carousel-item pos-5" onclick="jumpTo(5)"><img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400"></div>
            <div class="carousel-item pos-6" onclick="jumpTo(6)"><img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400"></div>
            <div class="carousel-item pos-7" onclick="jumpTo(7)"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400"></div>
        </div>

        <div class="active-meta">
            <h2 id="name-display">Tom White</h2>
            <p id="role-display">Head of Product</p>
        </div>
    </div>
</section>

<section class="team-grid-section">
    <div class="section-title">
        <h2>Our Core Team</h2>
        <p>A professional team for your business needs.</p>
    </div>

    <div class="grid-container">
        <div class="team-card">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400">
            <h3>Lisa Thompson</h3>
            <div class="role">Customer Success</div>
            <div class="social-icons"><i class="fab fa-linkedin"></i></div>
        </div>
        <div class="team-card">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400">
            <h3>Laura Davis</h3>
            <div class="role">COO</div>
            <div class="social-icons"><i class="fab fa-linkedin"></i></div>
        </div>
        <div class="team-card">
            <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400">
            <h3>James Wilson</h3>
            <div class="role">CTO</div>
            <div class="social-icons"><i class="fab fa-github"></i></div>
        </div>
        <div class="team-card">
            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400">
            <h3>Elena Rose</h3>
            <div class="role">Marketing</div>
            <div class="social-icons"><i class="fab fa-twitter"></i></div>
        </div>
        <div class="team-card">
            <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400">
            <h3>Marcus Thorne</h3>
            <div class="role">Engineer</div>
            <div class="social-icons"><i class="fab fa-linkedin"></i></div>
        </div>
    </div>
</section>

<script>
    const teamData = [
        { n: "Alex Rivera", r: "Full Stack Developer" },
        { n: "Sarah Connor", r: "UX Researcher" },
        { n: "David Chen", r: "UI Designer" },
        { n: "Tom White", r: "Head of Product" },
        { n: "Elena Rose", r: "Marketing Director" },
        { n: "Marcus Thorne", r: "Software Engineer" },
        { n: "Sophia Lee", r: "Project Manager" }
    ];

    let positions = [1, 2, 3, 4, 5, 6, 7];
    const cards = document.querySelectorAll('.carousel-item');

    function updateCarousel() {
        cards.forEach((card, i) => {
            card.className = `carousel-item pos-${positions[i]}`;
            if(positions[i] === 4) {
                document.getElementById('name-display').innerText = teamData[i].n;
                document.getElementById('role-display').innerText = teamData[i].r;
            }
        });
    }

    function shift(dir) {
        positions = positions.map(p => {
            let next = p + dir;
            if(next > 7) next = 1;
            if(next < 1) next = 7;
            return next;
        });
        updateCarousel();
    }

    function jumpTo(posInArray) {
        const currentPosOfElement = positions[posInArray-1];
        const diff = 4 - currentPosOfElement;
        if(diff !== 0) {
            for(let i=0; i<Math.abs(diff); i++) {
                shift(diff > 0 ? 1 : -1);
            }
        }
    }
    updateCarousel();
</script>

</body>
</html>
