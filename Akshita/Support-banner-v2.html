<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Bharat | Interior Design Banner</title>
    <!-- Google Fonts for Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-white: #ffffff;
            --overlay-bg: rgba(26, 35, 26, 0.9);
            --accent-gold: #c5a059;
            --transition-speed: 0.5s;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Montserrat', sans-serif;
            /* Banner Height Control */
            --banner-height: 450px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: #f8f8f8;
        }

        /* Banner Section Container */
        .banner-section {
            position: relative;
            height: var(--banner-height);
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* 3-Column Grid */
        .banner-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            z-index: 1;
        }

        .banner-col {
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        /* Images and Hover Effects */
        .banner-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed) ease;
        }

        .banner-col::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            transition: background var(--transition-speed) ease;
        }

        .banner-col:hover img {
            transform: scale(1.08);
        }

        .banner-col:hover::after {
            background: rgba(0, 0, 0, 0.45);
        }

        /* Center Content Overlay */
        .banner-content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
            pointer-events: none; /* Allows hover on columns behind the box edges if needed */
        }

        .brand-box {
            background: var(--overlay-bg);
            padding: 30px 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            margin-bottom: 25px;
            pointer-events: auto;
            animation: fadeInDown 0.8s ease-out;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .heading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 5px;
        }

        .line {
            height: 1px;
            background: var(--primary-white);
            width: 60px;
            opacity: 0.8;
        }

        .main-heading {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            color: var(--primary-white);
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: 3px;
        }

        .sub-heading {
            font-size: 0.8rem;
            color: var(--primary-white);
            text-transform: uppercase;
            letter-spacing: 10px;
            font-weight: 300;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* Buttons Container */
        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 4px; /* More "banner" like squared edges slightly rounded */
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary-white);
            color: #1a1a1a;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.4);
            color: var(--primary-white);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        /* Button Hover States */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            background: #f0f0f0;
            transform: translateY(-3px) scale(1.02);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-white);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-heading { font-size: 2.2rem; }
            .line { width: 40px; }
            :root { --banner-height: 400px; }
        }

        @media (max-width: 768px) {
            :root { --banner-height: auto; }
            .banner-grid {
                position: relative;
                grid-template-columns: 1fr;
                height: 600px; /* Total height when stacked */
            }
            .banner-content-wrapper {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 90%;
            }
            .main-heading { font-size: 1.8rem; }
            .brand-box { padding: 25px 20px; width: 100%; }
            .line { display: none; } /* Simplify for mobile */
            .sub-heading { letter-spacing: 5px; }
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Space for other site content above -->
    <div style="height: 50px; background: #fff;"></div>

    <section class="banner-section">
        <!-- Background Image Grid -->
        <div class="banner-grid">
            <div class="banner-col">
                <img src="https://i.pinimg.com/1200x/4b/95/5a/4b955aeca52247d51bc37110cdb97016.jpg" alt="Kitchen">
            </div>
            <div class="banner-col">
                <img src="https://i.pinimg.com/736x/d3/0b/98/d30b984b6733a06461684d501b3d1f2a.jpg" alt="Dining">
            </div>
            <div class="banner-col">
                <img src="https://images.unsplash.com/photo-1540518614846-7eded433c457?q=80&w=1200&auto=format&fit=crop" alt="Bedroom">
            </div>
        </div>

        <!-- Content Overlay -->
        <div class="banner-content-wrapper">
            <div class="brand-box">
                <div class="heading-container">
                    <div class="line"></div>
                    <h1 class="main-heading">Paint Bharat</h1>
                    <div class="line"></div>
                </div>
                <p class="sub-heading">Interior Design</p>
            </div>

            <div class="btn-group">
                <a href="#" class="btn btn-primary">Get Free Estimate</a>
                <a href="#" class="btn btn-secondary">Need Support</a>
            </div>
        </div>
    </section>

    <!-- Space for other site content below -->
    <div style="height: 500px; background: #fff; padding: 50px; text-align: center;">
        <p style="color: #888;">Scroll down to see more content...</p>
    </div>

</body>
</html>
