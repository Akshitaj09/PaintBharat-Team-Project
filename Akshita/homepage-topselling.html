<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat Banner - Zoom & Navigation</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fdfcfb; margin: 0; }

        /* NEUMORPHIC EFFECTS */
        .neumo-out {
            box-shadow: 17px 15px 30px rgba(215, 210, 200, 0.4), 
                        -15px -15px 30px rgba(189, 189, 189, 0.9);

            border: 0.5px solid rgba(255, 255, 255, 0.5)
        }

        .neumo-in {
            box-shadow: inset 8px 8px 16px rgba(215, 210, 200, 0.5), 
                        inset -8px -8px 16px rgba(255, 255, 255, 0.8);
        }

        #cardSlider {
             padding: 50px 20px;
        }

        .neumo-nav {
            box-shadow: 4px 4px 10px rgba(215, 210, 200, 0.5), 
                        -4px -4px 10px rgba(151, 150, 150, 0.9);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }

        /* 3 CARDS MASK */
        .slider-mask {
            max-width: 1060px;
            overflow: hidden;
        }

        /* ZOOM EFFECT FIX */
        .zoom-img {
            transition: transform 0.8s ease-out;
        }
        .group:hover .zoom-img {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

<section class="relative w-full bg-[#e1daca] py-16 md:py-24 overflow-hidden">
    
    <div class="max-w-[1600px] mx-auto px-6 md:px-12 grid grid-cols-1 lg:grid-cols-[350px_1fr] gap-8 items-center relative z-10">
        
        <div class="banner-text-area">
            <span class="text-rose-400 font-semibold tracking-widest uppercase text-xs mb-3 block">Premium Collection</span>
            <h1 class="font-['Playfair_Display'] text-5xl md:text-6xl font-bold text-slate-800 leading-tight">
                Top Selling<br>Products
            </h1>
            <div class="h-0.5 w-16 bg-rose-300 my-6"></div>
            <p class="text-slate-500 text-sm max-w-sm mb-8">
                Premium finishes designed to bring warmth, depth, and timeless elegance to your interiors.
            </p>
            <button class="px-8 py-3 bg-[#1e293b] text-white rounded-full font-medium text-sm hover:bg-rose-500 transition-all shadow-lg active:scale-95">
                View All Services
            </button>
        </div>

        <div class="flex flex-col gap-8 items-end">
            
            <div class="slider-mask">
                <div id="cardSlider" class="flex flex-row gap-8 overflow-x-auto no-scrollbar pb-6 pt-4 px-4">
                    
                    <div class="min-w-[310px] group bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 hover:-translate-y-2 cursor-pointer">
                        <div class="aspect-square rounded-[40px] p-4 neumo-in overflow-hidden">
                            <div class="w-full h-full rounded-[32px] overflow-hidden">
                                <img src="royal paint bucket.png" class="zoom-img w-full h-full object-cover">
                            </div>
                        </div>
                        <div class="px-2 pt-6 flex items-center justify-between">
                            <h3 class="text-md font-bold text-slate-700">Asian Royale Paint</h3>
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">→</div>
                        </div>
                    </div>

                    <div class="min-w-[310px] group bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 hover:-translate-y-2 cursor-pointer">
                        <div class="aspect-square rounded-[40px] p-4 neumo-in overflow-hidden">
                            <div class="w-full h-full rounded-[32px] overflow-hidden">
                                <img src="exterior paint bucket.png" class="zoom-img w-full h-full object-cover">
                            </div>
                        </div>
                        <div class="px-2 pt-6 flex items-center justify-between">
                            <h3 class="text-md font-bold text-slate-700">Birla Opus Calista Neo Star</h3>
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">→</div>
                        </div>
                    </div>

                    <div class="min-w-[310px] group bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 hover:-translate-y-2 cursor-pointer">
                        <div class="aspect-square rounded-[40px] p-4 neumo-in overflow-hidden">
                            <div class="w-full h-full rounded-[32px] overflow-hidden">
                                <img src="waterproofing paint bucket.png" class="zoom-img w-full h-full object-cover">
                            </div>
                        </div>
                        <div class="px-2 pt-6 flex items-center justify-between">
                            <h3 class="text-md font-bold text-slate-700">Dulux Damp Seal</h3>
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">→</div>
                        </div>
                    </div>

                    <div class="min-w-[310px] group bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 hover:-translate-y-2 cursor-pointer">
                        <div class="aspect-square rounded-[40px] p-4 neumo-in overflow-hidden">
                            <div class="w-full h-full rounded-[32px] overflow-hidden">
                                <img src="interior bucket.png" class="zoom-img w-full h-full object-cover">
                            </div>
                        </div>
                        <div class="px-2 pt-6 flex items-center justify-between">
                            <h3 class="text-md font-bold text-slate-700">Birla Opus One Pure Legend</h3>
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">→</div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="flex gap-6 pr-12">
                <button onclick="scrollSlider('left')" class="w-12 h-12 rounded-2xl bg-[#FBF9F7] neumo-nav flex items-center justify-center text-slate-400 hover:text-rose-500 transition-all active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button onclick="scrollSlider('right')" class="w-12 h-12 rounded-2xl bg-[#FBF9F7] neumo-nav flex items-center justify-center text-slate-400 hover:text-rose-500 transition-all active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </div>
    </div>
</section>

<script>
    function scrollSlider(direction) {
        const slider = document.getElementById('cardSlider');
        const scrollStep = 342; // Card + Gap
        
        if (direction === 'left') {
            slider.scrollLeft -= scrollStep;
        } else {
            slider.scrollLeft += scrollStep;
        }
    }
</script>

</body>
</html>
