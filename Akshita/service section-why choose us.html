<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Choose Us - Premium Carousel</title>
    <style>
        :root {
            --primary-bg: #fff/*#ffffffec*/;
            --accent: #b29079;
            --card-width: 380px;
            --card-height: 420px;
            /* New soft colors for animation */
            --grad-1: rgba(228, 202, 202, 0.902);
            --grad-2: rgba(155, 86, 40, 0.15);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1e293b;
            font-family: 'Segoe UI', sans-serif;
        }

        .banner {
            width: 1200px;
            height: 600px;
            background: var(--primary-bg);
            position: relative;
            overflow: hidden; /* Important to clip the background blobs */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* --- New Background Animation --- */
        .bg-blur {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            filter: blur(80px);
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            background: var(--accent);
            animation: move 15s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            background: var(--grad-1);
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
            background: var(--grad-2);
            animation-delay: -5s;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.1); }
        }
        /* ------------------------------- */

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 100; /* Content ko upar rakhne ke liye */
            position: relative;
        }

        .header h1 {
            color: #000;
            font-size: 3rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--accent);
            margin-top: 5px;
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            z-index: 100;
        }

        input[type="radio"] { display: none; }

        .cards-wrapper {
            position: relative;
            width: var(--card-width);
            height: var(--card-height);
            transform-style: preserve-3d;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(225, 218, 202, 0.8); /* Semi-transparent for premium look */
            border: 1px solid rgba(178, 144, 121, 0.3);
            border-radius: 24px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px); /* Glassmorphism effect */
            cursor: pointer;
            opacity: 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .card h3 { color: #000; margin: 15px 0 10px; font-size: 1.6rem; font-family: 'Playfair Display', serif; }
        .card p { color: #444; font-size: 0.95rem; line-height: 1.6; }

        /* Positions Logic */
        #s1:checked ~ .cards-wrapper #card1,
        #s2:checked ~ .cards-wrapper #card2,
        #s3:checked ~ .cards-wrapper #card3,
        #s4:checked ~ .cards-wrapper #card4,
        #s5:checked ~ .cards-wrapper #card5 {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            z-index: 10;
        }

        #s1:checked ~ .cards-wrapper #card2,
        #s2:checked ~ .cards-wrapper #card3,
        #s3:checked ~ .cards-wrapper #card4,
        #s4:checked ~ .cards-wrapper #card5,
        #s5:checked ~ .cards-wrapper #card1 {
            transform: translate3d(75%, 0, -150px) rotateY(-25deg);
            opacity: 0.5;
            z-index: 5;
        }

        #s1:checked ~ .cards-wrapper #card5,
        #s2:checked ~ .cards-wrapper #card1,
        #s3:checked ~ .cards-wrapper #card2,
        #s4:checked ~ .cards-wrapper #card3,
        #s5:checked ~ .cards-wrapper #card4 {
            transform: translate3d(-75%, 0, -150px) rotateY(25deg);
            opacity: 0.5;
            z-index: 5;
        }

        /* Dots */
        .dots {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 12px;
            z-index: 200;
        }

        .dots label {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        #s1:checked ~ .dots label[for="s1"],
        #s2:checked ~ .dots label[for="s2"],
        #s3:checked ~ .dots label[for="s3"],
        #s4:checked ~ .dots label[for="s4"],
        #s5:checked ~ .dots label[for="s5"] {
            background: var(--accent);
            width: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="banner">
        <div class="bg-blur">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>

        <div class="header">
            <h1>WHY CHOOSE US</h1>
            <p>Innovation and quality at every step</p>
        </div>

        <div class="slider-container">
            <input type="radio" name="slider" id="s1" checked>
            <input type="radio" name="slider" id="s2">
            <input type="radio" name="slider" id="s3">
            <input type="radio" name="slider" id="s4">
            <input type="radio" name="slider" id="s5">

            <div class="cards-wrapper">
                <label class="card" id="card1" for="s1">
                    <img src="https://picsum.photos/200/200?random=21" alt="Color Consultancy">
                    <h3>Color Consultancy</h3>
                    <p>Crafting visually stunning interfaces that provide an unforgettable user experience.</p>
                </label>

                <label class="card" id="card2" for="s2">
                    <img src="https://picsum.photos/200/200?random=22" alt="Hassle-free Painting">
                    <h3>Hassle-free Painting</h3>
                    <p>Scalable and reliable cloud infrastructure to grow your business without limits.</p>
                </label>

                <label class="card" id="card3" for="s3">
                    <img src="https://picsum.photos/200/200?random=23" alt="On-time Completion">
                    <h3>On-time Completion</h3>
                    <p>Powerful analytics to help you make informed decisions based on real-time data.</p>
                </label>

                <label class="card" id="card4" for="s4">
                    <img src="https://picsum.photos/200/200?random=24" alt="warranty">
                    <h3>Service Warranty</h3>
                    <p>Protecting your digital assets with advanced end-to-end encryption technology.</p>
                </label>

                <label class="card" id="card5" for="s5">
                    <img src="https://picsum.photos/200/200?random=25" alt="No Hidden Cost">
                    <h3>No Hidden Cost</h3>
                    <p>Expanding your horizons with tools built for an international marketplace.</p>
                </label>
            </div>

            <div class="dots">
                <label for="s1"></label>
                <label for="s2"></label>
                <label for="s3"></label>
                <label for="s4"></label>
                <label for="s5"></label>
            </div>
        </div>
    </div>

</body>
</html>
