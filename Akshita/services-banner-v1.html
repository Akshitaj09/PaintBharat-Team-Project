<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Furniture Banner</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Banner Container */
        .banner {
            width: 1250px;
            height: 480px;
            background-color: #f3e9d7;
            position: relative;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Decorative Elements */
        .dot-grid {
            position: absolute;
            display: grid;
            grid-template-columns: repeat(4, 8px);
            gap: 8px;
            z-index: 1;
        }

        .dot {
            width: 4px;
            height: 4px;
            background-color: #333;
            border-radius: 50%;
        }

        /* Positioning Dots */
        .dots-top-mid { top: 80px; left: 400px; }
        .dots-bottom-mid { bottom: 40px; left: 750px; }

        .circle-outline {
            position: absolute;
            border: 2px solid #1a1a1a;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            z-index: 5;
        }
        .c-top { top: 70px; right: 50px; }
        .c-bottom { bottom: 70px; right: 50px; }

        /* Large Green Background Shape */
        .green-shape {
            position: absolute;
            right: -120px;
            top: -50px;
            width: 580px;
            height: 580px;
            background-color: #6a4a3a;
            border-radius: 50%;
            z-index: 2;
        }

        /* Left Side Content */
        .content-left {
            flex: 1.2;
            padding: 60px 0 60px 80px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            border: 2px solid #333;
            position: relative;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            top: -10px; left: 5px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #333;
        }

        .logo-text {
            font-weight: 800;
            line-height: 1;
            font-size: 18px;
            color: #1a1a1a;
        }

        .main-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 0.9;
            color: #1a1a1a;
            letter-spacing: -1px;
        }

        .main-title span {
            color: #5c483f;
        }

        .description {
            color: #666;
            font-size: 14px;
            width: 70%;
            margin: 20px 0 40px 0;
            line-height: 1.5;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        /* The Button with Request Hover Effects */
        .cta-btn {
            background-color: #5c483f;
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .cta-btn:hover {
            transform: scale(1.15); /* Expands */
            background-color: #2c2421; /* Changes color */
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #1a1a1a;
        }

        /* Right Side Image Area */
        .content-right {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container {
            width: 85%;
            height: 300px;
            background: url('https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&q=80&w=1000') center/cover;
            border-radius: 60px;
            border: 10px solid #ecdcab;
            position: relative;
        }

        /* Discount Tag */
        .discount-tag {
            position: absolute;
            top: -20px;
            left: -30px;
            background-color: #5c483f;
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .discount-tag span {
            display: block;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .discount-tag strong {
            font-size: 24px;
            display: block;
            margin: 2px 0;
        }
    </style>
</head>
<body>

    <div class="banner">
        <div class="dot-grid dots-top-mid">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="dot-grid dots-bottom-mid">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        
        <div class="circle-outline c-top"></div>
        <div class="circle-outline c-bottom"></div>
        <div class="green-shape"></div>

        <div class="content-left">
            <div class="logo-area">
                <div class="logo-icon"></div>
                <div class="logo-text">LOGO<br><span style="font-weight:400; font-size:10px;">TITLE HERE</span></div>
            </div>

            <div>
                <h1 class="main-title">HOME<br><span>INTERIOR DESIGN</span></h1>
                <p class="description">
                    Elevate Your Space, Elevate Your Life: Discover the Art of Home Design.
            </div>

            <div class="bottom-row">
                <button class="cta-btn">Get Free Estimate</button>
                <div class="info-item">📞 YOUR PHONE HERE</div>
                <div class="info-item">🌐 www.paintbharat.com</div>
            </div>
        </div>

        <div class="content-right">
            <div class="image-container">
                <div class="discount-tag">
                    <span>UPTO</span>
                    <strong>50%</strong>
                    <span>DISCOUNT</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
