<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintbharat Co. | Premium Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold-solid: #D4AF37; --warm-white: #f7f5f2; }
        body { background-color: var(--warm-white); font-family: 'Montserrat', sans-serif; margin: 0; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }

        /* Sidebar & Nav */
        .sidebar { width: 320px; height: 100vh; background: white; position: fixed; left: 0; border-right: 1px solid rgba(212,175,55,0.15); z-index: 100; padding: 4rem 0; display: flex; flex-direction: column; }
        .brand { padding: 0 3rem; margin-bottom: 5rem; }
        .nav-item { padding: 1.25rem 2rem; color: #666; cursor: pointer; transition: 0.4s; display: flex; align-items: center; border-radius: 100px; margin: 0 1rem; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.12em; }
        .nav-item.active { color: var(--gold-solid) !important; transform: translateX(8px); }
        .service-number { font-family: 'Playfair Display'; italic; margin-right: 2.2rem; opacity: 0.5; }

        /* Elegant Card & Hover */
        .elegant-card { position: relative; transition: 0.6s; cursor: pointer; }
        .image-viewport { position: relative; overflow: hidden; background: #f1efed; border: 1px solid transparent; transition: 0.6s; aspect-ratio: 4/5; display: flex; align-items: center; justify-content: center; }
        .elegant-card:hover .image-viewport { border-color: rgba(212,175,55,0.2); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08); }
        
        /* Golden Line Effect */
        .card-name { position: relative; display: inline-block; transition: 0.3s; }
        .card-name::after { 
            content: ''; position: absolute; width: 0; height: 1.5px; 
            bottom: -2px; left: 0; background-color: var(--gold-solid); 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .elegant-card:hover .card-name::after { width: 100%; }

        /* Hover Circular Button */
        .focus-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: 0.6s; opacity: 0; background: rgba(0,0,0,0.05); }
        .elegant-card:hover .focus-overlay { opacity: 1; }
        
        .view-btn-circle { 
            width: 85px; height: 85px; 
            border: 1px solid var(--gold-solid); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--gold-solid); font-size: 10px; 
            text-transform: uppercase; letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(12px);
            transform: scale(0.7); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .elegant-card:hover .view-btn-circle { transform: scale(1); }

        /* Filter Bar */
        .sticky-filter-bar { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 40; padding: 1.5rem 4rem; display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
        .filter-btn { background: #f8f9fa; border: 1px solid #e5e7eb; padding: 0.6rem 1.5rem; border-radius: 9999px; display: flex; align-items: center; gap: 0.75rem; font-size: 0.95rem; }
        .reset-btn { color: #ef4444; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-left: auto; border: 1px solid #fee2e2; padding: 0.5rem 1rem; border-radius: 50px; transition: 0.3s; }
        .reset-btn:hover { background: #fef2f2; }

        /* Mega Menu & WP Dropdown */
        .dropdown-parent { position: relative; }
        .brands-list { display: none; position: absolute; top: 100%; left: 0; background: white; min-width: 240px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border-radius: 12px; z-index: 100; padding: 10px 0; border: 1px solid rgba(0,0,0,0.05); }
        .dropdown-parent:hover .brands-list { display: block; }
        
        .brand-item, .wp-brand-item { padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; position: relative; cursor: pointer; color: #444; font-size: 0.9rem; }
        .brand-item:hover, .wp-brand-item:hover { color: var(--gold-solid); background: #fafafa; }
        
        .mega-menu { display: none; position: absolute; left: 100%; top: -10px; width: 780px; background: white; box-shadow: 25px 25px 60px rgba(0,0,0,0.1); border-radius: 20px; padding: 30px; border: 1px solid rgba(212,175,55,0.1); }
        .brand-item:hover .mega-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        
        .menu-col-title { color: var(--gold-solid); font-weight: 700; font-size: 0.75rem; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .menu-opt { color: #666; font-size: 0.85rem; padding: 4px 0; cursor: pointer; transition: 0.2s; }
        .menu-opt:hover { color: black; transform: translateX(5px); }

        /* Active Filter Chips */
        .filter-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; width: 100%; }
        .chip { background: #efebe5; color: #7a6e5d; font-size: 10px; padding: 4px 12px; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; }
        .chip-remove { cursor: pointer; opacity: 0.5; }
        .chip-remove:hover { opacity: 1; }

        /* Marquee */
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .marquee-container { overflow: hidden; background: #0b0b0b; padding: 4rem 0; cursor: pointer; }
        .marquee-content { display: flex; animation: marquee 40s linear infinite; }
        .marquee-container:hover .marquee-content { animation-play-state: paused; }

        /* Popup Modal */
        #details-popup { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); 
            backdrop-filter: blur(15px); z-index: 500; 
            display: none; align-items: center; justify-content: center; 
            padding: 2rem; opacity: 0; transition: 0.4s;
        }
        #details-popup.active { display: flex; opacity: 1; }
        .popup-card { 
            background: white; width: 100%; max-width: 950px; 
            display: flex; border-radius: 4px; overflow: hidden; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.15); transform: translateY(20px); transition: 0.5s;
            position: relative;
        }
        #details-popup.active .popup-card { transform: translateY(0); }

        .view-section { display: none; }
        .view-section.active { display: block; }
        .hero { height: 60vh; position: relative; overflow: hidden; display: flex; align-items: center; padding: 0 4rem; background: #111; }
        .hero-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.6; animation: zoom 20s forwards; }
        @keyframes zoom { from { transform: scale(1.1); } to { transform: scale(1); } }

        .bucket-wrapper { position: relative; width: 160px; height: 160px; }
        .bucket-label { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 900; color: #444; text-align: center; width: 70%; pointer-events: none; }

        #toast { position: fixed; bottom: 2rem; right: 2rem; transform: translateY(150%); transition: 0.5s; z-index: 2000; background: #1a1a1a; color: white; padding: 1rem 2rem; border-radius: 1rem; }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body class="flex">

    <div id="toast"><span id="toast-msg">Filter Applied</span></div>

    <!-- Details Popup -->
    <div id="details-popup" onclick="closePopup()">
        <div class="popup-card" onclick="event.stopPropagation()">
            <div class="w-1/2 bg-[#f8f6f2] h-[550px] p-8">
                <div id="popup-media-container" class="w-full h-full flex items-center justify-center overflow-hidden">
                    <img id="popup-img" src="" class="w-full h-full object-cover">
                    <div id="popup-bucket-svg" class="w-full h-full hidden"></div>
                </div>
            </div>
            <div class="w-1/2 p-14 flex flex-col justify-start relative">
                <div class="brand-line w-12 h-[1px] bg-[#D4AF37] mb-10"></div>
                
                <h2 id="popup-name" class="serif text-5xl mb-3 leading-tight">Product Name</h2>
                <p id="popup-brand" class="text-[10px] uppercase tracking-[0.3em] opacity-40 mb-12">Heritage Collection</p>
                
                <div class="grid grid-cols-1 gap-8 mb-12">
                    <div>
                        <p id="popup-meta-label" class="text-[10px] uppercase opacity-40 mb-2 font-bold tracking-widest">Specifications</p>
                        <p id="popup-meta-val" class="font-light text-xl italic serif">Detail Value</p>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase opacity-40 mb-2 font-bold tracking-widest">Price Guide</p>
                        <p id="popup-price" class="font-medium text-2xl text-[#D4AF37]">$0.00</p>
                    </div>
                </div>

                <div class="mt-auto flex flex-col items-start gap-6">
                    <button onclick="closePopup()" class="text-[10px] uppercase opacity-30 hover:opacity-100 tracking-[0.2em] transition-all">
                        ← Back to Gallery
                    </button>
                </div>

                <button class="absolute bottom-12 right-12 bg-black text-white py-5 px-10 text-[10px] uppercase tracking-[0.3em] hover:bg-[#D4AF37] transition-all shadow-xl">
                    Explore More
                </button>
            </div>
        </div>
    </div>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-line w-8 h-[1px] bg-[#D4AF37] mb-4"></div>
            <h1 class="serif text-2xl uppercase">Paintbharat <br><span class="text-[#D4AF37]">Co.</span></h1>
        </div>
        <nav>
            <div class="nav-item active" onclick="switchView('interior', this)"><span class="service-number">1</span>Interior</div>
            <div class="nav-item" onclick="switchView('exterior', this)"><span class="service-number">2</span>Exterior</div>
            <div class="nav-item" onclick="switchView('waterproof', this)"><span class="service-number">3</span>Waterproof</div>
            <div class="nav-item" onclick="switchView('wallpaper', this)"><span class="service-number">4</span>Wallpaper</div>
        </nav>
    </aside>

    <main class="ml-[320px] w-full">
        <!-- Interior View -->
        <div id="view-interior" class="view-section active">
            <div class="hero">
                <div class="hero-img" style="background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000')"></div>
                <h1 class="serif text-white text-7xl relative z-10">Interior Couture</h1>
            </div>
            <div class="sticky-filter-bar">
                <div class="dropdown-parent">
                    <button class="filter-btn">Painting Brands <i data-lucide="chevron-down" class="w-4 h-4 text-[#D4AF37]"></i></button>
                    <div class="brands-list" id="interior-menu"></div>
                </div>
                <button onclick="resetFilters('interior')" class="reset-btn">Reset Filters</button>
                <div id="interior-chips" class="filter-chips"></div>
            </div>
            <div id="interior-grid" class="grid grid-cols-4 gap-12 p-16"></div>
        </div>

        <!-- Exterior View -->
        <div id="view-exterior" class="view-section">
            <div class="hero">
                <div class="hero-img" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6199fbfd20?q=80&w=2000')"></div>
                <h1 class="serif text-white text-7xl relative z-10">Exterior Armor</h1>
            </div>
            <div class="sticky-filter-bar">
                <div class="dropdown-parent">
                    <button class="filter-btn">Painting Brands <i data-lucide="chevron-down" class="w-4 h-4 text-[#D4AF37]"></i></button>
                    <div class="brands-list" id="exterior-menu"></div>
                </div>
                <button onclick="resetFilters('exterior')" class="reset-btn">Reset Filters</button>
                <div id="exterior-chips" class="filter-chips"></div>
            </div>
            <div id="exterior-grid" class="grid grid-cols-4 gap-12 p-16"></div>
        </div>

        <!-- Waterproof View -->
        <div id="view-waterproof" class="view-section">
            <div class="hero">
                <div class="hero-img" style="background-image: url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=2000')"></div>
                <h1 class="serif text-white text-7xl relative z-10">Waterproofing</h1>
            </div>
            <div class="sticky-filter-bar justify-between">
                <div class="dropdown-parent">
                    <button class="filter-btn">Filter Brands <i data-lucide="chevron-down" class="w-4 h-4 text-[#D4AF37]"></i></button>
                    <div class="brands-list p-2">
                        <div class="wp-brand-item" onclick="updateFilter('waterproof', 'brand', 'Asian Paints')">Asian Paints</div>
                        <div class="wp-brand-item" onclick="updateFilter('waterproof', 'brand', 'Berger Paints')">Berger Paints</div>
                        <div class="wp-brand-item" onclick="updateFilter('waterproof', 'brand', 'Nerolac')">Nerolac</div>
                    </div>
                </div>
                <button onclick="resetFilters('waterproof')" class="reset-btn">Reset All</button>
                <div id="waterproof-chips" class="filter-chips"></div>
            </div>
            <div id="waterproof-grid" class="grid grid-cols-4 gap-12 p-16"></div>
        </div>

        <!-- Wallpaper View -->
        <div id="view-wallpaper" class="view-section">
            <div class="hero">
                <div class="hero-img" style="background-image: url('https://images.unsplash.com/photo-1615529182904-14819c35db37?q=80&w=2000')"></div>
                <h1 class="serif text-white text-7xl relative z-10">The Art of Living</h1>
            </div>
            <div class="marquee-container">
                <div class="marquee-content" id="wallpaper-marquee"></div>
            </div>
            
            <div class="bg-white pt-24 px-16">
                <h2 class="serif text-5xl mb-2 italic">Curated Designs</h2>
                <div class="w-12 h-1 bg-black mb-12"></div>
            </div>

            <div id="wallpaper-grid" class="grid grid-cols-4 gap-12 p-16 bg-white"></div>
        </div>
    </main>

    <script>
        const brands = ["Asian Paints", "Berger Paints", "Nerolac"];
        const intCats = ["Royale Glaze", "Velvet Infusion", "Silk Ethereal", "Eco-Couture", "Artisanal Mist"];
        const extCats = ["Titan Shield", "Ultima Armor", "Weather Sentinel", "Permatex Guard"];
        const finishesList = ["Satin", "Glossy", "Matte", "Eggshell"];
        const colorsList = ["Azure Soul", "Crimson Peak", "Amber Glow", "Umber Earth", "Cloud White"];
        const rangesList = ["Budget", "Mid-Range", "Exclusive"];

        let database = { interior: [], exterior: [], waterproof: [], wallpaper: [] };
        let activeFilters = { interior: {}, exterior: {}, waterproof: {}, wallpaper: {} };

        function initData() {
            // Requirement: 5 buckets for every price range
            const generateSet = (targetArray, cats, isExterior = false) => {
                brands.forEach(brand => {
                    rangesList.forEach((range, rIdx) => {
                        const basePrice = range === "Budget" ? 120 : range === "Mid-Range" ? 210 : 340;
                        // Create 5 distinct "buckets" per range
                        for(let i=1; i<=5; i++) {
                            const cat = cats[i % cats.length];
                            colorsList.forEach(color => {
                                finishesList.forEach(finish => {
                                    targetArray.push({
                                        type: 'paint',
                                        brand: brand,
                                        category: cat,
                                        color: color,
                                        finish: finish,
                                        range: range,
                                        name: `${cat} Series ${i}`, // Unique name for distinct buckets
                                        price: `$${basePrice + (i * 5)}`
                                    });
                                });
                            });
                        }
                    });
                });
            };

            generateSet(database.interior, intCats);
            generateSet(database.exterior, extCats, true);

            // Waterproofing
            brands.forEach(b => {
                for(let i=1; i<=10; i++) {
                    database.waterproof.push({ 
                        type: 'paint', brand: b, 
                        name: `${b} Shield Pro ${i}`, 
                        price: `$${180 + i*10}`, 
                        category: "Protection", range: "Mid-Range" 
                    });
                }
            });

            // Wallpaper
            const wpImages = [
                "https://images.unsplash.com/photo-1581092160562-40aa08e78837?q=80&w=800",
                "https://images.unsplash.com/photo-1558603668-6570496b66f8?q=80&w=800",
                "https://images.unsplash.com/photo-1533090161767-e6ffed986c88?q=80&w=800",
                "https://images.unsplash.com/photo-1615529182904-14819c35db37?q=80&w=800"
            ];
            for(let i=0; i<8; i++) {
                database.wallpaper.push({ 
                    type: 'wallpaper', brand: "Heritage", name: `Luxury Texture ${i+1}`, 
                    price: `$${120 + i*15}`, category: "Wall Decor", img: wpImages[i % 4],
                    size: "10ft x 8ft"
                });
            }
        }

        const getSVG = (brand, isPopup = false) => `
            <svg viewBox="0 0 200 200" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                <path d="M40,50 L160,50 L145,160 C143,175 130,185 115,185 L85,185 C70,185 57,175 55,160 L40,50 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                <ellipse cx="100" cy="50" rx="65" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
                <text x="100" y="${isPopup ? 110 : 105}" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="${isPopup ? 10 : 8}" fill="#999">${brand.toUpperCase()}</text>
            </svg>`;

        function render(view) {
            const grid = document.getElementById(`${view}-grid`);
            const chips = document.getElementById(`${view}-chips`);
            grid.innerHTML = '';
            
            const filters = activeFilters[view];
            let filteredData = database[view].filter(item => {
                return Object.keys(filters).every(key => !filters[key] || item[key] === filters[key]);
            });

            if(chips) {
                chips.innerHTML = '';
                Object.entries(filters).forEach(([key, val]) => {
                    if(val) {
                        const chip = document.createElement('div');
                        chip.className = "chip";
                        chip.innerHTML = `${key}: ${val} <i data-lucide="x" class="w-3 h-3 chip-remove" onclick="removeFilter('${view}', '${key}')"></i>`;
                        chips.appendChild(chip);
                    }
                });
                lucide.createIcons();
            }

            // Slice to show a healthy mix
            const displayData = filteredData.slice(0, 40);
            if(displayData.length === 0) {
                grid.innerHTML = `<div class="col-span-4 py-20 text-center opacity-30 serif text-2xl">No matching products found.</div>`;
                return;
            }

            displayData.forEach(item => {
                const card = document.createElement('div');
                card.className = "elegant-card group";
                card.onclick = () => openPopup(item);

                const media = item.img ? `<img src="${item.img}" class="w-full h-full object-cover">` : `<div class="bucket-wrapper">${getSVG(item.brand)}<div class="bucket-label">${item.category || item.name}</div></div>`;
                
                // Requirement Logic: Combine all active filters for display
                // If finish AND color are selected, show both.
                // If range is selected, show it.
                let attributeLabels = [];
                
                if (filters.range) attributeLabels.push(item.range);
                if (filters.finish) attributeLabels.push(item.finish);
                if (filters.color) attributeLabels.push(item.color);
                
                // If no specific refinement, default to Category
                if (attributeLabels.length === 0) attributeLabels.push(item.category);

                const label2Text = attributeLabels.join(' • ');

                card.innerHTML = `
                    <div class="image-viewport">
                        ${media}
                        <div class="focus-overlay">
                            <div class="view-btn-circle">View</div>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="serif text-xl card-name">${item.name}</h3>
                            <p class="text-[9px] uppercase tracking-widest opacity-30 mt-3 font-medium">${item.brand} • ${label2Text}</p>
                        </div>
                        <div class="text-right pl-4">
                           <span class="text-sm opacity-40 font-medium">${item.price}</span>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function openPopup(item) {
            const imgEl = document.getElementById('popup-img');
            const svgEl = document.getElementById('popup-bucket-svg');
            
            if(item.img) {
                imgEl.src = item.img;
                imgEl.classList.remove('hidden');
                svgEl.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                svgEl.classList.remove('hidden');
                svgEl.innerHTML = getSVG(item.brand, true);
            }

            document.getElementById('popup-name').innerText = item.name;
            document.getElementById('popup-brand').innerText = `${item.brand} — ${item.range || 'Standard'} Tier`;
            document.getElementById('popup-price').innerText = `${item.price} (Inclusive of VAT)`;
            
            const metaLabel = document.getElementById('popup-meta-label');
            const metaVal = document.getElementById('popup-meta-val');

            if(item.type === 'wallpaper') {
                metaLabel.innerText = "Dimensions";
                metaVal.innerText = item.size || "Standard Size";
            } else {
                metaLabel.innerText = "Selected Configuration";
                metaVal.innerText = `${item.finish || 'Any'} Finish / ${item.color || 'Base'} Tone`;
            }
            document.getElementById('details-popup').classList.add('active');
        }

        function closePopup() { document.getElementById('details-popup').classList.remove('active'); }

        function updateFilter(view, key, value) {
            if (value === null) delete activeFilters[view][key];
            else activeFilters[view][key] = value;
            render(view);
            showToast(`${key}: ${value || 'Cleared'}`);
        }

        function removeFilter(view, key) {
            delete activeFilters[view][key];
            render(view);
        }

        function resetFilters(view) {
            activeFilters[view] = {};
            render(view);
            showToast("Filters Cleared");
        }

        function switchView(view, btn) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            
            if(view === 'wallpaper') {
                const marquee = document.getElementById('wallpaper-marquee'); 
                marquee.innerHTML = '';
                [...database.wallpaper, ...database.wallpaper].forEach(w => {
                    marquee.innerHTML += `
                        <div class="w-[300px] mx-8 flex-shrink-0 group cursor-pointer" onclick="openPopup(${JSON.stringify(w).replace(/"/g, '&quot;')})">
                            <div class="aspect-[4/5] bg-stone-200 overflow-hidden relative">
                                <img src="${w.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                                <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                    <div class="view-btn-circle border-white text-white">View</div>
                                </div>
                            </div>
                            <p class="text-white mt-4 serif text-center text-lg italic opacity-80 group-hover:opacity-100">${w.name}</p>
                        </div>`;
                });
            }
            render(view);
        }

        function buildMenus() {
            ['interior', 'exterior'].forEach(view => {
                const container = document.getElementById(`${view}-menu`);
                const cats = view === 'interior' ? intCats : extCats;
                brands.forEach(b => {
                    const item = document.createElement('div');
                    item.className = "brand-item";
                    item.innerHTML = `
                        <span>${b}</span> <i data-lucide="chevron-right" class="w-3 h-3 opacity-20"></i>
                        <div class="mega-menu" onclick="event.stopPropagation()">
                            <div><div class="menu-col-title">Categories</div>${cats.map(c => `<div class="menu-opt" onclick="updateFilter('${view}', 'category', '${c}'); updateFilter('${view}', 'brand', '${b}')">${c}</div>`).join('')}</div>
                            <div><div class="menu-col-title">Finishes</div>${finishesList.map(f => `<div class="menu-opt" onclick="updateFilter('${view}', 'finish', '${f}'); updateFilter('${view}', 'brand', '${b}')">${f}</div>`).join('')}</div>
                            <div><div class="menu-col-title">Colors</div>${colorsList.map(c => `<div class="menu-opt" onclick="updateFilter('${view}', 'color', '${c}'); updateFilter('${view}', 'brand', '${b}')">${c}</div>`).join('')}</div>
                            <div><div class="menu-col-title">Price Range</div>${rangesList.map(r => `<div class="menu-opt" onclick="updateFilter('${view}', 'range', '${r}'); updateFilter('${view}', 'brand', '${b}')">${r}</div>`).join('')}</div>
                        </div>`;
                    item.addEventListener('click', () => updateFilter(view, 'brand', b));
                    container.appendChild(item);
                });
            });
        }

        function showToast(m) { 
            const t = document.getElementById("toast"); 
            document.getElementById("toast-msg").innerText = m; 
            t.classList.add("show"); 
            setTimeout(() => t.classList.remove("show"), 2000); 
        }

        window.onload = () => { initData(); buildMenus(); render('interior'); lucide.createIcons(); };
    </script>
</body>
</html>
