<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat Co. | Interior Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg-color: #d8ccc4;
            --accent-dark: #2a2a2a;
            --accent-brown: #a07856; /* Brown color for border */
            --text-main: #333;
            --text-light: #666;
            --accent-blue: #007bff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #333; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-banner {
            width: 95%;
            max-width: 1100px;
            height: 550px;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        nav {
            position: absolute;
            top: 40px;
            left: 50px;
            right: 50px;
            display: flex;
            justify-content: flex-end;
            z-index: 10;
        }

        .logo { 
            font-weight: 650; 
            font-size: 0.95rem; 
            font-family: 'Playfair Display'; 
            color: var(--accent-dark);
        }

        .content-side {
            flex: 1.2;
            padding-left: 80px;
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-size: 2.2rem;
            font-family: 'Playfair Display', serif;
            line-height: 1.2;
            color: var(--accent-dark);
            margin-bottom: 5px;
        }

        .subtext {
            color: var(--text-light);
            margin-bottom: 25px;
            max-width: 320px;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        /* --- Input Styling with Brown Focus --- */
        .booking-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            padding: 25px;
            width: 380px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .input-group { margin-bottom: 15px; }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 2px solid transparent; /* Base border */
            background: white;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Border becomes brown on click/focus */
        input:focus {
            border: 2px solid var(--accent-brown);
            box-shadow: 0 0 8px rgba(160, 120, 86, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .checkbox-group input { display: none; }

        .custom-box {
            height: 18px; width: 18px;
            background-color: white;
            border-radius: 3px;
            margin-right: 10px;
            position: relative;
        }

        .checkbox-group input:checked ~ .custom-box { background-color: var(--accent-blue); }
        .custom-box:after {
            content: "";
            position: absolute;
            display: none;
            left: 6px; top: 2px;
            width: 4px; height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-group input:checked ~ .custom-box:after { display: block; }

        .btn-book {
            width: 100%;
            background: var(--accent-dark);
            color: white;
            padding: 15px;
            border: none;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* --- Individual Image Hover Zoom --- */
        .image-side {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .arch-outer {
            width: 85%;
            height: 85%;
            border-top-left-radius: 500px;
            border-top-right-radius: 500px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }

        .partition-left, .partition-right { 
            flex: 1; 
            background-size: cover;
            background-position: center;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        .partition-left { background-image: url('img/left\ image.PNG'); }
        .partition-right { background-image: url('img/right\ img.PNG'); }

        /* Zoom effect on specific side hover */
        .partition-left:hover, .partition-right:hover {
            transform: scale(1.15);
            z-index: 2; /* Keeps the zoomed image on top slightly */
        }

    </style>
</head>
<body>

    <div class="main-banner">
        <nav>
            <div class="logo">PaintBharat Co.</div>
        </nav>

        <section class="content-side">
            <h1>Book Free Site Visit</h1>
            <p class="subtext">Expert advice with transparent pricing for your dream home.</p>
            
            <div class="booking-card">
                <div class="input-group">
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Enter your email address">
                </div>
                <div class="input-group">
                    <input type="tel" placeholder="Enter your contact no.">
                </div>

                <label class="checkbox-group">
                    <input type="checkbox">
                    <span class="custom-box"></span>
                    Already hired a painter?
                </label>

                <button class="btn-book">SCHEDULE NOW</button>
            </div>
        </section>

        <section class="image-side">
            <div class="arch-outer">
                <div class="partition-left"></div>
                <div class="partition-right"></div>
            </div>
        </section>
    </div>

</body>
</html>
