<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life at PB | Team & Culture</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #111827;
            --primary-hover: #000000;
            --text-main: #111827;
            --text-light: #4b5563;
            --white: #ffffff;
            --wave-color: rgba(17, 24, 39, 0.03); 
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            --gap: 1.25rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--white);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* --- Flowing Background Waves --- */
        .waves-container {
            position: fixed;
            left: 0;
            width: 100%;
            height: 35vh;
            z-index: -1;
            pointer-events: none;
        }

        .waves-container.top {
            top: 0;
            transform: rotate(180deg);
        }

        .waves {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .parallax > use {
            animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
        }
        .parallax > use:nth-child(1) {
            animation-delay: -2s;
            animation-duration: 7s;
            fill: rgba(17, 24, 39, 0.02);
        }
        .parallax > use:nth-child(2) {
            animation-delay: -3s;
            animation-duration: 10s;
            fill: rgba(17, 24, 39, 0.04);
        }
        .parallax > use:nth-child(3) {
            animation-delay: -4s;
            animation-duration: 13s;
            fill: rgba(17, 24, 39, 0.01);
        }
        .parallax > use:nth-child(4) {
            animation-delay: -5s;
            animation-duration: 20s;
            fill: rgba(17, 24, 39, 0.05);
        }

        @keyframes move-forever {
            0% { transform: translate3d(-90px, 0, 0); }
            100% { transform: translate3d(85px, 0, 0); }
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 5rem 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Header Section --- */
        header {
            margin-bottom: 4rem;
            position: relative;
            z-index: 1;
        }

        .header-content h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .header-content p {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 550px;
            font-weight: 400;
        }

        /* --- Refined Masonry Grid --- */
        .collage-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 220px);
            gap: var(--gap);
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .grid-item {
            position: relative;
            border-radius: 0;
            overflow: hidden;
            background: #f9fafb;
            transition: var(--transition);
            opacity: 0;
            animation: slideIn 0.8s ease-out forwards;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .grid-item:nth-child(1) { grid-column: 1 / 2; grid-row: 1 / 3; animation-delay: 0.1s; }
        .grid-item:nth-child(2) { grid-column: 2 / 4; grid-row: 1 / 2; animation-delay: 0.2s; }
        .grid-item:nth-child(3) { grid-column: 4 / 5; grid-row: 1 / 3; animation-delay: 0.3s; }
        .grid-item:nth-child(4) { grid-column: 2 / 3; grid-row: 2 / 4; animation-delay: 0.4s; }
        .grid-item:nth-child(5) { grid-column: 3 / 4; grid-row: 2 / 3; animation-delay: 0.5s; }
        .grid-item:nth-child(6) { grid-column: 1 / 2; grid-row: 3 / 4; animation-delay: 0.6s; }
        .grid-item:nth-child(7) { grid-column: 3 / 5; grid-row: 3 / 4; animation-delay: 0.7s; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .overlay span {
            color: white;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.5);
            backdrop-filter: blur(2px);
            transform: translateY(10px);
            transition: var(--transition);
        }

        .grid-item:hover img { transform: scale(1.05); }
        .grid-item:hover .overlay { opacity: 1; }
        .grid-item:hover .overlay span { transform: translateY(0); }

        /* --- Bottom Right Button --- */
        .footer-action {
            display: flex;
            justify-content: flex-end;
            margin-top: 4rem;
            padding-bottom: 2rem;
            position: relative;
            z-index: 10;
        }

        .contact-btn {
            padding: 1.25rem 3rem;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: var(--transition);
            border: 1px solid var(--primary);
        }

        .contact-btn:hover {
            background: var(--white);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .header-content h1 { font-size: 2.5rem; }
            .collage-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
                grid-auto-rows: 200px;
            }
            .grid-item { grid-column: span 1 !important; grid-row: span 1 !important; }
            .grid-item:nth-child(2), .grid-item:nth-child(7) { grid-column: span 2 !important; }
            .waves-container { height: 15vh; }
        }

        @media (max-width: 480px) {
            .collage-grid { grid-template-columns: 1fr; }
            .grid-item { grid-column: span 1 !important; grid-row: span 1 !important; }
        }
    </style>
</head>
<body>

    <!-- Flowing Background Waves (Top) -->
    <div class="waves-container top">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
             viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" />
                <use xlink:href="#gentle-wave" x="48" y="3" />
                <use xlink:href="#gentle-wave" x="48" y="5" />
                <use xlink:href="#gentle-wave" x="48" y="7" />
            </g>
        </svg>
    </div>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>Life at PB</h1>
                <p>Empowering our teams through a shared vision of creativity, collaboration, and continuous excellence.</p>
            </div>
        </header>

        <main class="collage-grid">
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80&w=600" alt="Team Work">
                <div class="overlay"><span>Synergy</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&q=80&w=800" alt="Meeting Strategy">
                <div class="overlay"><span>Focus</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&q=80&w=600" alt="Workspace">
                <div class="overlay"><span>Space</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80&w=600" alt="Culture">
                <div class="overlay"><span>Joy</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&q=80&w=600" alt="Innovation">
                <div class="overlay"><span>Create</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=600" alt="Learning">
                <div class="overlay"><span>Growth</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&q=80&w=800" alt="Impact">
                <div class="overlay"><span>Future</span></div>
            </div>
        </main>

        <div class="footer-action">
            <a href="#" class="contact-btn">Contact Us</a>
        </div>
    </div>

</body>
</html>
