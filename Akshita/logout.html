<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Modern UI</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Reduced alpha from 0.5 to 0.25 for more transparency */
            --glass-bg: rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-beige:#6b4229;
            --primary-beige-hover: #bc8a5f;
            --text-main: #ffffff;
            --text-soft: #cccccc;
            --success-green: #4ade80;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* Full Screen Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* Common Card Style - Increased blur and transparency */
        .card {
            position: absolute;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            /* Increased blur from 25px to 30px for a more premium glass look */
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            
            border: 1px solid var(--glass-border); 
            
            border-radius: 32px;
            padding: 60px 45px;
            
            /* Deeper shadow to compensate for higher transparency */
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.9);
            
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
        }

        /* Close Icon */
        .close-btn {
            position: absolute;
            top: 24px;
            right: 28px;
            cursor: pointer;
            color: var(--text-soft);
            font-size: 28px;
            line-height: 1;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .close-btn:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        /* Avatar & Icons */
        .icon-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            padding: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .success-icon {
            color: var(--success-green);
            font-size: 42px;
            font-weight: bold;
        }

        /* Typography */
        h1 {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        p {
            color: var(--text-soft);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-logout, .btn-primary {
            background: var(--primary-beige);
            color: #b8acac;
        }

        .btn:hover {
            transform: scale(1.04);
            filter: brightness(1.1);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
        }

        /* Toast Message */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 18px 30px;
            border-radius: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform: translateX(130%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            background: var(--success-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #000;
        }

        /* Small screen adjustments */
        @media (max-width: 500px) {
            .card {
                padding: 45px 25px;
                max-width: 90%;
            }
            .btn-group {
                flex-direction: column;
                gap: 12px;
            }
            .toast {
                left: 20px;
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="bg-overlay"></div>

        <!-- Initial Logout Confirmation Card -->
        <div class="card" id="logoutCard">
            <div class="close-btn" id="closeBtn" title="Close">&times;</div>
            <div class="icon-container">
                <img src="https://i.pinimg.com/736x/90/9d/b4/909db4e9f9859e1b52f60baee027dff2.jpg" alt="User Avatar" class="avatar-img">
            </div>
            <h1>Are you logging out?</h1>
            <p>You can always log back in at any time.</p>
            <div class="btn-group">
                <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn btn-logout" id="confirmLogoutBtn">Log Out</button>
            </div>
        </div>

        <!-- Success "Logged Out" Card -->
        <div class="card hidden" id="successCard">
            <div class="icon-container">
                <div class="success-icon">✓</div>
            </div>
            <h1>Logged Out</h1>
            <p>You have been safely signed out of your account. See you soon!</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="location.reload()">Back to Login</button>
            </div>
        </div>
    </div>

    <!-- Bottom Right Toast -->
    <div class="toast" id="logoutToast">
        <div class="toast-icon">✓</div>
        <span>Successfully Logged Out</span>
    </div>

    <script>
        const logoutCard = document.getElementById('logoutCard');
        const successCard = document.getElementById('successCard');
        const logoutToast = document.getElementById('logoutToast');
        const closeBtn = document.getElementById('closeBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmLogoutBtn = document.getElementById('confirmLogoutBtn');

        const hideAll = () => {
            logoutCard.classList.add('hidden');
            successCard.classList.add('hidden');
        };

        closeBtn.addEventListener('click', hideAll);
        cancelBtn.addEventListener('click', hideAll);

        confirmLogoutBtn.addEventListener('click', () => {
            confirmLogoutBtn.innerText = "Logging out...";
            confirmLogoutBtn.disabled = true;
            
            setTimeout(() => {
                logoutCard.classList.add('hidden');
                
                setTimeout(() => {
                    successCard.classList.remove('hidden');
                }, 300);

                logoutToast.classList.add('show');

                setTimeout(() => {
                    logoutToast.classList.remove('show');
                }, 4000);

            }, 1200);
        });
    </script>
</body>
</html>
