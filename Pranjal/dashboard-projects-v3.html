<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management Dashboard</title>
    <style>
        :root {
            --bg-page: #f9f7f4; 
            --card-bg: #ffffff;
            --primary-text: #2d261a;
            --secondary-text: #7c7263;
            --accent-brown: #4a3e2e;
            --border-color: #e8e2d9;
            --completed-color: #718355;
            --ongoing-color: #c89d2c;
            --incomplete-color: #b54d3a;
            --input-bg: #fffbf5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--primary-text);
            padding: 40px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .header-info h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-info p {
            color: var(--secondary-text);
            font-size: 1.1rem;
        }

        .add-btn {
            background-color: var(--accent-brown);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            cursor: default;
        }

        .stat-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .stat-completed:hover {
            box-shadow: 0 20px 30px -10px rgba(113, 131, 85, 0.25);
            border-color: var(--completed-color);
        }

        .stat-ongoing:hover {
            box-shadow: 0 20px 30px -10px rgba(200, 157, 44, 0.25);
            border-color: var(--ongoing-color);
        }

        .stat-incomplete:hover {
            box-shadow: 0 20px 30px -10px rgba(181, 77, 58, 0.25);
            border-color: var(--incomplete-color);
        }

        .stat-card .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .stat-card:hover .icon-box {
            transform: rotate(-10deg) scale(1.1);
        }

        .stat-completed .icon-box { background: #f0f4e8; color: var(--completed-color); }
        .stat-ongoing .icon-box { background: #fef9e7; color: var(--ongoing-color); }
        .stat-incomplete .icon-box { background: #fef2f0; color: var(--incomplete-color); }

        .stat-card h2 {
            font-size: 3.2rem;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-card p {
            color: var(--secondary-text);
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-btn {
            padding: 10px 24px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--secondary-text);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent-brown);
            color: white;
            border-color: var(--accent-brown);
        }

        /* FIXED: Projects Grid logic for consistent sizing */
        .project-grid {
            display: grid;
            /* Using fixed 3 columns for desktop to match the stats grid appearance */
            grid-template-columns: repeat(3, 1fr); 
            gap: 24px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            min-height: 600px;
            align-content: start; /* Prevents stretching if rows are empty */
        }

        /* Responsive adjustment for grid */
        @media (max-width: 1100px) {
            .project-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .project-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            height: fit-content; /* Ensure height is consistent with content */
            min-height: 220px;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px -5px rgba(0,0,0,0.08);
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--primary-text);
        }

        .progress-container {
            margin-top: 10px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--secondary-text);
            font-weight: 500;
        }

        .progress-bar {
            height: 8px;
            background: #f0eee9;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%; 
            transition: width 1.2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .fill-completed { background: var(--completed-color); }
        .fill-ongoing { background: var(--ongoing-color); }
        .fill-incomplete { background: var(--incomplete-color); }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .date-info {
            font-size: 0.85rem;
            color: var(--secondary-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-details-btn {
            background: transparent;
            border: none;
            color: var(--primary-text);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(45, 38, 26, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 640px;
            border-radius: 24px;
            padding: 32px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-modal {
            background: #f3efea;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--secondary-text);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--secondary-text);
        }

        input, select, textarea {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            font-size: 1rem;
            outline: none;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--accent-brown);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .detail-item {
            background: #fdfcfb;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .detail-item .icon {
            width: 40px;
            height: 40px;
            background: #f5f1eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-brown);
        }

        .detail-item .text span {
            display: block;
            font-size: 0.75rem;
            color: var(--secondary-text);
            margin-bottom: 2px;
        }

        .detail-item .text p { font-weight: 600; font-size: 0.95rem; }

        .description-box {
            background: #fdfcfb;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-msg {
            background: var(--accent-brown);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            font-weight: 500;
        }

        .toast-msg.success { border-left: 6px solid var(--completed-color); }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast-msg.hide {
            animation: fadeOut 0.3s ease-in forwards;
        }
        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        .status-tag {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-completed { background: #f0f4e8; color: var(--completed-color); }
        .status-ongoing { background: #fef9e7; color: var(--ongoing-color); }
        .status-incomplete { background: #fef2f0; color: var(--incomplete-color); }
    </style>
</head>
<body>

    <header>
        <div class="header-info">
            <h1>Project Management</h1>
            <p>Track performance and project progress in real-time</p>
        </div>
        <button class="add-btn" onclick="openAddModal()">
            <span>+</span> Add Project
        </button>
    </header>

    <div class="stats-grid">
        <div class="stat-card stat-completed" onclick="filterProjects('Completed')" style="cursor: pointer;">
            <div class="icon-box">✓</div>
            <h2 id="count-completed">3</h2>
            <h3>Completed Projects</h3>
            <p>+12% from last month</p>
        </div>
        <div class="stat-card stat-ongoing" onclick="filterProjects('Ongoing')" style="cursor: pointer;">
            <div class="icon-box">↻</div>
            <h2 id="count-ongoing">4</h2>
            <h3>Ongoing Projects</h3>
            <p>On track and progressing</p>
        </div>
        <div class="stat-card stat-incomplete" onclick="filterProjects('Incomplete')" style="cursor: pointer;">
            <div class="icon-box">⚠</div>
            <h2 id="count-incomplete">2</h2>
            <h3>Incomplete Projects</h3>
            <p>Needs attention</p>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="All" onclick="filterProjects('All')">All Projects</button>
        <button class="filter-btn" data-filter="Completed" onclick="filterProjects('Completed')">Completed</button>
        <button class="filter-btn" data-filter="Ongoing" onclick="filterProjects('Ongoing')">Ongoing</button>
        <button class="filter-btn" data-filter="Incomplete" onclick="filterProjects('Incomplete')">Incomplete</button>
    </div>

    <div class="project-grid" id="projectGrid">
        <!-- Dynamic Cards -->
    </div>

    <div class="modal-overlay" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Project</h2>
                <button class="close-modal" onclick="closeModals()">×</button>
            </div>
            <form id="projectForm">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Project Name</label>
                        <input type="text" id="pName" placeholder="Enter project name" required>
                    </div>
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" id="pClient" placeholder="Enter client name" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="pLocation" placeholder="Enter location" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="pStatus" required>
                            <option value="Ongoing">Ongoing</option>
                            <option value="Completed">Completed</option>
                            <option value="Incomplete">Incomplete</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Progress (%)</label>
                        <input type="number" id="pProgress" min="0" max="100" value="0" required>
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="pStart" required>
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="pDeadline" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="pDesc" rows="3" placeholder="Enter project description"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModals()">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveBtn">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="viewModal">
        <div class="modal-content" id="viewContent"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let projects = [
            { id: 1, name: "Mumbai Luxury Villa", client: "Sharma Residency", location: "Juhu, Mumbai", status: "Completed", progress: 100, date: "Feb 15, 2026", start: "2025-10-01", deadline: "2026-02-15", desc: "High-end residential interior project featuring premium marble finishes and smart home integration." },
            { id: 2, name: "Corporate Office Tower", client: "TechCorp Solutions", location: "BKC, Mumbai", status: "Ongoing", progress: 68, date: "Apr 30, 2026", start: "2026-02-01", deadline: "2026-04-30", desc: "Multi-floor corporate office painting with modern color schemes and specialized coatings." },
            { id: 3, name: "Heritage Restoration", client: "Cultural Foundation", location: "Old Delhi", status: "Ongoing", progress: 45, date: "Jun 20, 2026", start: "2026-01-10", deadline: "2026-06-20", desc: "Careful restoration of historical facade using traditional lime-based materials." },
            { id: 4, name: "Coastal Resort", client: "Paradise Hotels", location: "Goa", status: "Completed", progress: 100, date: "Jan 10, 2026", start: "2025-08-15", deadline: "2026-01-10", desc: "Complete exterior and interior renovation for a 50-room boutique resort." },
            { id: 5, name: "Residential Complex", client: "Skyline Builders", location: "Pune", status: "Incomplete", progress: 22, date: "Mar 25, 2026", start: "2026-02-20", deadline: "2026-03-25", desc: "Delayed due to supply chain issues. Painting work for Phase 1 buildings." },
            { id: 6, name: "Boutique Hotel", client: "Luxury Stays Ltd", location: "Jaipur", status: "Ongoing", progress: 78, date: "May 15, 2026", start: "2026-03-01", deadline: "2026-05-15", desc: "Traditional Rajasthani aesthetic combined with modern hospitality standards." }
        ];

        let currentFilter = 'All';

        const progressObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const bar = entry.target;
                const val = bar.getAttribute('data-progress');
                if (entry.isIntersecting) {
                    bar.style.width = val + '%';
                } else {
                    bar.style.width = '0%';
                }
            });
        }, { threshold: 0.1 });

        function showNotification(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-msg success';
            toast.innerHTML = `<span>✓</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function updateCounts() {
            document.getElementById('count-completed').innerText = projects.filter(p => p.status === 'Completed').length;
            document.getElementById('count-ongoing').innerText = projects.filter(p => p.status === 'Ongoing').length;
            document.getElementById('count-incomplete').innerText = projects.filter(p => p.status === 'Incomplete').length;
        }

        function renderProjects() {
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = '';
            const filtered = currentFilter === 'All' 
                ? projects 
                : projects.filter(p => p.status === currentFilter);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-title">${p.name}</div>
                    <div class="progress-container">
                        <div class="progress-header">
                            <span>Progress</span>
                            <span>${p.progress}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill fill-${p.status.toLowerCase()}" 
                                 data-progress="${p.progress}"></div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="date-info">📅 ${p.date}</div>
                        <button class="view-details-btn" onclick="viewDetails(${p.id})">
                            View Details →
                        </button>
                    </div>
                `;
                grid.appendChild(card);
                const bar = card.querySelector('.progress-fill');
                progressObserver.observe(bar);
            });

            updateCounts();
        }

        function filterProjects(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
            });
            renderProjects();
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Add New Project";
            document.getElementById('saveBtn').innerText = "Save Project";
            document.getElementById('editId').value = "";
            document.getElementById('projectForm').reset();
            document.getElementById('projectModal').style.display = 'flex';
        }

        function openEditModal(id) {
            const p = projects.find(proj => proj.id == id);
            if (!p) return;
            document.getElementById('modalTitle').innerText = "Edit Project";
            document.getElementById('saveBtn').innerText = "Update Project";
            document.getElementById('editId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pClient').value = p.client;
            document.getElementById('pLocation').value = p.location;
            document.getElementById('pStatus').value = p.status;
            document.getElementById('pProgress').value = p.progress;
            document.getElementById('pStart').value = p.start;
            document.getElementById('pDeadline').value = p.deadline;
            document.getElementById('pDesc').value = p.desc;
            document.getElementById('viewModal').style.display = 'none';
            document.getElementById('projectModal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('projectModal').style.display = 'none';
            document.getElementById('viewModal').style.display = 'none';
        }

        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const deadlineDate = new Date(document.getElementById('pDeadline').value);
            const dateStr = deadlineDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            const projectData = {
                name: document.getElementById('pName').value,
                client: document.getElementById('pClient').value,
                location: document.getElementById('pLocation').value,
                status: document.getElementById('pStatus').value,
                progress: parseInt(document.getElementById('pProgress').value),
                date: dateStr,
                start: document.getElementById('pStart').value,
                deadline: document.getElementById('pDeadline').value,
                desc: document.getElementById('pDesc').value || "No description provided."
            };

            if (editId) {
                const index = projects.findIndex(p => p.id == editId);
                projects[index] = { ...projects[index], ...projectData };
                showNotification("Project updated successfully!");
            } else {
                const newProj = { id: Date.now(), ...projectData };
                projects.unshift(newProj);
                showNotification("Project saved successfully!");
            }
            renderProjects();
            closeModals();
        });

        function viewDetails(id) {
            const p = projects.find(proj => proj.id === id);
            if (!p) return;
            const modal = document.getElementById('viewModal');
            const content = document.getElementById('viewContent');
            content.innerHTML = `
                <div class="modal-header">
                    <h2>Project Overview</h2>
                    <button class="close-modal" onclick="closeModals()">×</button>
                </div>
                <div style="margin-bottom: 24px;">
                    <h1 style="font-size: 1.8rem; margin-bottom: 8px;">${p.name}</h1>
                    <span class="status-tag status-${p.status.toLowerCase()}">${p.status}</span>
                </div>
                <div class="detail-row">
                    <div class="detail-item">
                        <div class="icon">👤</div>
                        <div class="text"><span>Client</span><p>${p.client}</p></div>
                    </div>
                    <div class="detail-item">
                        <div class="icon">📍</div>
                        <div class="text"><span>Location</span><p>${p.location}</p></div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-item">
                        <div class="icon">📅</div>
                        <div class="text"><span>Start Date</span><p>${p.start}</p></div>
                    </div>
                    <div class="detail-item">
                        <div class="icon">🏁</div>
                        <div class="text"><span>Deadline</span><p>${p.deadline}</p></div>
                    </div>
                </div>
                <div class="progress-container" style="margin: 20px 0;">
                    <div class="progress-header"><span style="font-weight:600">Completion</span><span>${p.progress}%</span></div>
                    <div class="progress-bar" style="height:12px">
                        <div class="progress-fill fill-${p.status.toLowerCase()}" style="width: ${p.progress}%"></div>
                    </div>
                </div>
                <div class="description-box">
                    <span style="font-size: 0.8rem; color: var(--secondary-text); font-weight: 600; text-transform: uppercase;">Description</span>
                    <p style="margin-top: 10px; line-height: 1.6;">${p.desc}</p>
                </div>
                <div class="modal-footer" style="margin-top: 32px; flex-direction: column;">
                    <button class="btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="openEditModal(${p.id})">Edit Project</button>
                    <button class="btn-secondary" style="width: 100%" onclick="closeModals()">Close</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        window.onload = renderProjects;
    </script>
</body>
</html>
