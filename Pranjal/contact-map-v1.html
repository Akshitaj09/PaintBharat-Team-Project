<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contact – Golden Store Locator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
  --bg:#faf9f7;
  --text:#1f1f1f;
  --muted:#666;

  --gold-1:#f7d774;
  --gold-2:#d4af37;
  --gold-3:#b8962e;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:
    radial-gradient(circle at top right, #f7d77433, transparent 40%),
    radial-gradient(circle at bottom left, #d4af3722, transparent 45%),
    var(--bg);
  color:var(--text);
}

/* SECTION */
.contact{
  max-width:1200px;
  margin:auto;
  padding:100px 20px;
}

.header{
  text-align:center;
  margin-bottom:50px;
}

.header h1{
  font-size:clamp(40px,5vw,56px);
}

.header p{
  max-width:600px;
  margin:12px auto 0;
  color:var(--muted);
}

/* LAYOUT */
.map-wrapper{
  display:grid;
  grid-template-columns:1.4fr .6fr;
  gap:20px;
  align-items:flex-start; /* 🔥 card no longer stretched */
}

/* MAP */
#map{
  height:360px; /* 🔥 reduced height */
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.12);
}

/* GOLD CARD */
.store-info{
  border-radius:22px;
  padding:1.5px;
  background:linear-gradient(
    135deg,
    var(--gold-1),
    var(--gold-2),
    var(--gold-3)
  );
  box-shadow:0 28px 70px rgba(212,175,55,.35);
}

/* INNER CARD */
.store-inner{
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(18px);
  border-radius:20px;
  overflow:hidden;
}

/* PLACEHOLDER */
.placeholder{
  padding:40px;
  text-align:center;
  color:var(--muted);
}

/* IMAGE */
.store-image{
  height:140px; /* 🔥 smaller image */
  background-size:cover;
  background-position:center;
}

/* CONTENT */
.store-content{
  padding:22px;
}

.store-content h3{
  font-size:20px;
  margin-bottom:6px;
}

.location{
  font-size:14px;
  color:var(--muted);
  margin-bottom:14px;
}

/* DETAILS */
.detail{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-bottom:12px;
}

/* ICON */
.icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--gold-1),var(--gold-2));
  font-size:15px;
  box-shadow:0 5px 14px rgba(237,196,58,.75);
}

/* MOBILE */
@media(max-width:900px){
  .map-wrapper{
    grid-template-columns:1fr;
  }

  #map{
    height:300px;
  }
}
</style>
</head>

<body>

<section class="contact">
  <div class="header">
    <h1>Find Our Stores</h1>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>

    <div id="storeInfo" class="store-info">
      <div class="store-inner placeholder">
        Click any map pin to explore the store
      </div>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const stores = [
  {
    name:"Hinjewadi IT Park",
    city:"Hinjewadi Phase 1, Pune",
    phone:"+91 98765 43210",
    image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab",
    coords:[18.5913,73.7389]
  },
  {
    name:"Wakad Branch",
    city:"Wakad, Pune",
    phone:"+91 91234 56789",
    image:"https://images.unsplash.com/photo-1503387762-592deb58ef4e",
    coords:[18.5993,73.7625]
  },
  {
    name:"Baner Experience Center",
    city:"Baner, Pune",
    phone:"+91 90909 80808",
    image:"https://images.unsplash.com/photo-1497366216548-37526070297c",
    coords:[18.5590,73.7868]
  }
];

const map = L.map('map').setView([18.5204,73.8567],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

const infoBox = document.getElementById("storeInfo");

stores.forEach(store=>{
  const marker = L.marker(store.coords).addTo(map);

  marker.on("click",()=>{
    infoBox.innerHTML = `
      <div class="store-inner">
        <div class="store-image" style="background-image:url('${store.image}')"></div>
        <div class="store-content">
          <h3>${store.name}</h3>
          <div class="location">${store.city}</div>

          <div class="detail">
            <div class="icon">📍</div>
            <div>${store.city}, Maharashtra</div>
          </div>

          <div class="detail">
            <div class="icon">📞</div>
            <div>${store.phone}</div>
          </div>
        </div>
      </div>
    `;
  });
});
</script>

</body>
</html>
