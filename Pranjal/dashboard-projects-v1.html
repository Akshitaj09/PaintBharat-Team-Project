<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Project Management Dashboard</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* PREMIUM GLASS VARIABLES */
            --glass-bg: rgba(25, 25, 25, 0.35);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-hover: rgba(255, 255, 255, 0.2);
            --primary-text: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.5);
            --completed-color: #a3cf62;
            --ongoing-color: #ffcc33;
            --pending-color: #ff5e57;
            --bg-dark: #121212;
        }

        /* FIX: Reserving scrollbar space prevents horizontal movement (bumbling) */
        html {
            scrollbar-gutter: stable;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), 
                        url('images/dashboard_bg.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--primary-text);
            min-height: 100vh;
            padding: 40px;
            /* FIX: Ensure a vertical track is always present to prevent layout snapping */
            overflow-y: scroll;
        }

        /* PREMIUM GLASS BASE STYLING */
        .glass { 
            position: relative;
            background: var(--glass-bg); 
            backdrop-filter: blur(30px) saturate(180%); 
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border); 
            border-radius: 28px; 
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 -1px 0 rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .glass::before, .project-card::before, .stat-card::before, .modal-content::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02) 40%, transparent 60%);
            pointer-events: none;
            border-radius: inherit;
            z-index: 0;
        }

        .glass > *, .project-card > *, .stat-card > *, .modal-content > * {
            position: relative;
            z-index: 1;
        }

        main { width: 100%; max-width: 1300px; margin: 0 auto; animation: fadeInUp 0.6s ease-out; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .btn-add { 
            background: rgba(255, 255, 255, 0.9); 
            color: #000; 
            padding: 12px 24px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            backdrop-filter: blur(10px);
        }
        .btn-add:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }

        .dashboard-top { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .main-chart-box { grid-row: span 2; padding: 30px; height: 350px; }
        
        .stat-card { 
            padding: 24px; 
            transition: 0.3s; 
            cursor: pointer; 
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card.active { 
            border-color: rgba(255,255,255,0.45); 
            background: rgba(255,255,255,0.08); 
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.05);
        }
        .stat-card h3 { font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text); margin-bottom: 10px; }
        .stat-card .value { font-size: 2.2rem; font-weight: 700; }

        /* Project Cards - SIZES PRESERVED */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
        .project-card { 
            position: relative;
            padding: 25px; 
            display: grid; 
            grid-template-columns: 1fr 100px; 
            align-items: center; 
            gap: 15px; 
            transition: 0.3s cubic-bezier(0.2, 0, 0.2, 1); 
            cursor: pointer; 
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .project-card:hover { 
            transform: translateY(-6px); 
            background: rgba(255,255,255,0.06); 
            border-color: rgba(255,255,255,0.25); 
            box-shadow: 0 15px 45px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .project-info h2 { font-size: 1.2rem; margin-bottom: 5px; }
        .project-meta { font-size: 0.8rem; color: var(--secondary-text); }

        .circular-progress-container { width: 100px; height: 100px; position: relative; }
        .progress-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.85rem; font-weight: 700; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-content { 
            width: 100%; max-width: 550px; padding: 35px; background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 32px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }

        .badge { padding: 4px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-completed { background: rgba(163, 207, 98, 0.2); color: var(--completed-color); }
        .badge-ongoing { background: rgba(255, 204, 51, 0.2); color: var(--ongoing-color); }
        .badge-pending { background: rgba(255, 94, 87, 0.2); color: var(--pending-color); }

        .action-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .btn-delete { background: rgba(255, 94, 87, 0.1); color: #ff5e57; border: 1px solid rgba(255, 94, 87, 0.2); padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-delete:hover { background: #ff5e57; color: #fff; }
        .btn-edit { background: rgba(255,255,255,0.9); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0 15px; 
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; color: #fff; backdrop-filter: blur(5px);
        }

        input[type="date"] { color-scheme: dark; }
        select option { background-color: #1a1a1a; color: #fff; }
        
        #notification-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
        .toast { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); color: #000; padding: 12px 20px; border-radius: 10px; margin-top: 10px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <main>
        <header>
            <h1>Project Management Dashboard</h1>
            <button class="btn-add" onclick="openAddModal()">+ New Project</button>
        </header>

        <section class="dashboard-top">
            <div class="main-chart-box glass"><canvas id="mainChart"></canvas></div>
            <div class="stat-card" onclick="setFilter('Completed')" id="stat-completed"><h3>Completed</h3><div class="value" style="color: var(--completed-color)" id="count-completed">0</div></div>
            <div class="stat-card" onclick="setFilter('Ongoing')" id="stat-ongoing"><h3>Ongoing</h3><div class="value" style="color: var(--ongoing-color)" id="count-ongoing">0</div></div>
            <div class="stat-card" onclick="setFilter('Pending')" id="stat-pending"><h3>Pending</h3><div class="value" style="color: var(--pending-color)" id="count-pending">0</div></div>
            <div class="stat-card active" onclick="setFilter('All')" id="stat-all"><h3>Total Projects</h3><div class="value" id="count-total">0</div></div>
        </section>

        <section class="project-grid" id="projectGrid"></section>
    </main>

    <!-- VIEW DETAILS MODAL -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-content" id="viewDetailsContent"></div>
    </div>

    <!-- FORM MODAL -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Project Details</h2>
            <form id="projectForm">
                <input type="hidden" id="pId">
                <label>Project Name</label><input type="text" id="pName" required>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div><label>Client</label><input type="text" id="pClient" required></div>
                    <div><label>Deadline</label><input type="date" id="pDeadline" required></div>
                    <div><label>Status</label>
                        <select id="pStatus">
                            <option value="Ongoing">Ongoing</option>
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>
                    <div><label>Progress %</label><input type="number" id="pProgress" min="0" max="100"></div>
                </div>
                <label>Description</label><textarea id="pDesc" rows="3"></textarea>
                <div class="action-group">
                    <button type="button" onclick="closeModal('formModal')" style="background:none; border:none; color:var(--secondary-text); cursor:pointer;">Cancel</button>
                    <button type="submit" class="btn-edit">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DELETE CONFIRM MODAL -->
    <div class="modal-overlay" id="deleteConfirmModal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2 style="margin-bottom: 15px;">Delete Project?</h2>
            <p style="color: var(--secondary-text); margin-bottom: 25px;">This action cannot be undone.</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="closeModal('deleteConfirmModal')" style="background:none; border:none; color:var(--secondary-text); cursor:pointer;">Cancel</button>
                <button class="btn-delete" id="finalDeleteBtn">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        let projects = [
            { id: 1, name: "Luxury Villa Renovation", client: "Private Client", status: "Completed", progress: 100, deadline: "2025-12-20", desc: "Full interior and exterior overhaul." },
            { id: 2, name: "Eco-Friendly Cabin", client: "N. Brooks", status: "Completed", progress: 100, deadline: "2025-10-15", desc: "Sustainable timber construction." },
            { id: 3, name: "Modern Loft Conversion", client: "S. Miller", status: "Completed", progress: 100, deadline: "2025-08-10", desc: "Industrial style living space." },
            { id: 4, name: "Beachfront Decking", client: "Ocean Resorts", status: "Completed", progress: 100, deadline: "2025-07-22", desc: "Sustainable composite decking installation." },
            { id: 5, name: "Urban Office Space", client: "TechCorp", status: "Ongoing", progress: 45, deadline: "2026-05-15", desc: "Modern workspace design." },
            { id: 6, name: "Retail Hub Project", client: "Global Mall", status: "Ongoing", progress: 75, deadline: "2026-03-12", desc: "Large scale retail renovation." },
            { id: 7, name: "Boutique Hotel Lobby", client: "Grand Stay", status: "Ongoing", progress: 30, deadline: "2026-02-01", desc: "High-end marble finishings and lighting." },
            { id: 8, name: "Skyline Penthouse", client: "H. Peterson", status: "Pending", progress: 10, deadline: "2026-08-30", desc: "Awaiting material permits." }
        ];

        let mainChart;
        let cardCharts = {}; 
        let observer;
        let currentFilter = 'All';

        function showNotification(msg) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.stat-card').forEach(el => el.classList.remove('active'));
            document.getElementById(`stat-${f.toLowerCase()}`).classList.add('active');
            renderProjects();
        }

        function initObserver() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const canvasId = entry.target.dataset.chartId;
                    if (entry.isIntersecting) {
                        if (cardCharts[canvasId]) {
                            cardCharts[canvasId].reset();
                            cardCharts[canvasId].update();
                        }
                    }
                });
            }, { threshold: 0.2 });
        }

        function renderProjects() {
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = '';
            Object.values(cardCharts).forEach(chart => chart.destroy());
            cardCharts = {};
            const filtered = currentFilter === 'All' ? projects : projects.filter(p => p.status === currentFilter);
            filtered.forEach(p => {
                const canvasId = `chart-${p.id}`;
                const card = document.createElement('div');
                card.className = 'project-card';
                card.dataset.chartId = canvasId;
                card.onclick = () => viewDetails(p.id);
                const color = p.status === 'Completed' ? '#a3cf62' : (p.status === 'Ongoing' ? '#ffcc33' : '#ff5e57');
                card.innerHTML = `
                    <div class="project-info">
                        <h2>${p.name}</h2>
                        <div class="project-meta">Client: ${p.client}</div>
                        <div class="project-meta" style="margin-top:5px;">🗓 ${p.deadline}</div>
                    </div>
                    <div class="circular-progress-container">
                        <canvas id="${canvasId}"></canvas>
                        <div class="progress-label">${p.progress}%</div>
                    </div>
                `;
                grid.appendChild(card);
                createCircularChart(canvasId, p.progress, color);
                observer.observe(card);
            });
            updateStats();
        }

        function createCircularChart(id, progress, color) {
            const ctx = document.getElementById(id).getContext('2d');
            cardCharts[id] = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [progress, 100-progress], backgroundColor: [color, 'rgba(255,255,255,0.05)'], borderWidth: 0 }] },
                options: { 
                    cutout: '80%', responsive: true, maintainAspectRatio: true,
                    animation: { duration: 1500, easing: 'easeOutQuart' },
                    plugins: { legend: false, tooltip: false } 
                }
            });
        }

        function viewDetails(id) {
            const p = projects.find(x => x.id === id);
            const content = document.getElementById('viewDetailsContent');
            content.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>${p.name}</h2>
                    <span class="badge badge-${p.status.toLowerCase()}">${p.status}</span>
                </div>
                <p style="margin-bottom:10px;"><b>Client:</b> ${p.client}</p>
                <p style="margin-bottom:10px;"><b>Deadline:</b> ${p.deadline}</p>
                <p style="color:var(--secondary-text); margin-bottom:30px;">${p.desc || 'No description available.'}</p>
                <div class="action-group">
                    <button onclick="closeModal('viewModal')" style="background:none; border:none; color:var(--secondary-text); cursor:pointer;">Close</button>
                    <button class="btn-delete" onclick="confirmDelete(${p.id})">Delete</button>
                    <button class="btn-edit" onclick="openEditModal(${p.id})">Edit</button>
                </div>
            `;
            document.getElementById('viewModal').classList.add('show');
        }

        function confirmDelete(id) {
            document.getElementById('finalDeleteBtn').onclick = () => {
                projects = projects.filter(p => p.id !== id);
                closeModal('deleteConfirmModal');
                closeModal('viewModal');
                renderProjects();
                showNotification("Project deleted successfully.");
            };
            document.getElementById('deleteConfirmModal').classList.add('show');
        }

        function updateStats() {
            const counts = projects.reduce((acc, p) => { acc[p.status.toLowerCase()]++; return acc; }, { completed: 0, ongoing: 0, pending: 0 });
            document.getElementById('count-completed').innerText = counts.completed;
            document.getElementById('count-ongoing').innerText = counts.ongoing;
            document.getElementById('count-pending').innerText = counts.pending;
            document.getElementById('count-total').innerText = projects.length;
            updateMainChart(counts);
        }

        function updateMainChart(c) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: ['Completed', 'Ongoing', 'Pending'], datasets: [{ data: [c.completed, c.ongoing, c.pending], backgroundColor: ['#a3cf62', '#ffcc33', '#ff5e57'], borderRadius: 8 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: false }, 
                    scales: { 
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.5)' } },
                        x: { ticks: { color: 'rgba(255,255,255,0.5)' } }
                    } 
                }
            });
        }

        function openAddModal() { document.getElementById('projectForm').reset(); document.getElementById('pId').value = ''; document.getElementById('modalTitle').innerText = 'New Project'; document.getElementById('formModal').classList.add('show'); }
        function openEditModal(id) {
            const p = projects.find(x => x.id === id);
            document.getElementById('pId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pClient').value = p.client;
            document.getElementById('pStatus').value = p.status;
            document.getElementById('pProgress').value = p.progress;
            document.getElementById('pDeadline').value = p.deadline;
            document.getElementById('pDesc').value = p.desc || '';
            document.getElementById('modalTitle').innerText = 'Edit Project';
            closeModal('viewModal');
            document.getElementById('formModal').classList.add('show');
        }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        document.getElementById('projectForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('pId').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('pName').value,
                client: document.getElementById('pClient').value,
                status: document.getElementById('pStatus').value,
                progress: parseInt(document.getElementById('pProgress').value) || 0,
                deadline: document.getElementById('pDeadline').value,
                desc: document.getElementById('pDesc').value
            };
            if (id) {
                const idx = projects.findIndex(x => x.id == id);
                projects[idx] = data;
            } else {
                projects.unshift(data);
            }
            closeModal('formModal');
            renderProjects();
            showNotification(id ? "Project updated" : "Project added");
        };

        window.onload = () => {
            initObserver();
            renderProjects();
        };
    </script>
</body>
</html>
