<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
  --bg:#faf9f7;
  --white:#ffffff;
  --border:#e8e6e2;
  --text:#1f1f1f;
  --muted:#555;
  --beige:#cfc7bb;
  --blush:#f3c6bd;
  --mustard:#3A2F24;
  --hover-bg:#D4AF37
;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* BACKGROUND IMAGE */
.bg-image{
  position:fixed;
  inset:0;
  z-index:-3;
  background:url("images/unnamed.webp") center/cover no-repeat;
  opacity:.3;
  animation:slowZoom 20s infinite alternate ease-in-out;
}

@keyframes slowZoom{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}

/* BLOBS */
.bg{
  position:fixed;
  inset:0;
  z-index:-2;
}

.blob{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.45;
  animation:float 18s infinite alternate ease-in-out;
}

.blob.one{background:var(--mustard);top:-100px;left:-100px;}
.blob.two{background:var(--blush);bottom:-120px;right:-80px;animation-duration:22s;}
.blob.three{background:var(--beige);top:40%;left:60%;animation-duration:26s;}

@keyframes float{
  to{transform:translate(80px,-60px);}
}

/* CONTACT SECTION */
.contact{
  max-width:1200px;
  margin:auto;
  padding:100px 20px 60px;
  text-align:center;
}

.badge{
  padding:6px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.8);
  color:var(--mustard);
  font-size:13px;
  font-weight:500;
}

.contact h1{
  font-size:clamp(42px,5vw,56px);
  margin:18px 0 12px;
}

.subtitle{
  max-width:620px;
  margin:auto;
  color:var(--muted);
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:26px;
  margin:60px 0 0;
}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  text-align:left;
  transition:.45s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 24px rgba(130,110,82,.25);
}

.card:hover{
  background:var(--hover-bg);
  transform:scale(1.06) translateY(-8px);
  box-shadow:0 18px 45px rgba(249,133,84,.35);
}

/* 🔥 GOLD ICON EFFECT (EMOJIS ONLY) */
.icon{
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:20px;
  margin-bottom:16px;
  background:rgba(0, 0, 0, 0.893);

  filter: sepia(1) saturate(5) hue-rotate(15deg) brightness(1.1);
}

.card:hover h3,
.card:hover p,
.card:hover strong{
  color:#fff;
}

.card p{
  font-size:14px;
  color:var(--muted);
}

.card strong{
  display:block;
  margin-top:10px;
}

/* MAP SECTION */
.map-section{
  max-width:1200px;
  margin:30px auto 80px;
  padding:0 20px;
  text-align:center;
}

.map-section h1{
  font-size:clamp(26px,4vw,34px);
  margin-bottom:6px;
}

#map{
  width:100%;
  height:460px;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.08);
}

/* POPUP */
.leaflet-popup-content-wrapper{
  border-radius:16px;
}

.popup-card{
  font-size:14px;
}

.popup-card h3{
  font-size:16px;
  margin-bottom:6px;
}

.popup-card p{
  margin-bottom:6px;
  color:var(--muted);
}

/* RESPONSIVE */
@media(max-width:600px){
  .contact{padding:80px 16px 40px;}
  #map{height:320px;}
}
</style>
</head>

<body>

<div class="bg-image"></div>

<div class="bg">
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>
</div>

<section class="contact">
  <span class="badge">CONTACT US</span>
  <h1>Let’s Talk 👋</h1>
  <p class="subtitle">
    Got a wild idea? Need help? Just want to vibe?
    We’re here for it — hit us up anytime
  </p>

  <div class="cards">
    <div class="card">
      <div class="icon">📞</div>
      <h3>Phone</h3>
      <p>Mon–Fri, 9AM–5PM</p>
      <strong>+62 891 234 567</strong>
    </div>

    <div class="card">
      <div class="icon">✉️</div>
      <h3>Email</h3>
      <p>Response in ~24hrs</p>
      <strong>support@online.com</strong>
    </div>

    <div class="card">
      <div class="icon">📍</div>
      <h3>Head Office</h3>
      <p>Come say hi IRL</p>
      <strong>Malang, Indonesia</strong>
    </div>
  </div>
</section>

<section class="map-section">
  <h1>Our Stores</h1>
  <div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const stores = [
  { name:"Pune – Hinjewadi Branch", city:"Hinjewadi Phase 1, Pune", phone:"+91 98765 43210", email:"hinjewadi@online.com", coords:[18.5913,73.7389]},
  { name:"Pune – Wakad Store", city:"Wakad, Pune", phone:"+91 91234 56789", email:"wakad@online.com", coords:[18.5993,73.7625]},
  { name:"Pimpri-Chinchwad Outlet", city:"PCMC, Maharashtra", phone:"+91 99887 66554", email:"pcmc@online.com", coords:[18.6298,73.7997]},
  { name:"Baner Experience Center", city:"Baner, Pune", phone:"+91 90909 80808", email:"baner@online.com", coords:[18.5590,73.7868]}
];

const map = L.map('map').setView([18.5204,73.8567],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

stores.forEach(store=>{
  L.marker(store.coords).addTo(map).bindPopup(`
    <div class="popup-card">
      <h3>${store.name}</h3>
      <p>${store.city}</p>
      <div>📞 ${store.phone}</div>
      <div>✉️ ${store.email}</div>
    </div>
  `);
});
</script>

</body>
</html>
