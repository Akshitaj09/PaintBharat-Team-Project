<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Bharat | Document Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* ULTRA GLASS MORPHISM TOKENS */
            --glass-bg: rgba(10, 10, 10, 0.45);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-reflection: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%);
            --primary-text: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.7);
            --accent: #a3cf62;
            --warning: #ffcc33;
            --error: #ff5e57;
        }

        body { 
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(to bottom, rgba(10, 10, 10, 0.3), rgba(10, 10, 10, 0.3)),
                url('images/dashboard_bg.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            color: var(--primary-text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism Logic */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--glass-reflection);
            pointer-events: none;
            opacity: 0.5;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .status-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-approved { background: rgba(163, 207, 98, 0.2); color: var(--accent); border: 1px solid rgba(163, 207, 98, 0.3); }
        .status-pending { background: rgba(255, 204, 51, 0.15); color: var(--warning); border: 1px solid rgba(255, 204, 51, 0.2); }
        .status-missing { background: rgba(255, 255, 255, 0.1); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.2); }
        .status-compulsory { background: rgba(255, 94, 87, 0.15); color: #ff5e57; border: 1px solid rgba(255, 94, 87, 0.2); }

        .drop-zone {
            border: 1.5px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .drop-zone:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            color: #fff;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
        }

        .fade-slide-in {
            animation: fadeSlide 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="flex flex-col min-h-screen">
        <!-- Top Nav (Replacement for Sidebar context) -->
        <nav class="w-full py-6 px-6 md:px-12 flex items-center justify-between border-b border-white/10 backdrop-blur-md sticky top-0 z-50">
            <div class="flex items-center gap-3 font-black text-2xl tracking-tighter">
                <div class="w-10 h-10 bg-[#fff] rounded-xl flex items-center justify-center text-black">
                    <i class="fas fa-paint-roller"></i>
                </div>
                <span class="text-white">Paint Bharat</span>
            </div>
            <div class="flex items-center gap-8">
                <div class="hidden md:flex gap-6 text-sm font-bold text-white/60">
                    <a href="#" class="hover:text-white transition-colors">Dashboard</a>
                    <a href="#" class="text-white">Verification</a>
                    <a href="#" class="hover:text-white transition-colors">Projects</a>
                </div>
                <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white border border-white/20">RK</div>
            </div>
        </nav>

        <!-- Main Content (Centered and Sidebar-free) -->
        <main class="max-w-7xl mx-auto w-full p-6 md:p-12">
            <!-- Header Section -->
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-16 fade-slide-in">
                <div class="flex items-center gap-8">
                    <!-- Progress Circle Wrapper -->
                    <div class="relative w-24 h-24 flex items-center justify-center glass-card border-none bg-white/10 shadow-2xl shrink-0">
                        <svg class="w-full h-full transform -rotate-2">
                            <circle cx="48" cy="48" r="38" stroke="rgba(255,255,255,0.1)" stroke-width="6" fill="transparent" />
                            <circle id="progressCircle" cx="48" cy="48" r="38" stroke="white" stroke-width="6" fill="transparent" 
                                stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round" class="progress-ring__circle" 
                                style="filter: drop-shadow(0 0 8px rgba(255,255,255,0.4))" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span id="percentLabel" class="text-xl font-black leading-none text-white">0%</span>
                            <span class="text-[8px] uppercase tracking-[2px] text-white/50 font-bold mt-1">Done</span>
                        </div>
                    </div>

                    <div>
                        <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-2 text-white">Document & Verification</h1>
                        <p class="text-white/60 text-base md:text-lg font-medium">Please upload mandatory documents to complete your profile verification.</p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <select id="roleSwitcher" class="glass-card px-6 py-4 text-sm font-bold cursor-pointer outline-none bg-black/40 border-white/10 text-white" onchange="switchRole(this.value)">
                        <option value="contractor">Contractor Profile</option>
                        <option value="employee">Employee Profile</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
            </header>

            <div id="documentContainer" class="space-y-16"></div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 right-10 glass-card bg-black/90 px-8 py-5 rounded-3xl shadow-[0_30px_60px_rgba(0,0,0,0.8)] translate-y-32 opacity-0 transition-all duration-500 pointer-events-none flex items-center gap-4 z-[100] border-white/20">
        <div class="w-12 h-12 rounded-2xl bg-white/10 text-white flex items-center justify-center shadow-inner"><i class="fas fa-check-circle text-xl"></i></div>
        <div>
            <p id="toastTitle" class="font-black text-sm tracking-tight text-white">System Notification</p>
            <p id="toastMessage" class="text-xs text-white/60">Success message here.</p>
        </div>
    </div>

    <script>
        let currentTotalDocs = 0;
        let currentUploadedDocs = 0;

        const mandatoryDocs = [
            { name: 'Aadhaar Card', desc: 'Front and back side in single PDF (Compulsory)', compulsory: true },
            { name: 'PAN Card', desc: 'Clear photo of original card (Compulsory)', compulsory: true }
        ];

        const roleData = {
            contractor: [
                { cat: 'Personal Identity', icon: 'fa-user-check', docs: [...mandatoryDocs] },
                { 
                    cat: 'Professional Compliance', icon: 'fa-briefcase',
                    docs: [
                        { name: 'Contract Agreement', desc: 'Signed stamp paper copy' },
                        { name: 'Trade License', desc: 'Municipal corporation valid license' },
                        { name: 'GST Certification', desc: 'Recent GST-R1 filing or certificate' }
                    ] 
                }
            ],
            employee: [
                { cat: 'Identity Proof', icon: 'fa-id-card', docs: [...mandatoryDocs] },
                { 
                    cat: 'Employment Records', icon: 'fa-file-invoice',
                    docs: [
                        { name: 'Offer Letter', desc: 'Issued by HR Department' },
                        { name: 'Experience Letter', desc: 'From previous organization' },
                        { name: 'Recent Pay Slip', desc: 'Last month salary statement' }
                    ] 
                }
            ],
            admin: [
                { cat: 'Core Identity', icon: 'fa-fingerprint', docs: [...mandatoryDocs] },
                { 
                    cat: 'System Access', icon: 'fa-terminal',
                    docs: [
                        { name: 'Security Clearance', desc: 'HQ Authorization Letter' },
                        { name: 'Digital Signature', desc: 'Class 3 DSC Certificate' }
                    ] 
                }
            ]
        };

        function updateProgress() {
            const percentage = currentTotalDocs > 0 ? Math.round((currentUploadedDocs / currentTotalDocs) * 100) : 0;
            const circle = document.getElementById('progressCircle');
            const radius = 38;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (percentage / 100 * circumference);
            circle.style.strokeDashoffset = offset;
            
            const label = document.getElementById('percentLabel');
            label.innerText = percentage + '%';
        }

        function createCard(doc, delay) {
            const isCompulsory = doc.compulsory;
            return `
                <div class="glass-card p-8 flex flex-col gap-8 group fade-slide-in" style="animation-delay: ${delay}s">
                    <div class="flex items-start justify-between">
                        <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center text-white/30 group-hover:bg-white/10 group-hover:text-white transition-all duration-700 shadow-inner">
                            <i class="fas fa-cloud-arrow-up text-2xl"></i>
                        </div>
                        <span class="status-pill ${isCompulsory ? 'status-compulsory' : 'status-missing'}">
                            ${isCompulsory ? 'Required' : 'Optional'}
                        </span>
                    </div>
                    
                    <div>
                        <h4 class="font-black text-xl leading-tight mb-2 text-white tracking-tight transition-colors">${doc.name}</h4>
                        <p class="text-xs text-white/50 leading-relaxed font-medium">${doc.desc}</p>
                    </div>

                    <div class="relative upload-area">
                        <input type="file" class="hidden" onchange="handleUpload(this, '${doc.name}')">
                        <div class="drop-zone p-8 flex flex-col items-center justify-center gap-3 cursor-pointer group/zone" onclick="this.previousElementSibling.click()">
                            <i class="fas fa-plus text-white/20 text-lg group-hover/zone:scale-125 transition-transform"></i>
                            <span class="text-[10px] font-black text-white/40 uppercase tracking-[3px]">Select File</span>
                        </div>
                    </div>

                    <div class="action-area hidden flex items-center gap-3">
                        <button onclick="viewDoc('${doc.name}')" class="flex-1 action-btn py-4 rounded-2xl text-[10px] font-black uppercase tracking-[2px] flex items-center justify-center gap-2">
                            <i class="fas fa-eye"></i> Preview
                        </button>
                        <button onclick="reuploadDoc(this)" class="flex-1 action-btn py-4 rounded-2xl text-[10px] font-black uppercase tracking-[2px] flex items-center justify-center gap-2 text-white/40 hover:text-white bg-white/5">
                            <i class="fas fa-sync-alt"></i> Replace
                        </button>
                    </div>
                </div>
            `;
        }

        function handleUpload(input, name) {
            if (input.files[0]) {
                const card = input.closest('.glass-card');
                const badge = card.querySelector('.status-pill');
                const uploadArea = card.querySelector('.upload-area');
                const actionArea = card.querySelector('.action-area');
                
                if (badge.innerText !== "VERIFIED") {
                    currentUploadedDocs++;
                    updateProgress();
                }

                badge.innerText = "Processing...";
                badge.className = "status-pill status-pending animate-pulse";
                
                setTimeout(() => {
                    badge.className = "status-pill status-approved";
                    badge.innerText = "Verified";
                    uploadArea.classList.add('hidden');
                    actionArea.classList.remove('hidden');
                    showToast('Document Verified', `${name} has been successfully uploaded.`);
                }, 1500);
            }
        }

        function reuploadDoc(btn) {
            const card = btn.closest('.glass-card');
            card.querySelector('input[type="file"]').click();
        }

        function viewDoc(name) {
            showToast('Preview Ready', `Opening secure viewer for ${name}...`);
        }

        function switchRole(role) {
            const container = document.getElementById('documentContainer');
            container.style.opacity = '0';
            setTimeout(() => {
                container.innerHTML = '';
                const categories = roleData[role];
                if (!categories) return;
                currentTotalDocs = 0;
                currentUploadedDocs = 0;
                categories.forEach(c => currentTotalDocs += c.docs.length);
                updateProgress();
                categories.forEach((cat, cIdx) => {
                    const section = document.createElement('section');
                    section.innerHTML = `
                        <div class="flex items-center gap-5 mb-10">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white border border-white/5 shadow-xl"><i class="fas ${cat.icon}"></i></div>
                            <h3 class="text-xs font-black uppercase tracking-[5px] text-white/80">${cat.cat}</h3>
                            <div class="h-[1px] flex-1 bg-gradient-to-r from-white/20 to-transparent"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${cat.docs.map((doc, dIdx) => createCard(doc, (cIdx * 0.1) + (dIdx * 0.05))).join('')}
                        </div>`;
                    container.appendChild(section);
                });
                container.style.opacity = '1';
            }, 300);
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-32', 'opacity-0'), 4000);
        }

        window.onload = () => switchRole('contractor');
    </script>
</body>
</html>
