<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat Co. | Interior Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg-color: #d8ccc4;
            --accent-dark: #2a2a2a;
            --accent-brown: #ec1348; 
            --text-main: #333;
            --text-light: #555;
            --accent-blue: #007bff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #dfdbd8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* LAYERED STRUCTURAL BACKGROUND (Full Page) */
        .bg-structural-base {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('images/structural-bg.jpg');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(105%) brightness(95%);
            z-index: -3;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(216, 204, 196, 0.94) 0%, rgba(180, 160, 150, 0.88) 100%);
            z-index: -2;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(160, 120, 86, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(160, 120, 86, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* BACKGROUND BLUEPRINT LABELS */
        .bg-label {
            position: fixed;
            font-family: 'Inter';
            font-weight: 800;
            color: rgba(0,0,0,0.02);
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: -1;
        }

        nav {
            width: 100%;
            padding: 40px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .logo { 
            font-weight: 700; 
            font-size: 1.1rem; 
            font-family: 'Playfair Display'; 
            color: var(--accent-dark);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* MAIN WRAPPER */
        main {
            display: flex;
            flex: 1;
            padding: 0 80px 80px 80px;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            position: relative;
            z-index: 10;
        }

        .content-container {
            flex: 1;
            max-width: 550px;
        }

        .badge {
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent-brown);
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .badge::after {
            content: "";
            height: 1px;
            width: 40px;
            background: var(--accent-brown);
            margin-left: 15px;
            opacity: 0.5;
        }

        h1 {
            font-size: 4rem;
            font-family: 'Playfair Display', serif;
            line-height: 1.05;
            color: var(--accent-dark);
            margin-bottom: 25px;
        }

        .subtext {
            color: var(--text-light);
            margin-bottom: 40px;
            font-size: 1.1rem;
            line-height: 1.8;
            max-width: 480px;
        }

        /* Booking Form */
        .direct-form {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.05);
            max-width: 420px;
        }

        .input-group { margin-bottom: 15px; }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent-brown);
            background: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 15px 0;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .checkbox-group input { display: none; }

        .custom-box {
            height: 18px; width: 18px;
            background-color: white;
            border: 1px solid #ddd;
            margin-right: 12px;
            position: relative;
        }

        .checkbox-group input:checked ~ .custom-box { 
            background-color: var(--accent-brown); 
            border-color: var(--accent-brown);
        }
        .custom-box:after {
            content: "✓"; color: white; position: absolute; font-size: 12px; left: 3px; top: -1px; display: none;
        }
        .checkbox-group input:checked ~ .custom-box:after { display: block; }

        /* Reduced Button Size and Removed Scale Animations */
        .btn-book {
            width: auto;
            min-width: 180px;
            background: var(--accent-dark);
            color: white;
            padding: 14px 25px;
            border: none;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.3s ease;
        }
        .btn-book:hover { 
            background: var(--accent-brown);
        }

        /* Right Side: Single Arch Image */
        .visual-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .arch-frame {
            width: 450px;
            height: 600px;
            border-top-left-radius: 1000px;
            border-top-right-radius: 1000px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15);
            border: 12px solid white;
            position: relative;
        }

        .single-img {
            width: 100%;
            height: 100%;
            background-image: url('images/freesite.jpg');
            background-size: cover;
            background-position: center;
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .arch-frame:hover .single-img { transform: scale(1.08); }

        @media (max-width: 1100px) {
            nav { padding: 30px 40px; }
            main { flex-direction: column; padding: 40px; text-align: center; }
            .content-container { max-width: 100%; display: flex; flex-direction: column; align-items: center; }
            .visual-container { width: 100%; justify-content: center; order: -1; margin-bottom: 40px; }
            .arch-frame { width: 280px; height: 380px; }
            h1 { font-size: 2.8rem; }
            .btn-book { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bg-structural-base"></div>
    <div class="bg-overlay"></div>
    <div class="bg-grid"></div>

    <nav>
        <div class="logo">PaintBharat Co.</div>
    </nav>

    <main>
        <div class="content-container">
            <span class="badge">A-Grade Construction</span>
            <h1>Expert <br>Interior Solutions</h1>
            <p class="subtext">Merging structural integrity with aesthetic brilliance. Book a free site audit with our master designers.</p>
            
            <div class="direct-form">
                <div class="input-group">
                    <input type="text" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email Address">
                </div>
                <div class="input-group">
                    <input type="tel" placeholder="Phone Number">
                </div>

                <label class="checkbox-group">
                    <input type="checkbox">
                    <span class="custom-box"></span>
                    Need structural consult?
                </label>

                <button class="btn-book">Schedule Now</button>
            </div>
        </div>

        <div class="visual-container">
            <div class="arch-frame">
                <div class="single-img"></div>
            </div>
        </div>
    </main>

</body>
</html>
