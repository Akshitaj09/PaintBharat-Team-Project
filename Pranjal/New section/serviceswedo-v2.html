<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
font-family: 'Inter', sans-serif;
background-color: #fcfaf7;
color: #4a443e;
}

.serif-title {
font-family: 'Playfair Display', serif;
letter-spacing: 0.1em;
}

.main-heading {
font-family: 'Playfair Display', serif;
font-size: clamp(32px, 8vw, 45px);
line-height: 1.1;
letter-spacing: 0.1em;
}


/* Card */

.treatment-card {
transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
background-color: transparent;
border: 3px solid #d4af37;
position: relative;
overflow: hidden;
width: 100%;
max-width: 320px;
margin: 0 auto;
}

.treatment-card:hover {
transform: translateY(-8px);
border-color: #fcf6ba;
box-shadow: 0 12px 24px -10px rgba(212, 175, 55, 0.3);
}


/* Hover Text Pink */

.treatment-card:hover .hover-pink {
color: #ec1348;
transition: .4s ease;
}


/* Shine */

.treatment-card::after {
content: '';
position: absolute;
top: -50%;
left: -50%;
width: 200%;
height: 200%;
background: linear-gradient(
45deg,
transparent 0%,
rgba(255, 255, 255, 0) 30%,
rgba(255, 255, 255, 0.2) 50%,
rgba(255, 255, 255, 0) 70%,
transparent 100%
);

transform: rotate(45deg);
transition: 0.8s;
pointer-events: none;
}

.treatment-card:hover::after {
left: 100%;
top: 100%;
}



/* Image */

.wave-bottom {
clip-path: url(#wave-clip);
-webkit-clip-path: url(#wave-clip);
}

.aspect-ratio-box {
position: relative;
padding-bottom: 90%;
overflow: hidden;
}

.aspect-ratio-box img {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
object-fit: cover;
}

.price-tag {
border-top: 1px solid #e5e0d8;
}

</style>

</head>

<svg width="0" height="0" style="position: absolute;">
