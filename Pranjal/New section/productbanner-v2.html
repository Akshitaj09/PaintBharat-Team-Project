<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Wallpaper Hero</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Inter', sans-serif;
}

/* Background zoom animation */

.hero-bg{
animation: zoom 20s ease-in-out infinite alternate;
}

@keyframes zoom{
0%{transform:scale(1)}
100%{transform:scale(1.08)}
}

/* Fade animation */

.fade{
opacity:0;
transform:translateY(30px);
animation:fadeIn 1.5s forwards;
}

@keyframes fadeIn{
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>


<!-- HERO -->

<section class="relative min-h-screen overflow-hidden">


<!-- Background -->

<div class="absolute inset-0 hero-bg">
<img 
src="../images/spacejoy-YqFz7UMm8qE-unsplash.jpg"
class="w-full h-full object-cover"
>
</div>


<!-- Overlay -->

<div class="absolute inset-0 bg-black/60"></div>



<!-- Center Content -->

<div class="relative z-10 flex items-center justify-center min-h-screen px-6">

<div class="backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl p-16 text-center text-white max-w-3xl fade">

<p class="uppercase tracking-[0.4em] text-sm text-[#ec1348] mb-5">
Premium Wallpapers
</p>

<h1 class="text-6xl font-semibold leading-tight mb-6">
Luxury Wallpapers <br>
For Modern Interiors
</h1>

<p class="text-gray-200 text-lg mb-8">
Transform your interiors with premium wallpaper collections crafted for modern homes and elegant spaces.
</p>

<div class="flex justify-center gap-5">

<button class="bg-[#ec1348] px-8 py-4 rounded-xl hover:scale-105 transition">
Explore Collection
</button>

<button class="border border-white px-8 py-4 rounded-xl hover:bg-white hover:text-black transition">
View Designs
</button>

</div>

</div>

</div>


</section>

</body>
</html>
