<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaintBharat Co. | Interior Design</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,600;1,700&display=swap');

:root {
--bg-color: #d8ccc4;
--navy: #000000;
--hot-pink: #ec1348;
--accent-dark: #2a2a2a;
--accent-brown: #021763; 
--text-main: #333;
--text-light: #383838;
--accent-blue: #007bff;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Inter', sans-serif;
}

body {
background-color: #dfdbd8;
min-height: 100vh;
display: flex;
flex-direction: column;
overflow-x: hidden;
position: relative;
}

/* Background */

.bg-structural-base {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-image: url('images/Gemini_Generated_Image_tehqaytehqaytehq.png');
background-size: cover;
background-position: center;
filter: grayscale(10%) contrast(100%) brightness(95%);
z-index: -3;
}

.bg-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(135deg, rgba(216,204,196,0.1) 0%, rgba(180,160,150,0.15) 100%);
z-index: -2;
}

.bg-grid {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-image:
linear-gradient(rgba(160,120,86,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(160,120,86,0.05) 1px, transparent 1px);
background-size: 50px 50px;
z-index: -1;
}

/* NAV */

nav {
width: 100%;
padding: 30px 80px;
display: flex;
justify-content: space-between;
align-items: center;
position: relative;
z-index: 100;
}

/* Logo */

.logo-wrapper {
display: flex;
align-items: stretch;
gap: 2px;
cursor: pointer;
transition: transform .3s ease;
}

.logo-wrapper:hover {
transform: translateY(-2px);
}

.logo-prefix-box {
background: var(--hot-pink);
color: white;
padding: 6px 10px;
display: flex;
align-items: center;
font-weight: 700;
font-size: 1rem;
font-family: 'Playfair Display', serif;
border-radius: 4px;
}

.logo-main-box {
background: var(--navy);
padding: 6px 14px;
display: flex;
align-items: center;
border-radius: 4px;
}

.logo-full-name {
font-family: 'Playfair Display', serif;
color: white;
font-weight: 700;
font-size: 1rem;
letter-spacing: .5px;
}

/* Main */

main {
display: flex;
flex: 1;
padding: 0 80px 40px 80px;
align-items: center;
justify-content: space-between;
gap: 60px;
position: relative;
z-index: 10;
}

.content-container {
flex: 1;
max-width: 550px;
}

/* Typewriter */

.typewriter-text {
display: inline-block;
font-size: 2.8rem;
font-family: 'Playfair Display', serif;
line-height: 1.2;
color: var(--navy);
white-space: nowrap;
overflow: hidden;
width: 0;
border-right: 4px solid var(--hot-pink);

animation:
typing 3.5s steps(25,end) forwards,
blink .8s infinite;
}

@keyframes typing {
from { width:0 }
to { width:100% }
}

@keyframes blink {
50% { border-color: transparent }
}

/* Subtext */

.subtext {
color: var(--text-main);
margin-bottom: 30px;
font-size: 1.1rem;
line-height: 1.7;
max-width: 480px;
font-weight: 500;
}

/* Form */

.direct-form {
background: rgba(255,255,255,.6);
backdrop-filter: blur(12px);
padding: 35px 40px;
border: 1px solid rgba(255,255,255,.4);
box-shadow: 0 30px 60px rgba(0,0,0,.05);
max-width: 420px;
border-radius: 4px;
}

.input-group {
margin-bottom: 12px;
}

input {
width: 100%;
padding: 12px 14px;
border: 1px solid rgba(0,0,0,.1);
background: rgba(255,255,255,.85);
font-size: .85rem;
outline: none;
}

/* Button */

.btn-book {
background:#fff;
color:#000;
padding:12px 25px;
border:2px solid #000000;
font-weight:600;
font-size:.75rem;
cursor:pointer;
letter-spacing:2px;
transition: all .3s ease;
}

.btn-book:hover {
background:#000;
color:#fff;
border:2px solid #000000;
transform: translateY(-2px);
}

/* RIGHT VISUAL */

.visual-container {
flex: 1;
display: flex;
flex-direction: column;
align-items: flex-end;
justify-content: center;
}

.arch-frame {
width: 420px;
height: 560px;
border-top-left-radius: 1000px;
border-top-right-radius: 1000px;
overflow: hidden;
display: flex;
box-shadow: 0 50px 100px rgba(0,0,0,.15);
border: 12px solid white;
}

.single-img {
width: 100%;
height: 100%;
background-image: url('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=2000&auto=format&fit=crop');
background-size: cover;
background-position: center;
transition: transform 1.5s ease;
}

.arch-frame:hover .single-img {
transform: scale(1.08);
}

/* Responsive */

@media (max-width:1100px){

main {
flex-direction: column;
text-align:center;
}

.visual-container {
align-items:center;
}

.arch-frame {
width:280px;
height:380px;
}

}

</style>
</head>

<body>

<div class="bg-structural-base"></div>
<div class="bg-overlay"></div>
<div class="bg-grid"></div>

<nav>

<div class="logo-wrapper">
<div class="logo-prefix-box">PB</div>

<div class="logo-main-box">
<span class="logo-full-name">
PaintBharat Co.
</span>
</div>

</div>

</nav>

<main>

<div class="content-container">

<h1 class="typewriter-text">
Expert Interior Solutions
</h1>

<p class="subtext">
Merging structural integrity with aesthetic brilliance.
Book a free site audit with our master designers.
</p>

<div class="direct-form">

<div class="input-group">
<input type="text" placeholder="Full Name">
</div>

<div class="input-group">
<input type="email" placeholder="Email">
</div>

<div class="input-group">
<input type="tel" placeholder="Phone">
</div>

<button class="btn-book">
Schedule Now
</button>

</div>

</div>

<div class="visual-container">

<div class="arch-frame">
<div class="single-img"></div>
</div>

</div>

</main>

</body>
</html>
