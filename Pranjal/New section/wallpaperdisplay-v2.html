<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat CO. | Where Every Wall Tells A Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Noto+Sans:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --transition-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --pink-accent: #FF107A;
            --navy-accent: #0F172A;
        }
        body {
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;
            background-color: #fff;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .slide-transition {
            transition: transform 1.2s var(--transition-ease), opacity 0.8s var(--transition-ease);
        }
        
        ::-webkit-scrollbar { display: none; }

        .progress-bar-inner {
            transition: width 8s linear;
        }

        .lifestyle-card {
            transition: transform 1.2s var(--transition-ease), opacity 1s var(--transition-ease);
        }
        
        .content-block {
            transition: transform 1s var(--transition-ease) 0.2s, opacity 0.8s var(--transition-ease) 0.2s;
        }

        .hover-navy:hover {
            color: var(--navy-accent);
        }
        
        .bg-navy-accent {
            background-color: var(--navy-accent);
        }
    </style>
</head>
<body class="text-zinc-900 select-none">

    <!-- TOP NAVIGATION BAR -->
    <header class="fixed top-0 w-full h-24 px-8 lg:px-20 flex items-center justify-between z-50 bg-white/40 backdrop-blur-xl border-b border-zinc-100/50">
        <div class="flex items-center gap-6">
            <div class="w-12 h-12 flex items-center justify-center">
                <svg viewBox="0 0 500 500" class="w-full h-full fill-[#FF107A]">
                    <path d="M250,50 C140,50 50,140 50,250 C50,360 140,450 250,450 C360,450 450,360 450,250 C450,140 360,50 250,50 Z M220,150 C280,150 330,200 330,260 C330,320 280,370 220,370 C160,370 150,320 150,260 C150,200 160,150 220,150 Z" />
                </svg>
            </div>
            <div class="flex flex-col">
                <h1 class="text-2xl font-black tracking-tighter uppercase leading-none">
                    PAINTBHARAT<span class="text-zinc-400">CO.</span>
                </h1>
                <p class="text-[10px] tracking-[0.3em] text-zinc-500 uppercase mt-1 font-bold">
                    Where Every Wall Tells A Story
                </p>
            </div>
        </div>

        <div class="flex items-center gap-10">
            <div class="hidden lg:flex items-center gap-8 mr-4">
                <span class="text-[10px] uppercase tracking-widest font-black text-zinc-400">Scroll Down</span>
            </div>
            <svg class="w-5 h-5 cursor-pointer hover:text-[#0F172A] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <div class="relative cursor-pointer group">
                <svg class="w-5 h-5 group-hover:text-[#0F172A] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span class="absolute -top-1.5 -right-1.5 bg-[#FF107A] group-hover:bg-[#0F172A] text-white text-[7px] w-4 h-4 flex items-center justify-center rounded-full font-bold transition-colors">0</span>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main id="main-content" class="h-screen w-screen relative overflow-hidden bg-white">
        <!-- Slides dynamically injected -->
    </main>

    <!-- NAVIGATION CONTROLS -->
    <div class="fixed bottom-12 left-0 w-full flex items-center justify-between px-8 lg:px-20 z-50">
        <div class="flex items-center gap-6">
            <button onclick="paginate(-1)" class="w-16 h-16 bg-white border border-zinc-100 rounded-full flex items-center justify-center shadow-2xl hover:-translate-y-1 hover:text-[#0F172A] hover:border-[#0F172A] active:translate-y-0 transition-all group">
                <svg class="w-6 h-6 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button onclick="paginate(1)" class="w-16 h-16 bg-white border border-zinc-100 rounded-full flex items-center justify-center shadow-xl hover:-translate-y-1 hover:text-[#0F172A] hover:border-[#0F172A] active:translate-y-0 transition-all group">
                <svg class="w-6 h-6 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <div class="flex items-center gap-12">
            <div id="counter" class="text-[14px] font-black tracking-widest uppercase text-zinc-900 tabular-nums">1 / 6</div>
            <div class="w-48 h-[3px] bg-slate-200 hidden lg:block relative overflow-hidden rounded-full">
                <div id="progress-bar" class="absolute inset-y-0 left-0 bg-[#FF107A] w-0"></div>
            </div>
        </div>
    </div>

    <script>
        const PRODUCTS = [
            {
                id: 1,
                title: "Varanasi Silk",
                category: "The Heritage Series",
                price: "₹4,250 / Roll",
                description: "A decadent silk-finish wallpaper capturing the golden hour over the Ganges. Hand-drawn floral motifs meet modern metallic pigments for a timeless, opulent sanctuary.",
                lifestyleImg: "https://images.unsplash.com/photo-1615874959474-d609969a20ed?q=80&w=1000&auto=format&fit=crop", 
                specs: { size: "53cm x 10m", coverage: "57 sq.ft", repeat: "64cm Straight" }
            },
            {
                id: 2,
                title: "Kashmir Slate",
                category: "Minimalist Textures",
                price: "₹3,800 / Roll",
                description: "Deep charcoal tones with subtle mineral veins. This textured wallcovering mimics the raw, powerful beauty of Himalayan stone, perfect for a sophisticated accent wall.",
                lifestyleImg: "https://images.unsplash.com/photo-1618221381711-42ca8ab6e908?q=80&w=1000&auto=format&fit=crop",
                specs: { size: "53cm x 10m", coverage: "57 sq.ft", repeat: "Random Match" }
            },
            {
                id: 3,
                title: "Munnar Mist",
                category: "Botanical Series",
                price: "₹5,100 / Roll",
                description: "Lush, oversized tea-leaf patterns in muted pastels. Transform your living space into a tranquil forest escape. Printed with eco-friendly, breathable inks.",
                lifestyleImg: "https://images.unsplash.com/photo-1617103996702-96ff29b1c467?q=80&w=1000&auto=format&fit=crop",
                specs: { size: "70cm x 10m", coverage: "75 sq.ft", repeat: "80cm Offset" }
            },
            {
                id: 4,
                title: "Jaipur Rose",
                category: "The Heritage Series",
                price: "₹4,600 / Roll",
                description: "Delicate hand-blocked rose patterns inspired by the City Palace of Jaipur. A romantic, soft-hued palette that brings a timeless Indian elegance to traditional bedrooms.",
                lifestyleImg: "https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?q=80&w=1000&auto=format&fit=crop",
                specs: { size: "53cm x 10m", coverage: "57 sq.ft", repeat: "53cm Drop" }
            },
            {
                id: 5,
                title: "Goa Palm",
                category: "Tropical Collections",
                price: "₹4,950 / Roll",
                description: "Deep emerald palm fronds on a linen-textured backdrop. Capture the essence of coastal living and bring a sense of organic luxury and movement to your foyer.",
                lifestyleImg: "https://images.unsplash.com/photo-1616046229478-9901c5536a45?q=80&w=1000&auto=format&fit=crop",
                specs: { size: "70cm x 10m", coverage: "75 sq.ft", repeat: "76cm Straight" }
            },
            {
                id: 6,
                title: "Deccan Stone",
                category: "Architectural Raw",
                price: "₹4,100 / Roll",
                description: "Inspired by the rugged monolithic structures of the Deccan plateau. A raw, earthy finish that provides a grounding architectural foundation for industrial lofts.",
                lifestyleImg: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=1000&auto=format&fit=crop",
                specs: { size: "53cm x 10m", coverage: "57 sq.ft", repeat: "None" }
            }
        ];

        let currentIndex = 0;
        let isScrolling = false;
        let autoTimer;

        const mainContent = document.getElementById('main-content');
        const progressBar = document.getElementById('progress-bar');
        const counter = document.getElementById('counter');

        function createSlideElement(product, index, activeIndex, direction) {
            const slide = document.createElement('div');
            slide.className = `absolute inset-0 flex items-center justify-center slide-transition overflow-hidden`;
            
            if (index !== activeIndex) {
                slide.style.transform = `translateY(${direction > 0 ? '100%' : '-100%'})`;
                slide.style.opacity = '0';
            } else {
                slide.style.transform = `translateY(0)`;
                slide.style.opacity = '1';
                slide.classList.add('z-10');
            }

            slide.innerHTML = `
                <div class="absolute inset-0 z-0">
                    <img src="${product.lifestyleImg}" class="w-full h-full object-cover opacity-15 grayscale hover:grayscale-0 transition-all duration-1000" />
                    <div class="absolute inset-0 bg-gradient-to-b from-white via-transparent to-white/80"></div>
                </div>

                <div class="relative z-10 w-full h-full flex flex-col lg:flex-row items-center justify-center px-6 lg:px-20 pt-20">
                    <div class="relative w-full lg:w-[55%] h-[45vh] lg:h-[70vh] flex items-center justify-center">
                        <div class="lifestyle-card relative w-full h-full max-w-[850px] bg-white p-3 lg:p-6 shadow-[0_60px_150px_rgba(15,23,42,0.15)] rounded-sm ${index === activeIndex ? 'translate-y-0 opacity-100' : 'translate-y-40 opacity-0'}">
                            <div class="w-full h-full overflow-hidden relative">
                                <img src="${product.lifestyleImg}" class="w-full h-full object-cover" />
                                <div class="absolute bottom-6 right-6 bg-white/95 backdrop-blur-md px-6 py-3 text-[10px] font-bold uppercase tracking-widest rounded-sm shadow-sm border border-zinc-100 text-[#0F172A] hover:text-[#FF107A] transition-colors cursor-pointer">
                                   View in Room
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="content-block w-full lg:w-[45%] mt-10 lg:mt-0 lg:pl-28 flex flex-col justify-center ${index === activeIndex ? 'translate-x-0 opacity-100' : 'translate-x-20 opacity-0'}">
                        <div class="flex items-center gap-4 mb-4">
                            <span class="text-[10px] uppercase tracking-[0.5em] font-black text-slate-400">${product.category}</span>
                            <div class="h-[2px] w-16 bg-[#FF107A] group-hover:bg-[#0F172A] transition-colors"></div>
                        </div>
                        <h2 class="text-5xl lg:text-8xl font-serif mb-6 leading-[0.9] tracking-tighter text-slate-900">${product.title}</h2>
                        <div class="text-2xl font-medium mb-10 tracking-tight text-[#FF107A]">${product.price}</div>
                        <div id="desc-container-${index}">
                            <p class="text-slate-600 leading-relaxed text-[17px] mb-12 border-l-4 border-[#0F172A] pl-8 italic">"${product.description}"</p>
                            <button onclick="toggleSpecs(${index})" class="group flex items-center gap-8 text-[11px] uppercase font-bold tracking-[0.4em] py-6 px-14 bg-slate-900 text-white hover:bg-[#FF107A] transition-all active:scale-95 shadow-2xl">
                                Discover More <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return slide;
        }

        function toggleSpecs(index) {
            const container = document.getElementById(`desc-container-${index}`);
            const product = PRODUCTS[index];
            container.innerHTML = `
                <div class="space-y-8 max-w-sm animate-pulse">
                    <div class="grid grid-cols-2 gap-y-8 border-t-2 border-[#0F172A] pt-8">
                        <div>
                            <p class="text-[9px] text-zinc-400 uppercase font-bold tracking-widest mb-1">Dimensions</p>
                            <p class="text-sm font-semibold text-slate-900">${product.specs.size}</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-zinc-400 uppercase font-bold tracking-widest mb-1">Coverage</p>
                            <p class="text-sm font-semibold text-slate-900">${product.specs.coverage}</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-zinc-400 uppercase font-bold tracking-widest mb-1">Pattern Repeat</p>
                            <p class="text-sm font-semibold text-slate-900">${product.specs.repeat}</p>
                        </div>
                        <div class="flex items-center gap-2 text-[9px] font-bold text-[#FF107A] uppercase tracking-widest">
                            Premium Finish
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <button class="flex-1 bg-[#0F172A] text-white py-6 text-[10px] font-bold uppercase tracking-widest hover:bg-[#FF107A] transition-colors shadow-lg">
                            Request Sample
                        </button>
                        <button onclick="resetDesc(${index})" class="w-16 h-16 border-2 border-slate-900 flex items-center justify-center rounded-full hover:bg-[#FF107A] hover:border-[#FF107A] hover:text-white transition-all text-slate-900">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const el = container.querySelector('.animate-pulse');
                if(el) el.classList.remove('animate-pulse');
            }, 500);
        }

        function resetDesc(index) {
            const container = document.getElementById(`desc-container-${index}`);
            const product = PRODUCTS[index];
            container.innerHTML = `
                <p class="text-slate-600 leading-relaxed text-[17px] mb-12 border-l-4 border-[#0F172A] pl-8 italic">"${product.description}"</p>
                <button onclick="toggleSpecs(${index})" class="group flex items-center gap-8 text-[11px] uppercase font-bold tracking-[0.4em] py-6 px-14 bg-slate-900 text-white hover:bg-[#FF107A] transition-all active:scale-95 shadow-2xl">
                    Discover More <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                </button>
            `;
        }

        function updateUI(direction) {
            const slides = mainContent.children;
            const newSlide = createSlideElement(PRODUCTS[currentIndex], currentIndex, currentIndex, direction);
            mainContent.appendChild(newSlide);

            setTimeout(() => {
                newSlide.style.transform = 'translateY(0)';
                newSlide.style.opacity = '1';
                
                if (slides.length > 1) {
                    const oldSlide = slides[0];
                    oldSlide.style.transform = `translateY(${direction > 0 ? '-100%' : '100%'})`;
                    oldSlide.style.opacity = '0';
                    setTimeout(() => oldSlide.remove(), 1200);
                }
            }, 50);

            counter.innerText = `${currentIndex + 1} / ${PRODUCTS.length}`;
            resetProgressBar();
        }

        function paginate(newDirection) {
            if (isScrolling) return;
            isScrolling = true;
            currentIndex = (currentIndex + newDirection + PRODUCTS.length) % PRODUCTS.length;
            updateUI(newDirection);
            setTimeout(() => { isScrolling = false; }, 1500);
        }

        function resetProgressBar() {
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            setTimeout(() => {
                progressBar.style.transition = 'width 8s linear';
                progressBar.style.width = '100%';
            }, 50);
        }

        window.onload = () => {
            updateUI(1);
            autoTimer = setInterval(() => { if (!isScrolling) paginate(1); }, 8000);
            window.addEventListener('wheel', (e) => {
                if (isScrolling) return;
                if (Math.abs(e.deltaY) > 50) paginate(e.deltaY > 0 ? 1 : -1);
            });
        };
    </script>
</body>
</html>
