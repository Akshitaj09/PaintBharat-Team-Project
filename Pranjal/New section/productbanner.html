<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Wallpaper Banner</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Inter', sans-serif;
margin:0;
padding:0;
}

.serif{
font-family: 'Playfair Display', serif;
}

/* Diamond */

.diamond{
width:170px;
height:170px;
transform: rotate(45deg);
overflow:hidden;
position:absolute;
transition:0.4s ease;
border:2px solid #a3831b;
}

/* Hover Glow */

.diamond:hover{
transform: rotate(45deg) scale(1.06);
box-shadow: 
0 0 15px rgba(212,175,55,0.6),
0 0 30px rgba(212,175,55,0.5),
0 0 50px rgba(212,175,55,0.4),
0 0 80px rgba(212,175,55,0.3);
}

/* Image Fix */

.diamond img{
width:100%;
height:100%;
object-fit:cover;
transform: rotate(-45deg) scale(1.4);
transition:0.4s ease;
}

.diamond:hover img{
transform: rotate(-45deg) scale(1.5);
}

</style>

</head>

<body>


<section class="relative min-h-screen overflow-hidden">

<!-- Background -->

<div 
class="absolute inset-0 bg-cover bg-center"
style="background-image:url('../images/structural-bg1.jpg')"
></div>

<!-- Overlay -->

<div class="absolute inset-0 bg-black/60"></div>



<!-- Diamonds -->

<div class="absolute right-24 top-28">

<div class="relative w-[420px] h-[420px]">

<div class="diamond" style="top:0; left:125px;">
<img src="https://images.unsplash.com/photo-1615874959474-d609969a20ed?q=80&w=1200">
</div>

<div class="diamond" style="top:125px; left:0;">
<img src="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?q=80&w=1200">
</div>

<div class="diamond" style="top:125px; left:250px;">
<img src="https://images.unsplash.com/photo-1617806118233-18e1de247200?q=80&w=1200">
</div>

<div class="diamond" style="top:250px; left:125px;">
<img src="https://images.unsplash.com/photo-1616137422495-1e9e46e2aa77?q=80&w=1200">
</div>

</div>

</div>



<!-- Content -->

<div class="relative z-10 min-h-screen flex items-center">

<div class="ml-20 text-white max-w-xl">

<!-- Updated Color -->
<p class="uppercase tracking-[0.4em] text-sm text-[#ec1348] mb-5">
Premium Wallpapers
</p>

<h1 class="text-6xl serif leading-tight mb-6">
Transform Your <br>
Walls Into Art
</h1>

<p class="text-gray-300 mb-8 leading-relaxed">
Discover premium wall wallpapers designed for modern interiors. 
Luxury textures, elegant patterns, and timeless designs 
for beautiful homes.
</p>

<!-- Updated Button Hover -->

<button class="bg-white text-black px-8 py-4 uppercase text-xs tracking-widest hover:bg-[#ec1348] hover:text-white transition duration-300">
Explore Wallpapers
</button>

</div>

</div>


</section>


</body>
</html>
