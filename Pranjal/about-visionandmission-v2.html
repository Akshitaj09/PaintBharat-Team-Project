<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vision Mission Section</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-white">

<section class="relative min-h-screen bg-white flex flex-col items-center justify-center py-20 px-4 font-sans text-gray-900 overflow-hidden">
  
  <!-- Background Effects -->
  <div class="absolute inset-0 z-0 pointer-events-none">

    <!-- moving ray -->
    <div class="absolute -top-[50%] -left-[10%] w-[150%] h-[20%] bg-gradient-to-r from-transparent via-amber-900/20 to-transparent rotate-[35deg] animate-ray"></div>
    
    <!-- floating blobs -->
    <div class="absolute top-1/4 left-10 w-64 h-64 bg-amber-900/10 rounded-full blur-[80px] animate-float"></div>
    <div class="absolute bottom-1/4 right-10 w-80 h-80 bg-yellow-900/10 rounded-full blur-[100px] animate-float-delayed"></div>

    <!-- shapes -->
    <div class="absolute top-[20%] right-[15%] w-4 h-4 border-2 border-amber-900 rotate-45 animate-bounce-slow opacity-60"></div>
    <div class="absolute bottom-[30%] left-[10%] w-3 h-3 bg-amber-900 rotate-12 animate-pulse opacity-50"></div>

  </div>

  <!-- Heading -->
  <div class="relative z-10 text-center mb-16 space-y-4">

    <h1 class="text-6xl md:text-8xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-amber-900 via-amber-700 to-yellow-900 animate-gradient">
      Vision & Mission
    </h1>

    <p class="text-amber-900/60 text-sm md:text-base font-bold tracking-[0.3em] uppercase">
      Elevating the art of painting
    </p>

  </div>

  <!-- Cards -->
  <div class="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-12 max-w-6xl w-full">
    
    <!-- Vision Card -->
    <div class="group relative h-[500px] rounded-[3.5rem] overflow-hidden border-2 border-amber-900/20 bg-white shadow-2xl transition-all duration-700 hover:border-amber-900 hover:shadow-[0_40px_80px_-15px_rgba(0,0,0,0.6)] hover:-translate-y-3">
      
      <!-- Image -->
      <div class="absolute inset-0">

        <img src="images/homeinterior.jpg"
             class="w-full h-full object-cover transition-transform duration-1000 ease-in-out group-hover:scale-110">

        <div class="absolute inset-0 bg-gradient-to-t from-black/100 via-black/40 to-transparent opacity-90 group-hover:opacity-100 transition-opacity duration-500"></div>

      </div>

      <!-- Content -->
      <div class="relative h-full flex flex-col justify-end p-10 md:p-14">

        <div class="flex items-center gap-6 mb-6">

          <!-- Icon -->
          <div class="icon-box p-4 rounded-2xl shadow-xl transform transition-all duration-500 group-hover:rotate-12 group-hover:scale-125">

            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
              viewBox="0 0 24 24" fill="none"
              stroke="white" stroke-width="2.5">

              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>

            </svg>

          </div>

          <!-- Title -->
          <h2 class="title-text text-5xl font-bold tracking-tight text-white transition-all duration-500">
            Vision
          </h2>

        </div>

        <p class="text-gray-200 text-lg leading-relaxed max-w-sm">
          To be the leading painting service provider, transforming spaces with exceptional quality and innovation.
        </p>

      </div>

    </div>

    <!-- Mission Card -->
    <div class="group relative h-[500px] rounded-[3.5rem] overflow-hidden border-2 border-amber-900/20 bg-white shadow-2xl transition-all duration-700 hover:border-amber-900 hover:shadow-[0_40px_80px_-15px_rgba(0,0,0,0.6)] hover:-translate-y-3">
      
      <div class="absolute inset-0">

        <img src="images/home_exterior.jpg"
             class="w-full h-full object-cover transition-transform duration-1000 ease-in-out group-hover:scale-110">

        <div class="absolute inset-0 bg-gradient-to-t from-black/100 via-black/40 to-transparent opacity-90 group-hover:opacity-100 transition-opacity duration-500"></div>

      </div>

      <div class="relative h-full flex flex-col justify-end p-10 md:p-14">

        <div class="flex items-center gap-6 mb-6">

          <!-- Icon -->
          <div class="icon-box p-4 rounded-2xl shadow-xl transform transition-all duration-500 group-hover:rotate-12 group-hover:scale-125">

            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
              viewBox="0 0 24 24" fill="none"
              stroke="white" stroke-width="2.5">

              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="6"/>
              <circle cx="12" cy="12" r="2"/>

            </svg>

          </div>

          <!-- Title -->
          <h2 class="title-text text-5xl font-bold tracking-tight text-white transition-all duration-500">
            Mission
          </h2>

        </div>

        <p class="text-gray-200 text-lg leading-relaxed max-w-sm">
          To deliver superior painting services with professionalism, precision, and passion using premium materials.
        </p>

      </div>

    </div>

  </div>

</section>


<style>

/* ICON LIGHT → DARK BROWN */

.icon-box{
  background: linear-gradient(135deg,#d2b48c,#c19a6b,#a67b5b);
  box-shadow: 0 10px 25px rgba(101,67,33,0.4);
}

.group:hover .icon-box{
  background: linear-gradient(135deg,#5c4033,#3e2723,#2b1b17);
  box-shadow: 0 15px 35px rgba(62,39,35,0.7);
}


/* TITLE TEXT BROWN GRADIENT ON HOVER */

.group:hover .title-text{
  background: linear-gradient(90deg,#d2b48c,#fff4ea,#f9ccc4);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}


/* Animations */

@keyframes ray {
  0% { transform: translateY(-50%) translateX(-50%) rotate(35deg); }
  100% { transform: translateY(150%) translateX(100%) rotate(35deg); }
}

.animate-ray{
  animation: ray 5s linear infinite;
}

@keyframes float{
  0%,100%{ transform:translateY(0) scale(1); }
  50%{ transform:translateY(-30px) scale(1.1); }
}

.animate-float{
  animation: float 8s ease-in-out infinite;
}

.animate-float-delayed{
  animation: float 10s ease-in-out infinite;
  animation-delay:2s;
}

@keyframes bounce-slow{
  0%,100%{ transform:translateY(0) rotate(45deg); }
  50%{ transform:translateY(-20px) rotate(90deg); }
}

.animate-bounce-slow{
  animation:bounce-slow 4s infinite ease-in-out;
}

.animate-gradient{
  background-size:200% auto;
  animation:gradient 3s linear infinite;
}

@keyframes gradient{
  0%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}

</style>


</body>
</html>
