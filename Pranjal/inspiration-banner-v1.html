<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat Hero Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #1a1614; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* Constant floating animation for all images */
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: floating 5s ease-in-out infinite; }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- THE 3-IMAGE ANIMATION LOGIC --- */
        
        /* 1. Side images start directly BEHIND the main image (Invisible) */
        .back-img { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8); 
            opacity: 0; 
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 2. On Hover: They expand to the specific layout in your Figma design */
        .image-stack:hover .back-left { 
            transform: translate(-220px, -180px) rotate(-8deg) scale(1); 
            opacity: 0.6; 
        }
        .image-stack:hover .back-right { 
            transform: translate(60px, 80px) rotate(8deg) scale(1); 
            opacity: 0.5; 
        }
        .image-stack:hover .main-img { 
            transform: scale(1.05); 
            z-index: 30;
        }
    </style>
</head>
<body class="p-6">

    <div class="relative w-full max-w-6xl bg-[#332c28] rounded-[60px] p-10 md:p-20 shadow-2xl border border-white/5 overflow-visible">
        
        <div class="absolute top-10 left-1/2 -translate-x-1/2 z-50">
            <div class="glass-card px-6 py-2 rounded-full text-[10px] tracking-[0.3em] text-gray-400 uppercase whitespace-nowrap">
                Elevate your space, elevate your life
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-16 items-center">
            
            <div class="z-50">
                <div class="inline-flex items-center gap-2 glass-card px-4 py-1.5 rounded-full mb-8">
                    <div class="flex gap-1.5"><div class="w-2 h-2 rounded-full bg-[#8b6e4e]"></div><div class="w-2 h-2 rounded-full bg-yellow-900/30"></div></div>
                    <span class="text-[11px] font-bold text-gray-400 tracking-widest uppercase">PaintBharat</span>
                </div>

                <h1 class="text-6xl md:text-[82px] font-bold text-white leading-[0.92] mb-8 tracking-tighter">
                    HOME<br/>INTERIOR<br/>
                    <span class="italic font-light text-gray-300">DESIGN</span>
                </h1>

                <p class="text-gray-400 text-sm max-w-sm mb-12 leading-relaxed opacity-80">
                    Transform your living spaces with our expert design solutions. Experience the perfect blend of aesthetics and functionality.
                </p>

                <div class="flex flex-wrap gap-5">
                    <button class="bg-[#8b6e4e] text-white px-10 py-4 rounded-2xl text-sm font-semibold hover:brightness-110 transition-all shadow-lg shadow-[#8b6e4e]/20">Explore Designs →</button>
                    <button class="glass-card text-white px-10 py-4 rounded-2xl text-sm font-semibold hover:bg-white/10 transition-all">Get Free Estimate</button>
                </div>
            </div>

            <div class="image-stack relative h-[500px] w-full flex items-center justify-center lg:justify-end cursor-pointer">
                
                <div class="back-img back-left w-64 h-80 rounded-[45px] overflow-hidden border border-white/10">
                    <img src="images/homeinterior.jpg" class="w-full h-full object-cover grayscale">
                </div>

                <div class="main-img relative z-30 w-[350px] md:w-[400px] rounded-[55px] overflow-hidden border-2 border-white/20 shadow-2xl transition-all duration-700 animate-float">
                    <div class="relative">
                        <img src="images/home_interior4.jpg" class="w-full h-[500px] object-cover">
                        <div class="absolute bottom-6 left-6 right-6 glass-card p-4 rounded-2xl">
                            <p class="text-[11px] text-white font-medium tracking-wide">Luxury Living Spaces</p>
                        </div>
                    </div>
                </div>

                <div class="back-img back-right w-60 h-72 rounded-[45px] overflow-hidden border border-white/10">
                    <img src="images/jewel tones.png" class="w-full h-full object-cover">
                </div>

            </div>
        </div>
    </div>

</body>
</html>g
