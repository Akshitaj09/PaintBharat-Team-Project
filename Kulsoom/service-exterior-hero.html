<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat Co. | Cinematic Reel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for Professional Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden;
            user-select: none;
            cursor: none;
        }

        .scene {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            z-index: 10;
        }

        .scene.active {
            visibility: visible;
        }

        /* Custom Cursor */
        #cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.3s, height 0.3s;
        }

        #cursor-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Noise Texture */
        #noise {
            position: fixed;
            inset: 0;
            z-index: 200;
            opacity: 0.04;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Kinetic Text Helper */
        .char {
            display: inline-block;
            opacity: 0;
            will-change: transform, filter, opacity;
        }

        /* Progress Bar Container */
        .progress-container {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .progress-track {
            flex: 1;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>

    <!-- Overlay UI Elements -->
    <div id="cursor"><div id="cursor-dot"></div></div>
    
    <div id="noise">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" /></filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)" />
        </svg>
    </div>

    <div class="progress-container" id="progress-tracks"></div>

    <header class="fixed top-16 left-12 z-[100] mix-blend-difference pointer-events-none">
        <h2 class="text-2xl font-black tracking-tighter uppercase text-white">PAINTBHARAT.CO</h2>
    </header>

    <footer class="fixed bottom-12 left-12 right-12 z-[100] flex justify-between items-end mix-blend-difference pointer-events-none text-white">
        <div class="flex gap-16">
            <div class="flex flex-col">
                <span class="text-[9px] font-black opacity-30 uppercase tracking-widest">Collection</span>
                <span id="footer-title" class="text-sm font-bold tracking-tighter uppercase">Identity</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[9px] font-black opacity-30 uppercase tracking-widest">Scene</span>
                <span id="footer-index" class="text-sm font-bold tracking-tighter">01 / 05</span>
            </div>
        </div>
        <button id="replay-btn" class="w-14 h-14 bg-white text-black rounded-2xl flex items-center justify-center pointer-events-auto hover:bg-red-600 hover:text-white transition-all shadow-2xl">
            <i data-lucide="rotate-ccw"></i>
        </button>
    </footer>

    <!-- Scene Container -->
    <div id="main-container" class="relative w-full h-screen">
        
        <!-- Scene 1: Identity (Keep) -->
        <section class="scene active bg-white text-black" id="scene-0" title="Identity">
            <div class="flex h-full">
                <div class="w-full md:w-1/2 flex flex-col justify-center px-12 md:px-24">
                    <h4 class="text-red-600 font-black tracking-[0.5em] mb-4 uppercase text-[10px] overline-reveal">Premium Division</h4>
                    <h1 class="text-5xl md:text-[8rem] font-black text-gray-950 leading-[0.75] tracking-tighter split-text" data-text="BEYOND" data-anim="slideUp"></h1>
                    <h1 class="text-5xl md:text-[8rem] font-black text-red-600 leading-[0.75] tracking-tighter split-text" data-text="PAINT." data-anim="pop" data-delay="0.4"></h1>
                    <p class="text-gray-400 max-w-xs font-bold uppercase text-[10px] tracking-widest mt-8 subtitle">High-Performance Coatings by PaintBharat Co.</p>
                </div>
                <div class="hidden md:block md:w-1/2 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200" class="w-full h-full object-cover bg-img" />
                </div>
            </div>
        </section>

        <!-- Scene 2: Transform (Keep) -->
        <section class="scene" id="scene-1" title="Transform">
            <div class="relative h-full bg-white">
                <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1200" class="absolute inset-0 w-full h-full object-cover grayscale brightness-110" />
                <div class="absolute inset-0 z-10 color-layer" style="clip-path: inset(0 100% 0 0)">
                    <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1200" class="w-full h-full object-cover" />
                </div>
                <div class="absolute inset-y-0 w-[4px] bg-red-600 z-20 scanner-line" style="left: 0%"></div>
                <div class="relative z-30 h-full flex items-center px-12 md:px-24 text-white">
                    <h2 class="text-4xl md:text-[7rem] font-black tracking-tighter split-text" data-text="SANCTUARY." data-anim="zoomBlur"></h2>
                </div>
            </div>
        </section>

        <!-- Scene 3: Architecture (Keep - was Scene 4) -->
        <section class="scene bg-[#0a0a0a]" id="scene-2" title="Architecture">
            <div class="absolute inset-0 flex gap-2 p-2 opacity-50 matrix-container"></div>
            <div class="relative z-20 h-full flex flex-col items-center justify-center text-center">
                <div class="bg-red-600 px-10 py-4 mb-6 shadow-[0_0_40px_rgba(239,68,68,0.5)] overflow-hidden">
                    <h3 class="text-white font-black text-5xl md:text-8xl tracking-tighter split-text" data-text="EXTERIOR" data-anim="flip"></h3>
                </div>
                <p class="text-white/30 font-black text-[10px] tracking-[0.5em] uppercase subtitle">High-Performance Architectural Coatings</p>
            </div>
        </section>

        <!-- Scene 4: Lifestyle (Keep - was Scene 6) -->
        <section class="scene bg-black" id="scene-3" title="Lifestyle">
            <div class="absolute inset-0 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=1600" class="w-full h-full object-cover lifestyle-bg" />
                <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent"></div>
            </div>
            <div class="relative h-full flex flex-col justify-center px-12 md:px-24 z-10">
                <h4 class="text-red-600 font-black tracking-[0.6em] mb-4 uppercase text-[10px] subtitle">The Modern Standard</h4>
                <h2 class="text-4xl md:text-[7.5rem] font-black text-white leading-[0.8] tracking-tighter split-text" data-text="LIFESTYLE" data-anim="slideLeft"></h2>
                <h2 class="text-4xl md:text-[7.5rem] font-black text-red-600 leading-[0.8] tracking-tighter split-text" data-text="BENCHMARK." data-delay="0.4" data-anim="slideRight"></h2>
                <div class="mt-12 flex items-center gap-6 info-line">
                    <div class="h-[2px] w-24 bg-white/20 line"></div>
                    <p class="text-[10px] font-bold text-white/50 uppercase tracking-[0.3em] max-w-sm text">Curated aesthetics for high-performance living.</p>
                </div>
            </div>
        </section>

        <!-- Scene 5: Finale (Keep - was Scene 9) -->
        <section class="scene bg-black" id="scene-4" title="PaintBharat">
            <div class="absolute inset-0 finale-bg overflow-hidden opacity-20 brightness-50">
                <img src="https://images.unsplash.com/photo-1480074568708-e7b720bb3f09?q=80&w=1600" class="w-full h-full object-cover finale-img" />
            </div>
            <div class="relative h-full flex flex-col items-center justify-center text-center px-6">
                <h1 class="text-4xl md:text-[8rem] font-black leading-none tracking-tighter text-white uppercase split-text" data-text="PAINTBHARAT." data-anim="megaReveal"></h1>
                <div class="mt-6">
                    <h3 class="text-sm md:text-2xl text-red-600 font-bold uppercase tracking-[0.3em] split-text" data-text="Where every wall tells a story" data-delay="0.8" data-anim="slideUp"></h3>
                </div>
                <p class="text-[9px] md:text-[11px] text-white/30 uppercase tracking-[0.8em] font-black mt-12 subtitle">Redefining The Skyline</p>
                <div class="h-[2px] bg-red-600 mt-20 accent-line" style="width: 0%"></div>
            </div>
        </section>

    </div>

    <script>
        lucide.createIcons();

        // 1. Setup Staggered Text Characters
        document.querySelectorAll('.split-text').forEach(el => {
            const text = el.getAttribute('data-text');
            el.innerHTML = text.split('').map(char => 
                `<span class="char">${char === ' ' ? '&nbsp;' : char}</span>`
            ).join('');
        });

        // Setup Matrix Images
        const matrixImgs = [
            "https://images.unsplash.com/photo-1613490493576-7fde63acd811",
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c",
            "https://images.unsplash.com/photo-1600607687940-c52df0d4399c",
            "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3",
            "https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83",
            "https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde",
            "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9"
        ];

        const matrix = document.querySelector('.matrix-container');
        for(let i=0; i<6; i++) {
            const col = document.createElement('div');
            col.className = `flex-1 flex flex-col gap-2 matrix-col-${i}`;
            for(let j=0; j<4; j++) {
                const img = document.createElement('div');
                img.className = 'h-[400px] w-full bg-white/5 rounded-lg overflow-hidden grayscale';
                const imgUrl = matrixImgs[(i * 4 + j) % matrixImgs.length];
                img.innerHTML = `<img src="${imgUrl}?q=80&w=400" class="w-full h-full object-cover opacity-60">`;
                col.appendChild(img);
            }
            matrix.appendChild(col);
        }

        const scenes = document.querySelectorAll('.scene');
        const progressTracks = document.getElementById('progress-tracks');
        let currentIndex = 0;
        let isPaused = false;
        const sceneDuration = 5; 
        let currentTimeline = null;

        scenes.forEach((_, i) => {
            const track = document.createElement('div');
            track.className = 'progress-track';
            track.innerHTML = `<div class="progress-bar" id="pb-${i}"></div>`;
            progressTracks.appendChild(track);
        });

        function animateChars(container, tl, startTime = 0) {
            const mode = container.getAttribute('data-anim') || 'slideUp';
            const chars = container.querySelectorAll('.char');
            const delayAttr = parseFloat(container.getAttribute('data-delay')) || 0;
            const absoluteStart = startTime + delayAttr;

            switch(mode) {
                case 'slideUp':
                    tl.fromTo(chars, { y: 100, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.03, duration: 0.6, ease: "power4.out" }, absoluteStart);
                    break;
                case 'pop':
                    tl.fromTo(chars, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.03, duration: 0.5, ease: "back.out(2)" }, absoluteStart);
                    break;
                case 'zoomBlur':
                    tl.fromTo(chars, { scale: 2, filter: 'blur(20px)', opacity: 0 }, { scale: 1, filter: 'blur(0px)', opacity: 1, stagger: 0.04, duration: 0.8, ease: "expo.out" }, absoluteStart);
                    break;
                case 'drop':
                    tl.fromTo(chars, { y: -150, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.02, duration: 0.8, ease: "elastic.out(1, 0.5)" }, absoluteStart);
                    break;
                case 'flip':
                    tl.fromTo(chars, { rotateX: -90, opacity: 0 }, { rotateX: 0, opacity: 1, stagger: 0.03, duration: 0.6, ease: "power3.out" }, absoluteStart);
                    break;
                case 'slideLeft':
                    tl.fromTo(chars, { x: 50, opacity: 0 }, { x: 0, opacity: 1, stagger: 0.02, duration: 0.6, ease: "power3.out" }, absoluteStart);
                    break;
                case 'slideRight':
                    tl.fromTo(chars, { x: -50, opacity: 0 }, { x: 0, opacity: 1, stagger: 0.02, duration: 0.6, ease: "power3.out" }, absoluteStart);
                    break;
                case 'megaReveal':
                    tl.fromTo(chars, { scale: 3, rotate: 15, opacity: 0, filter: 'blur(30px)' }, { scale: 1, rotate: 0, opacity: 1, filter: 'blur(0px)', stagger: 0.05, duration: 1.2, ease: "expo.out" }, absoluteStart);
                    break;
                default:
                    tl.fromTo(chars, { opacity: 0 }, { opacity: 1, stagger: 0.03, duration: 0.4 }, absoluteStart);
            }
        }

        function playScene(index) {
            if (currentTimeline) currentTimeline.kill();
            
            document.getElementById('footer-title').innerText = scenes[index].getAttribute('title') || "PaintBharat";
            document.getElementById('footer-index').innerText = `0${index + 1} / 0${scenes.length}`;
            
            scenes.forEach(s => {
                s.classList.remove('active');
                gsap.set(s, { visibility: 'hidden', zIndex: 10 });
            });
            
            const scene = scenes[index];
            scene.classList.add('active');
            gsap.set(scene, { visibility: 'visible', zIndex: 50 });

            const tl = gsap.timeline({
                onComplete: () => {
                    if (!isPaused) {
                        currentIndex = (currentIndex + 1) % scenes.length;
                        playScene(currentIndex);
                    }
                }
            });
            currentTimeline = tl;

            tl.fromTo(scene, { y: '100%', rotate: 1 }, { y: '0%', rotate: 0, duration: 1, ease: "expo.out" });
            tl.to(`#pb-${index}`, { width: '100%', duration: sceneDuration, ease: 'none' }, 0);

            scene.querySelectorAll('.split-text').forEach(textContainer => {
                animateChars(textContainer, tl, 0.4);
            });

            const sub = scene.querySelector('.subtitle');
            if(sub) tl.fromTo(sub, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8 }, 1.2);

            if(index === 1) { 
                tl.to(scene.querySelector('.color-layer'), { clipPath: 'inset(0 0% 0 0)', duration: 3 }, 0.8);
                tl.to(scene.querySelector('.scanner-line'), { left: '100%', duration: 3 }, 0.8);
            }
            
            if(index === 2) {
                gsap.to('.matrix-col-0, .matrix-col-2, .matrix-col-4', { y: -300, duration: 10, repeat: -1, yoyo: true });
                gsap.to('.matrix-col-1, .matrix-col-3, .matrix-col-5', { y: 300, duration: 10, repeat: -1, yoyo: true });
            }

            if(index === 3) {
                tl.from('.lifestyle-bg', { scale: 1.3, duration: 5, ease: 'linear' }, 0);
            }

            if(index === 4) { 
                tl.to(scene.querySelector('.accent-line'), { width: '100%', duration: 1.5 }, 1.5);
                gsap.to('.finale-img', { scale: 1.2, duration: 5 });
            }
        }

        window.addEventListener('mousemove', (e) => {
            gsap.to('#cursor', { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        window.addEventListener('mousedown', () => {
            isPaused = true;
            if(currentTimeline) currentTimeline.pause();
            gsap.to('#cursor', { width: 80, height: 80, duration: 0.3 });
        });

        window.addEventListener('mouseup', () => {
            isPaused = false;
            if(currentTimeline) currentTimeline.resume();
            gsap.to('#cursor', { width: 40, height: 40, duration: 0.3 });
        });

        document.getElementById('replay-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.progress-bar').forEach(b => gsap.set(b, { width: '0%' }));
            currentIndex = 0;
            playScene(0);
        });

        window.onload = () => playScene(0);
    </script>
</body>
</html>
