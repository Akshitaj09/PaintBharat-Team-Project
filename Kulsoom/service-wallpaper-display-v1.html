<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINTBHARAT CO. | Premium Wallpapers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
        
        :root {
            --bg-color: #f5f2ee;
            --accent-color: #e30047;
            --main-font: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--main-font);
            background-color: var(--bg-color);
            margin: 0;
            overflow-x: hidden;
            color: #1a1a1a;
        }

        .scroll-section {
            height: 100vh;
            width: 100%;
            position: relative;
        }

        .main-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 40px 120px -20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }

        /* State Classes */
        .stage-hero { width: 900px; height: 550px; border-radius: 60px; }
        .stage-catalog { width: 1150px; height: 620px; border-radius: 70px; }
        .stage-detail { width: 100vw; height: 100vh; border-radius: 0; }

        .roll-float {
            animation: floating 8s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .scene {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .scene.inactive-up {
            opacity: 0;
            transform: translateY(-60px) scale(0.95);
        }

        .scene.inactive-down {
            opacity: 0;
            transform: translateY(60px) scale(0.95);
        }

        .bg-text {
            font-size: 140px;
            font-weight: 800;
            color: rgba(0,0,0,0.03);
            font-style: italic;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: -0.05em;
        }

        .explore-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .explore-btn::after {
            content: '\f178';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: -20px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .explore-btn:hover {
            padding-right: 3.5rem;
            background-color: var(--accent-color);
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 10px 20px rgba(227, 0, 71, 0.2);
        }

        .explore-btn:hover::after {
            right: 1.5rem;
            opacity: 1;
        }

        .catalog-card {
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .catalog-card:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-10px);
        }
        .catalog-card:hover .preview-img {
            transform: scale(1.1);
        }

        .preview-img {
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .custom-scroll::-webkit-scrollbar { width: 0; }
        
        .slide-up {
            animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-font {
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        /* Detail Scene Styling */
        .wallpaper-card {
            transition: all 0.4s ease;
        }
        .wallpaper-card:hover {
            transform: translateY(-8px);
        }
    </style>
</head>
<body>

    <!-- Main Dynamic Stage -->
    <div id="mainStage" class="main-stage stage-hero">
        <div class="glass-card w-full h-full relative">
            
            <!-- ALIGNED HEADER (Logo + Brand + Home) -->
            <div class="flex justify-between items-center px-10 pt-10 pb-4 z-[60]">
                <div class="flex items-center space-x-3">
                    <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 0C22.3858 0 0 22.3858 0 50C0 77.6142 22.3858 100 50 100C77.6142 100 100 77.6142 100 50C100 22.3858 77.6142 0 50 0ZM52.41 12.03C72.07 12.03 88 27.96 88 47.62C88 67.28 72.07 83.21 52.41 83.21C46.85 83.21 41.62 81.93 36.96 79.64C31.57 76.99 29.5 70.33 32.33 65.04C33.88 62.15 36.6 59.89 39.84 58.82C44.73 57.2 46.8 52.48 44.59 48.06C42.47 43.81 37.1 42.48 33.2 45.26C31.32 46.59 29.15 47.38 26.8 47.38C20.28 47.38 15 42.1 15 35.58C15 22.58 25.58 12.03 38.58 12.03C43.19 12.03 47.5 13.31 51.15 15.53C51.56 15.78 52.01 15.9 52.46 15.9C53.79 15.9 54.87 14.82 54.87 13.49C54.87 12.68 54.47 11.96 53.86 11.52C53.4 11.19 52.92 10.9 52.41 10.66C52.41 10.66 52.41 12.03 52.41 12.03Z" fill="#e30047"/>
                    </svg>
                    <span class="font-bold text-lg tracking-tight uppercase">PaintBharat Co.</span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="w-10 h-10 rounded-full bg-black/5 flex items-center justify-center hover:bg-black/10 transition-colors pointer-events-auto">
                        <i class="fa-solid fa-house-chimney text-black text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- SCENE 1: HERO -->
            <div id="scene1" class="scene active flex items-center px-20 h-full">
                <div class="bg-text uppercase">Wallpaper</div>
                <div class="w-2/5 flex flex-col space-y-8 z-10 slide-up">
                    <div>
                        <h2 class="text-[11px] font-bold uppercase tracking-[0.2em] text-gray-400 mb-3">Bharat Heritage Series</h2>
                        <h1 class="text-6xl header-font italic uppercase leading-[0.85] tracking-tighter">Transform<br>Your Walls</h1>
                    </div>
                </div>
                <div class="w-3/5 flex items-center justify-center relative z-10">
                    <div class="roll-float drop-shadow-2xl">
                        <svg width="400" height="400" viewBox="0 0 400 400">
                           <defs>
                                <linearGradient id="rollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#d4c8b8;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#bdae9b;stop-opacity:1" />
                                </linearGradient>
                                <pattern id="pattern1" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
                                </pattern>
                           </defs>
                           <rect x="150" y="50" width="100" height="300" rx="50" fill="url(#rollGrad)" />
                           <rect x="150" y="50" width="100" height="300" rx="50" fill="url(#pattern1)" />
                        </svg>
                    </div>
                    
                    <div class="absolute bottom-16 right-0 bg-white/80 backdrop-blur-2xl p-6 rounded-[32px] border border-white flex items-center space-x-10 shadow-2xl">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Starts at</span>
                            <span class="text-2xl font-extrabold">₹ 1,899</span>
                        </div>
                        <button onclick="window.scrollTo({top: window.innerHeight, behavior: 'smooth'})" class="bg-black text-white px-12 py-5 rounded-2xl font-bold text-[11px] uppercase tracking-widest explore-btn">View Catalog</button>
                    </div>
                </div>
            </div>

            <!-- SCENE 2: CATALOG -->
            <div id="scene2" class="scene inactive-down flex-col px-12 h-full pt-12">
                <div class="grid grid-cols-3 gap-8 h-[80%] pb-10">
                    <!-- Collection 1: PREMIUM -->
                    <div class="catalog-card bg-white/40 rounded-[50px] p-10 flex flex-col items-center justify-between cursor-pointer border border-white/20">
                        <div class="w-full h-48 bg-[#e8e4df] rounded-3xl overflow-hidden relative shadow-inner">
                             <div class="absolute inset-0 opacity-20 preview-img" style="background-image: radial-gradient(circle, #000 1px, transparent 1px); background-size: 20px 20px;"></div>
                        </div>
                        <div class="text-center w-full">
                            <h3 class="font-extrabold text-3xl uppercase tracking-tighter header-font italic mb-1">PREMIUM</h3>
                            <p class="text-[10px] text-gray-400 font-bold uppercase mb-6 tracking-widest">High-end textures</p>
                            <button onclick="exploreCollection('PREMIUM')" class="w-full bg-black text-white py-4 rounded-2xl text-[10px] font-bold uppercase tracking-[0.2em] explore-btn">Explore More</button>
                        </div>
                    </div>
                    <!-- Collection 2: LUXURY -->
                    <div class="catalog-card bg-white/40 rounded-[50px] p-10 flex flex-col items-center justify-between cursor-pointer border border-white/20">
                        <div class="w-full h-48 bg-[#d8dde8] rounded-3xl overflow-hidden relative shadow-inner">
                             <div class="absolute inset-0 opacity-10 preview-img" style="background-image: repeating-linear-gradient(45deg, #000, #000 1px, transparent 1px, transparent 10px);"></div>
                        </div>
                        <div class="text-center w-full">
                            <h3 class="font-extrabold text-3xl uppercase tracking-tighter header-font italic mb-1">LUXURY</h3>
                            <p class="text-[10px] text-gray-400 font-bold uppercase mb-6 tracking-widest">Hand-picked designs</p>
                            <button onclick="exploreCollection('LUXURY')" class="w-full bg-black text-white py-4 rounded-2xl text-[10px] font-bold uppercase tracking-[0.2em] explore-btn">Explore More</button>
                        </div>
                    </div>
                    <!-- Collection 3: ECO -->
                    <div class="catalog-card bg-white/40 rounded-[50px] p-10 flex flex-col items-center justify-between cursor-pointer border border-white/20">
                        <div class="w-full h-48 bg-[#dfede8] rounded-3xl overflow-hidden relative shadow-inner">
                             <div class="absolute inset-0 opacity-20 preview-img" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>
                        </div>
                        <div class="text-center w-full">
                            <h3 class="font-extrabold text-3xl uppercase tracking-tighter header-font italic mb-1">ECO</h3>
                            <p class="text-[10px] text-gray-400 font-bold uppercase mb-6 tracking-widest">Sustainable materials</p>
                            <button onclick="exploreCollection('ECO')" class="w-full bg-black text-white py-4 rounded-2xl text-[10px] font-bold uppercase tracking-[0.2em] explore-btn">Explore More</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SCENE 3: DYNAMIC GALLERY -->
            <div id="scene3" class="scene inactive-down h-full overflow-y-auto custom-scroll px-16 pt-16">
                <div class="flex justify-between items-end mb-12">
                    <div class="slide-up">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Curated Collection</span>
                        <h2 id="galleryTitle" class="text-6xl header-font uppercase italic leading-none tracking-tighter">PREMIUM</h2>
                    </div>
                    <button onclick="window.scrollTo({top: window.innerHeight, behavior: 'smooth'})" class="text-[10px] font-bold uppercase tracking-widest border-b border-black pb-1 hover:opacity-50 transition">Back to Catalog</button>
                </div>

                <div id="galleryGrid" class="grid grid-cols-4 gap-8 pb-32">
                    <!-- Cards will be injected here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Scroll Sections -->
    <div id="sec1" class="scroll-section"></div>
    <div id="sec2" class="scroll-section"></div>
    <div id="sec3" class="scroll-section"></div>

    <div class="fixed bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center opacity-30 z-[100] pointer-events-none">
        <span class="text-[9px] font-bold uppercase tracking-[0.6em] mb-4">Scroll to Explore</span>
        <div class="w-[1px] h-12 bg-black origin-top animate-pulse"></div>
    </div>

    <script>
        const mainStage = document.getElementById('mainStage');
        const scene1 = document.getElementById('scene1');
        const scene2 = document.getElementById('scene2');
        const scene3 = document.getElementById('scene3');
        const galleryGrid = document.getElementById('galleryGrid');
        const galleryTitle = document.getElementById('galleryTitle');

        const collectionData = {
            'PREMIUM': [
                { name: 'Varanasi Velvet', price: '2,899', pattern: 'radial-gradient(circle, #000 1px, transparent 1px)', size: '20px 20px' },
                { name: 'Marigold Silk', price: '3,199', pattern: 'linear-gradient(45deg, #f59e0b 25%, transparent 25%)', size: '40px 40px' },
                { name: 'Royal Damask', price: '2,499', pattern: 'url("https://www.transparenttextures.com/patterns/cubes.png")', size: 'auto' },
                { name: 'Satin Pearl', price: '3,499', pattern: 'linear-gradient(to right, #fff, #f5f2ee)', size: '100% 100%' },
                { name: 'Jaipur Gold', price: '2,999', pattern: 'repeating-linear-gradient(0deg, #d4af37, #d4af37 1px, transparent 1px, transparent 10px)', size: 'auto' },
                { name: 'Midnight Marble', price: '3,899', pattern: 'url("https://www.transparenttextures.com/patterns/asfalt-dark.png")', size: 'auto' },
            ],
            'LUXURY': [
                { name: 'Gold Leaf Mural', price: '8,499', pattern: 'linear-gradient(135deg, #cfb53b, #fff)', size: 'auto' },
                { name: 'Hand-painted Flora', price: '12,999', pattern: 'url("https://www.transparenttextures.com/patterns/pinstriped-suit.png")', size: 'auto' },
                { name: 'Embossed Leather', price: '7,499', pattern: 'url("https://www.transparenttextures.com/patterns/padded.png")', size: 'auto' },
                { name: 'Crystal Shimmer', price: '9,899', pattern: 'radial-gradient(circle, #fff 1px, transparent 1px)', size: '8px 8px' },
            ],
            'ECO': [
                { name: 'Bamboo Grass', price: '1,899', pattern: 'repeating-linear-gradient(90deg, #4d7c0f, #4d7c0f 2px, #f5f2ee 2px, #f5f2ee 10px)', size: 'auto' },
                { name: 'Recycled Jute', price: '1,499', pattern: 'url("https://www.transparenttextures.com/patterns/natural-paper.png")', size: 'auto' },
                { name: 'Natural Linen', price: '2,199', pattern: 'url("https://www.transparenttextures.com/patterns/linen.png")', size: 'auto' },
                { name: 'Corky Texture', price: '1,799', pattern: 'url("https://www.transparenttextures.com/patterns/cork-board.png")', size: 'auto' },
            ]
        };

        function exploreCollection(type) {
            galleryTitle.innerText = type;
            renderGallery(type);
            window.scrollTo({
                top: window.innerHeight * 2,
                behavior: 'smooth'
            });
        }

        function renderGallery(type) {
            const items = collectionData[type];
            galleryGrid.innerHTML = '';
            
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card bg-white/40 border border-white/20 rounded-[40px] p-6 flex flex-col slide-up';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="w-full h-40 rounded-3xl overflow-hidden mb-6 shadow-inner" style="background-image: ${item.pattern}; background-size: ${item.size}; background-color: rgba(0,0,0,0.05);"></div>
                    <div class="flex flex-col flex-grow">
                        <h4 class="font-extrabold text-lg uppercase leading-tight tracking-tight mb-1">${item.name}</h4>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-4">₹ ${item.price} / Roll</p>
                        <button class="mt-auto py-3 bg-black text-white rounded-2xl text-[9px] font-bold uppercase tracking-widest hover:opacity-80 transition">Order Sample</button>
                    </div>
                `;
                galleryGrid.appendChild(card);
            });
        }

        // Initial load
        renderGallery('PREMIUM');

        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const winHeight = window.innerHeight;

            if (scrollPos < winHeight * 0.5) {
                updateState('stage-hero', scene1, [scene2, scene3]);
            }
            else if (scrollPos >= winHeight * 0.5 && scrollPos < winHeight * 1.5) {
                updateState('stage-catalog', scene2, [scene1, scene3]);
            }
            else if (scrollPos >= winHeight * 1.5) {
                updateState('stage-detail', scene3, [scene1, scene2]);
            }
        });

        function updateState(stageClass, activeScene, otherScenes) {
            mainStage.className = 'main-stage ' + stageClass;
            
            activeScene.classList.add('active');
            activeScene.classList.remove('inactive-up', 'inactive-down');

            otherScenes.forEach(scene => {
                scene.classList.remove('active');
                if (scene.id < activeScene.id) {
                    scene.classList.add('inactive-up');
                    scene.classList.remove('inactive-down');
                } else {
                    scene.classList.add('inactive-down');
                    scene.classList.remove('inactive-up');
                }
            });
        }
    </script>
</body>
</html>
