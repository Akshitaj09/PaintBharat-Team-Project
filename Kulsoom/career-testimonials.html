<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Testimonial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Smooth fade transition for the grid */
        .grid-transition {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        
        .fade-out {
            opacity: 0;
            transform: translateY(20px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center bg-gray-100 relative overflow-x-hidden" 
      style="background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; background-attachment: fixed;">
    
    <!-- Darker overlay to ensure the glass effect and white heading pops beautifully against the office background -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Main Section Container -->
    <section class="relative z-10 w-full px-4 py-24 flex flex-col items-center min-h-screen justify-center">
        
        <!-- Heading -->
        <div class="text-center mb-24">
            <h2 class="text-4xl md:text-5xl font-bold text-white mb-4 drop-shadow-lg tracking-tight">
                What Our Employees Say About Us
            </h2>
            <p class="text-white/80 text-lg md:text-xl font-medium tracking-wide drop-shadow-md">
                Inside our culture of growth, support, and innovation.
            </p>
        </div>

        <!-- Testimonials Grid Container (3 columns, 2 rows max) -->
        <div id="testimonials-grid" class="w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-20 grid-transition">
            <!-- Cards will be injected here by JS -->
        </div>

        <!-- Slider Controls (Dots) -->
        <div class="flex gap-3 mt-16 z-20" id="slider-dots">
            <!-- Dots generated by JS -->
        </div>

    </section>

    <!-- JavaScript logic to handle JSON data and Slider -->
    <script>
        // JSON Data for employee culture testimonials (12 items for 2 pages of 6)
        const testimonialsData = [
            {
                id: 1,
                text: "The collaborative environment here is unmatched. Management actively listens to our ideas, and I've felt incredibly supported in my professional growth since day one. It's rare to find a workplace that genuinely cares about your well-being.",
                name: "Sarah Jenkins",
                title: "Software Engineer",
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 2,
                text: "We don't just talk about work-life balance; we actually practice it. The flexibility to manage my own hours while trusting my team to deliver has completely transformed how I approach my career. It's a breath of fresh air.",
                name: "Michael Chen",
                title: "Product Manager",
                avatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 3,
                text: "Every single day brings a new learning opportunity. The mentorship programs and regular knowledge-sharing sessions ensure that nobody gets left behind. I've leveled up my skills faster here than anywhere else.",
                name: "Elena Rodriguez",
                title: "UX Designer",
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 4,
                text: "The diversity of thought in our team makes problem-solving so much fun. Leadership ensures that every voice is heard, regardless of your title or tenure. It truly feels like a flat hierarchy where the best ideas win.",
                name: "David Kim",
                title: "Data Scientist",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 5,
                text: "I appreciate how transparent the leadership team is during our all-hands meetings. We know exactly where the company is heading, the challenges we face, and how our individual roles contribute to the bigger picture.",
                name: "Jessica Taylor",
                title: "HR Specialist",
                avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 6,
                text: "The team spirit is incredible. Whether we're launching a major feature or just having a Friday afternoon virtual coffee, the camaraderie makes even the most stressful weeks enjoyable. I love the people I work with.",
                name: "Alex Patel",
                title: "DevOps Engineer",
                avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 7,
                text: "What stands out to me is the emphasis on mental health and avoiding burnout. My managers proactively check in to make sure my workload is manageable. It’s empowering to work for a company with such high empathy.",
                name: "Chloe Smith",
                title: "Marketing Lead",
                avatar: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 8,
                text: "I started here as a junior, and the trust they placed in me allowed me to step up and own entire projects. The culture of 'failing fast' without blame means we are constantly innovating without fear.",
                name: "Marcus Johnson",
                title: "Frontend Developer",
                avatar: "https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 9,
                text: "It’s a truly inclusive environment. Employee resource groups are actively funded and supported by leadership, creating spaces where everyone can bring their authentic self to work every single day.",
                name: "Olivia Martinez",
                title: "Operations Manager",
                avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 10,
                text: "The perks are great, but the people are better. We celebrate each other's wins—both professional and personal. There's zero toxic competition; just a group of smart people pushing each other to be better.",
                name: "Daniel Lee",
                title: "Customer Success",
                avatar: "https://images.unsplash.com/photo-1527980965255-d3b416303d12?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 11,
                text: "I was encouraged to take a month-long sabbatical after my 3rd year to recharge and travel. The fact that the company invests so heavily in employee retention and happiness speaks volumes about their values.",
                name: "Sophia Carter",
                title: "Lead Architect",
                avatar: "https://images.unsplash.com/photo-1554151228-14d9def656e4?auto=format&fit=crop&w=200&q=80"
            },
            {
                id: 12,
                text: "Even as a fully remote employee, I've never felt isolated. The communication channels are incredibly well organized, and the annual company retreats make us feel like one big family working towards the same goal.",
                name: "James Wilson",
                title: "Backend Developer",
                avatar: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=200&q=80"
            }
        ];

        const itemsPerPage = 6; // 3 columns x 2 rows
        const totalPages = Math.ceil(testimonialsData.length / itemsPerPage);
        let currentPage = 0;
        
        // DOM Elements
        const gridContainer = document.getElementById('testimonials-grid');
        const dotsContainer = document.getElementById('slider-dots');

        // Initialize dots
        function initDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${i === 0 ? 'bg-white scale-125 shadow-[0_0_10px_rgba(255,255,255,0.8)]' : 'bg-white/40 hover:bg-white/80'}`;
                dot.setAttribute('aria-label', `Go to page ${i + 1}`);
                dot.onclick = () => changePage(i);
                dotsContainer.appendChild(dot);
            }
        }

        function updateDots(newIndex) {
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === newIndex) {
                    dots[i].className = 'w-3 h-3 rounded-full transition-all duration-300 bg-white scale-125 shadow-[0_0_10px_rgba(255,255,255,0.8)]';
                } else {
                    dots[i].className = 'w-3 h-3 rounded-full transition-all duration-300 bg-white/40 hover:bg-white/80';
                }
            }
        }

        // Render HTML for a specific page
        function getCardsHTML(pageIndex) {
            const startIndex = pageIndex * itemsPerPage;
            const pageItems = testimonialsData.slice(startIndex, startIndex + itemsPerPage);
            
            return pageItems.map(t => `
                <div class="relative w-full max-w-[420px] mx-auto group transition-all duration-500 hover:-translate-y-4">
                    
                    <!-- Avatar with Hover Effects (Scale, Rotate, Border color) -->
                    <div class="absolute -top-12 left-1/2 -translate-x-1/2 z-20 transition-all duration-500 group-hover:scale-110 group-hover:rotate-[-4deg]">
                        <img src="${t.avatar}" alt="${t.name}" class="w-24 h-24 rounded-full border-[3px] border-white/60 group-hover:border-white object-cover shadow-lg bg-gray-200 transition-all duration-500 group-hover:shadow-[0_10px_20px_rgba(0,0,0,0.3)]">
                    </div>

                    <!-- Glassmorphism Card Body with Enhanced Hover glow -->
                    <div class="h-full bg-gradient-to-br from-white/60 to-white/30 backdrop-blur-xl border border-white/40 shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] 
                                group-hover:shadow-[0_15px_40px_0_rgba(255,255,255,0.15)] group-hover:border-white/80 group-hover:from-white/80 group-hover:to-white/50
                                pt-16 pb-10 px-8 rounded-tl-2xl rounded-tr-[5rem] rounded-br-2xl rounded-bl-[5rem] flex flex-col items-center relative z-10 transition-all duration-500">
                        
                        <div class="flex flex-col items-center w-full h-full justify-between">
                            <div class="flex flex-col items-center">
                                <!-- Heading -->
                                <h3 class="text-[0.75rem] font-bold tracking-[0.3em] uppercase text-black mb-3 group-hover:text-blue-900 transition-colors duration-300">
                                    Employee
                                </h3>
                                
                                <!-- Stars (Turn yellow on hover) -->
                                <div class="flex gap-1 mb-5">
                                    ${Array(5).fill('<svg class="w-5 h-5 text-gray-800 group-hover:text-yellow-500 fill-current transition-colors duration-500" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>').join('')}
                                </div>

                                <!-- Quote Text -->
                                <p class="text-center text-gray-900 font-medium text-[14px] leading-[1.6] mb-6 line-clamp-4">
                                    ${t.text}
                                </p>
                            </div>

                            <!-- Author Info -->
                            <div class="text-center mt-auto">
                                <p class="italic text-gray-900 text-[15px] font-medium transition-colors duration-300">
                                    <span class="font-bold">— ${t.name}</span><br>
                                    <span class="font-normal text-gray-700 group-hover:text-blue-800 transition-colors duration-300">${t.title}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Change Page with smooth fade for the entire grid
        function changePage(pageIndex) {
            if (pageIndex === currentPage && gridContainer.innerHTML !== '') return;
            
            // Start fade out
            gridContainer.classList.add('fade-out');
            
            setTimeout(() => {
                // Update HTML
                gridContainer.innerHTML = getCardsHTML(pageIndex);
                
                // Update state
                currentPage = pageIndex;
                updateDots(pageIndex);
                
                // Start fade in
                gridContainer.classList.remove('fade-out');
            }, 500); // Matches the CSS transition time
        }

        // Auto-play slider (Cycles every 8 seconds to allow reading 6 cards)
        setInterval(() => {
            const nextPage = (currentPage + 1) % totalPages;
            changePage(nextPage);
        }, 8000);

        // Run on load
        initDots();
        changePage(0);
    </script>
</body>
</html>
