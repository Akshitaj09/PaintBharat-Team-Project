<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Global font set to Poppins */
        body { 
            font-family: 'Poppins', sans-serif; 
        }

        /* Specific class for the Playfair Display heading */
        .font-serif { 
            font-family: 'Playfair Display', serif; 
        }
        
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out, padding 0.4s ease-in-out;
            opacity: 0;
        }

        .faq-item.active .faq-answer {
            max-height: 400px;
            opacity: 1;
            padding-bottom: 1rem;
        }

        .faq-item.active .chevron-container {
            background-color: #fce7f3;
            transform: rotate(180deg);
        }

        .faq-item.active .chevron-icon {
            color: #db2777;
        }

        .selection-pink::selection {
            background-color: #fbcfe8;
        }
    </style>
</head>
<body class="min-h-screen bg-[#fff5f7] selection-pink">
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-40 -z-10">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-pink-200 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-pink-100 rounded-full blur-3xl"></div>
    </div>

    <div class="relative max-w-3xl mx-auto px-6 py-12">
        <header class="text-center mb-10">
            <span class="text-pink-500 font-semibold tracking-widest uppercase text-[10px] mb-2 block">
                Your Home, Reimagined
            </span>

            <h1 class="text-4xl md:text-5xl font-serif text-gray-900 mb-4">
                FAQs
            </h1>

            <p class="text-sm text-gray-600 max-w-lg mx-auto mb-8">
                Everything you need to know about our premium interior, exterior, and
                wallpaper services. Transforming spaces with precision and care.
            </p>

            <div class="relative max-w-sm mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-4 top-1/2 -translate-y-1/2 text-pink-300 w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y2="16.65"></line></svg>
                <input
                    id="faqSearch"
                    type="text"
                    placeholder="Search services..."
                    class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-pink-100 shadow-sm focus:outline-none focus:ring-2 focus:ring-pink-200 focus:border-pink-300 transition-all text-sm text-gray-700"
                />
            </div>
        </header>

        <div class="bg-white rounded-[1.5rem] shadow-lg shadow-pink-100/30 p-6 md:p-8 border border-pink-50" id="faqContainer">
            </div>

        <footer class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white/60 backdrop-blur-sm p-4 rounded-xl border border-white flex flex-col items-center text-center group hover:bg-white hover:shadow-md transition-all cursor-pointer">
                <div class="w-10 h-10 bg-pink-100 rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-pink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <h3 class="text-sm font-semibold text-gray-800 mb-0.5">Get a Quote</h3>
                <p class="text-[11px] text-gray-500">contact@paintbharat.com</p>
            </div>

            <div class="bg-white/60 backdrop-blur-sm p-4 rounded-xl border border-white flex flex-col items-center text-center group hover:bg-white hover:shadow-md transition-all cursor-pointer">
                <div class="w-10 h-10 bg-pink-100 rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-pink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </div>
                <h3 class="text-sm font-semibold text-gray-800 mb-0.5">WhatsApp Us</h3>
                <p class="text-[11px] text-gray-500">Chat with a designer</p>
            </div>

            <div class="bg-white/60 backdrop-blur-sm p-4 rounded-xl border border-white flex flex-col items-center text-center group hover:bg-white hover:shadow-md transition-all cursor-pointer">
                <div class="w-10 h-10 bg-pink-100 rounded-lg flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-pink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.28-2.28a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </div>
                <h3 class="text-sm font-semibold text-gray-800 mb-0.5">Call Booking</h3>
                <p class="text-[11px] text-gray-500">+91 93252 44725</p>
            </div>
        </footer>
    </div>

    <script>
        const faqs = [
            {
                question: "Do you offer professional color consultations?",
                answer: "Yes, we do! Choosing the right shade can be overwhelming. Our experts provide a complimentary color consultation to help you select a palette that complements your lighting, furniture, and personal style."
            },
            {
                question: "How long does a typical exterior painting project take?",
                answer: "Most residential exterior projects are completed within 3 to 7 days, depending on the size of the home and weather conditions. We ensure a thorough preparation process including power washing and scraping."
            },
            {
                question: "Why is waterproofing essential before painting?",
                answer: "Waterproofing protects your structure from moisture ingress, which can lead to mold and paint peeling. We apply high-grade membranes to ensure your home stays dry and your paint looks fresh for years."
            },
            {
                question: "Can you remove old wallpaper before installing new ones?",
                answer: "Absolutely. Our team handles the entire process: we carefully strip old wallpaper, repair any surface imperfections, sand the walls smooth, and prime them before experts hang your new wallpaper selection."
            },
            {
                question: "What measures do you take to protect my furniture?",
                answer: "Protection is our priority. We use heavy-duty drop cloths and plastic sheeting to cover all furniture and flooring. We move heavy items to the center of the room and move them back once the project is complete."
            },
            {
                question: "Are the paints you use eco-friendly?",
                answer: "Yes, we primarily use low-VOC or zero-VOC paints. These are virtually odorless and much safer for your family and pets, ensuring you can enjoy your newly painted space immediately."
            }
        ];

        const faqContainer = document.getElementById('faqContainer');
        const searchInput = document.getElementById('faqSearch');

        function renderFAQs(data) {
            if (data.length === 0) {
                faqContainer.innerHTML = `
                    <div class="text-center py-6">
                        <p class="text-gray-400 text-sm italic">No results found.</p>
                    </div>
                `;
                return;
            }

            faqContainer.innerHTML = data.map((faq, index) => `
                <div class="faq-item border-b border-pink-50 last:border-0" data-index="${index}">
                    <button class="faq-toggle w-full py-4 flex justify-between items-center text-left transition-all duration-300 hover:text-pink-600 group focus:outline-none">
                        <span class="text-base font-medium text-gray-800 pr-6 group-hover:translate-x-1 transition-transform duration-300">
                            ${faq.question}
                        </span>
                        <div class="chevron-container p-1.5 rounded-full transition-all duration-300 bg-transparent flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="chevron-icon w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </button>
                    <div class="faq-answer">
                        <p class="text-sm text-gray-600 leading-relaxed max-w-2xl">
                            ${faq.answer}
                        </p>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.faq-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = btn.closest('.faq-item');
                    document.querySelectorAll('.faq-item').forEach(otherItem => {
                        if (otherItem !== item) otherItem.classList.remove('active');
                    });
                    item.classList.toggle('active');
                });
            });
        }

        renderFAQs(faqs);

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = faqs.filter(faq => 
                faq.question.toLowerCase().includes(query) || 
                faq.answer.toLowerCase().includes(query)
            );
            renderFAQs(filtered);
        });
    </script>
</body>
</html>
