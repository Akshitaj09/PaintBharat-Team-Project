<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wall Color Visualizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    background: #f1f5f9;
    font-family: sans-serif;
}
.visualizer-container {
    position: relative;
    width: 900px;
    height: 550px;
    margin: auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}
.visualizer-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.wall-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 65%; /* Adjust this if wall height changes */
    mix-blend-mode: multiply;
    opacity: 0.6;
    transition: background-color 0.4s ease, opacity 0.3s ease;
    pointer-events: none;
}
.color-btn {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s ease;
}
.color-btn:hover {
    transform: scale(1.1);
}
</style>
</head>

<body class="p-10 text-center">

<h1 class="text-3xl font-bold mb-8">Wall Color Visualizer</h1>

<div class="visualizer-container">
    <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=1600" alt="Room">
    <div id="wallOverlay" class="wall-overlay"></div>
</div>

<div class="flex justify-center gap-6 mt-10 flex-wrap">

    <div class="color-btn" style="background:#1E3A8A" 
         onclick="changeColor('#1E3A8A','Royal Blue')"></div>

    <div class="color-btn" style="background:#064E3B" 
         onclick="changeColor('#064E3B','Emerald')"></div>

    <div class="color-btn" style="background:#991B1B" 
         onclick="changeColor('#991B1B','Crimson')"></div>

    <div class="color-btn" style="background:#374151" 
         onclick="changeColor('#374151','Slate Gray')"></div>

    <div class="color-btn" style="background:#0D9488" 
         onclick="changeColor('#0D9488','Teal')"></div>

</div>

<p id="colorName" class="mt-6 text-lg font-semibold text-gray-700">
    Select a Color
</p>

<script>
function changeColor(hex, name) {
    const overlay = document.getElementById("wallOverlay");
    const label = document.getElementById("colorName");

    overlay.style.backgroundColor = hex;
    label.textContent = name;
}
</script>

</body>
</html>
