<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution of Protection: Waterproofing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .section {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            scroll-snap-align: start;
        }

        .container-wrapper {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scrollbar-width: none;
        }
        .container-wrapper::-webkit-scrollbar { display: none; }

        /* Blueprint Background Overlay */
        .blueprint-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: -2;
        }

        .floorplan-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2;
            pointer-events: none;
            z-index: -1;
        }

        .fixed-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Move content to the right */
            padding-right: 5%; /* Spacing from right edge */
            z-index: 10;
        }

        /* Wall SVG Styles - Increased Size */
        .asset-svg {
            width: 70%; /* Increased size */
            max-width: 900px;
            height: auto;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(50px); /* Nudge to the right */
        }

        /* Transitions between states */
        .state-1 .asset-svg { stroke: #fff; fill: transparent; stroke-width: 0.8; filter: grayscale(1); }
        .state-1 .protection-layer, .state-1 .water-drops, .state-1 .scan-lines { opacity: 0; }
        
        .state-2 .asset-svg { stroke: #00f2ff; fill: rgba(0, 242, 255, 0.05); stroke-width: 0.5; filter: drop-shadow(0 0 20px #00f2ff); }
        .state-2 .scan-lines { opacity: 1; stroke-dasharray: 4; animation: scanMove 2s linear infinite; }
        .state-2 .cracks { opacity: 0.4; stroke: #ff4d4d; }

        .state-3 .asset-svg { stroke: transparent; fill: #111; }
        .state-3 .wall-base { fill: #222; }
        .state-3 .membrane-layer { fill: #ff6b35; opacity: 1; transform: scaleX(1); }

        .state-4 .asset-svg { stroke: transparent; fill: #eee; }
        .state-4 .wall-base { fill: #ccc; }
        .state-4 .membrane-layer { fill: #ff6b35; opacity: 0.3; }
        .state-4 .finish-layer { opacity: 1; fill: #4a0e2e; }

        .state-5 .asset-svg { stroke: transparent; fill: #1a1a1a; filter: drop-shadow(0 0 50px rgba(168, 85, 247, 0.5)); }
        .state-5 .finish-layer { fill: #2a081b; }
        .state-5 .shield-glow { opacity: 1; stroke: #a855f7; stroke-width: 3; stroke-dasharray: 15 5; animation: rotateShield 10s linear infinite; }
        .state-5 .water-drops { opacity: 1; transform: translateY(-40px); transition: all 1.2s ease; }

        @keyframes scanMove {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes rotateShield {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 100; }
        }

        .bg-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            transition: background 1s ease;
            z-index: -3;
        }

        .bg-state-1 { background: #0a0a0a; }
        .bg-state-2 { background: #050505; }
        .bg-state-3 { background: #111; }
        .bg-state-4 { background: #f5f5f5; }
        .bg-state-5 { background: radial-gradient(circle at 70% 50%, #200a2e 0%, #000 100%); }

        .protection-layer, .scan-lines, .shield-glow { transition: all 0.8s ease; opacity: 0; }

        .title-text {
            position: absolute;
            left: 8%; /* Fixed on left */
            top: 50%;
            transform: translateY(-50%);
            width: 500px;
            z-index: 20;
            pointer-events: none;
            transition: color 0.5s ease;
        }

        .state-4 .title-text { color: #000; }

        .description-text {
            position: absolute;
            left: 8%; /* Moved to left below title */
            bottom: 15%;
            max-width: 400px;
            font-size: 0.9rem;
            color: #888;
            z-index: 20;
            text-align: left;
            transition: color 0.5s ease;
        }
        .state-4 .description-text { color: #444; }

        .heading-mask {
            overflow: hidden;
            height: 6rem;
        }

        .heading-line {
            line-height: 1;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Atmospheric particles */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body class="state-1">

    <div id="bg" class="bg-transition bg-state-1"></div>
    <div class="blueprint-bg"></div>
    <div class="floorplan-overlay"></div>

    <div class="fixed-content">
        <!-- Enlarged Wall SVG shifted right -->
        <svg viewBox="0 0 800 500" class="asset-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="brickPattern" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
                    <rect width="40" height="20" fill="none" stroke="#555" stroke-width="0.5" />
                </pattern>
            </defs>

            <!-- Wall Base Structure with subtle brick pattern -->
            <rect x="100" y="50" width="600" height="400" rx="4" class="wall-base" fill="url(#brickPattern)" />
            
            <!-- Structural Cracks -->
            <g class="cracks" fill="none" stroke-width="2" stroke-linecap="round">
                <path d="M180,100 L220,160 L200,220" />
                <path d="M550,250 L580,300 L560,380" />
                <path d="M350,180 L400,160" />
                <path d="M450,80 L420,120" />
            </g>

            <!-- Grid Overlay (Scan State) -->
            <path d="M100,50 L700,50 L700,450 L100,450 Z M100,100 L700,100 M100,150 L700,150 M100,200 L700,200 M100,250 L700,250 M100,300 L700,300 M100,350 L700,350 M100,400 L700,400" class="scan-lines" stroke="#00f2ff" fill="none" />

            <!-- Waterproofing Membrane (Orange) -->
            <rect x="105" y="55" width="590" height="390" rx="2" class="protection-layer membrane-layer" />

            <!-- Finished Luxury Surface (Royale Maroon) -->
            <rect x="110" y="60" width="580" height="380" rx="1" class="protection-layer finish-layer" />

            <!-- Dynamic Shield Glow -->
            <rect x="80" y="30" width="640" height="440" rx="12" class="shield-glow" fill="none" />
            
            <!-- Repelled Water Drops -->
            <g class="water-drops" fill="#a855f7">
                <path d="M200,10 Q205,25 200,25 Q195,25 200,10" />
                <path d="M400,-10 Q405,5 400,5 Q395,5 400,-10" />
                <path d="M600,15 Q605,30 600,30 Q595,30 600,15" />
            </g>
        </svg>

        <div class="title-text">
            <div class="heading-mask">
                <div class="heading-line text-8xl font-black uppercase tracking-tighter" id="title-1">Surface</div>
            </div>
            <div class="heading-mask">
                <div class="heading-line text-8xl font-black uppercase tracking-tighter" id="title-2">Under</div>
            </div>
            <div class="heading-mask">
                <div class="heading-line text-8xl font-black uppercase tracking-tighter" id="title-3">Threat</div>
            </div>
        </div>

        <div class="description-text" id="desc">
            Micro-fissures and skeletal cracks expose the core structure to the elements. The first step is identification.
        </div>
    </div>

    <div class="container-wrapper" id="scrollContainer">
        <section class="section" data-state="1" data-t1="Surface" data-t2="Under" data-t3="Threat" data-desc="Micro-fissures and skeletal cracks expose the core structure to the elements. The first step is identification."></section>
        <section class="section" data-state="2" data-t1="Digital" data-t2="Moisture" data-t3="Mapping" data-desc="Ultra-sonic scanning locates hidden dampness and structural weaknesses, creating a blueprint for defense."></section>
        <section class="section" data-state="3" data-t1="Active" data-t2="Membrane" data-t3="Bond" data-desc="A high-performance elastic membrane is fused to the surface, sealing every pore against liquid penetration."></section>
        <section class="section" data-state="4" data-t1="Aesthetic" data-t2="Shield" data-t3="Applied" data-desc="Luxury meets longevity. The protective layers are concealed beneath a flawless, breathable finish."></section>
        <section class="section" data-state="5" data-t1="Ultimate" data-t2="Hydro" data-t3="Defense" data-desc="The final result: a self-healing, water-repellent barrier that guarantees structural integrity for decades."></section>
    </div>

    <script>
        const scrollContainer = document.getElementById('scrollContainer');
        const bg = document.getElementById('bg');
        const title1 = document.getElementById('title-1');
        const title2 = document.getElementById('title-2');
        const title3 = document.getElementById('title-3');
        const desc = document.getElementById('desc');
        const sections = document.querySelectorAll('.section');

        const observerOptions = {
            root: scrollContainer,
            threshold: 0.6
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const state = entry.target.getAttribute('data-state');
                    const t1 = entry.target.getAttribute('data-t1');
                    const t2 = entry.target.getAttribute('data-t2');
                    const t3 = entry.target.getAttribute('data-t3');
                    const description = entry.target.getAttribute('data-desc');

                    document.body.className = `state-${state}`;
                    bg.className = `bg-transition bg-state-${state}`;

                    updateText(title1, t1);
                    updateText(title2, t2);
                    updateText(title3, t3);
                    
                    desc.style.opacity = 0;
                    setTimeout(() => {
                        desc.textContent = description;
                        desc.style.opacity = 1;
                    }, 300);
                }
            });
        }, observerOptions);

        sections.forEach(section => observer.observe(section));

        function updateText(el, newText) {
            el.style.transform = 'translateY(100%)';
            setTimeout(() => {
                el.textContent = newText;
                el.style.transform = 'translateY(0)';
            }, 300);
        }

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 60;
            const y = (window.innerHeight / 2 - e.pageY) / 60;
            const asset = document.querySelector('.asset-svg');
            // Enhanced 3D parallax
            asset.style.transform = `translateX(50px) perspective(1200px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
        });
    </script>
</body>
</html>
