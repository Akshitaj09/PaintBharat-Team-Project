<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintBharat Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FBF9F7;
        }

        /* Neumorphic 3D Styles */
        .neumo-out {
            shadow-color: rgba(215, 210, 200, 0.4);
            box-shadow: 12px 12px 24px rgba(215, 210, 200, 0.4), 
                        -12px -12px 24px rgba(255, 255, 255, 0.9);
        }

        .neumo-in {
            box-shadow: inset 8px 8px 16px rgba(215, 210, 200, 0.6), 
                        inset -8px -8px 16px rgba(255, 255, 255, 0.8);
        }

        .neumo-button {
            box-shadow: 4px 4px 8px rgba(215, 210, 200, 0.5), 
                        -4px -4px 8px rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .neumo-button:active {
            box-shadow: inset 2px 2px 5px rgba(215, 210, 200, 0.4), 
                        inset -2px -2px 5px rgba(255, 255, 255, 0.9);
            transform: scale(0.98);
        }

        /* Prevent image square edge leak on hover */
        .isolate-rounding {
            isolation: isolate;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-12">

    <div class="w-full max-w-6xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 lg:gap-14">
            
            <!-- Interior Painting Card -->
            <div class="group relative bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 border border-white/50 hover:-translate-y-1">
                <div class="aspect-[4/3] rounded-[40px] p-4 neumo-in relative flex items-center justify-center overflow-hidden isolate-rounding">
                    <div class="w-full h-full rounded-[32px] overflow-hidden">
                        <img 
                            src="https://images.unsplash.com/photo-1562664377-709f2c337eb2?auto=format&fit=crop&q=80&w=800" 
                            alt="Interior Painting"
                            class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-1000 ease-out"
                        >
                    </div>
                </div>
                <div class="px-4 pt-8 pb-4 flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-slate-800 tracking-tight">Interior Painting</h3>
                    <button class="w-12 h-12 bg-[#FBF9F7] neumo-button rounded-[20px] flex items-center justify-center text-slate-400 hover:text-rose-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 3 6 6-9 9-4 1 1-4Z"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    </button>
                </div>
            </div>

            <!-- Exterior Painting Card -->
            <div class="group relative bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 border border-white/50 hover:-translate-y-1">
                <div class="aspect-[4/3] rounded-[40px] p-4 neumo-in relative flex items-center justify-center overflow-hidden isolate-rounding">
                    <div class="w-full h-full rounded-[32px] overflow-hidden">
                        <img 
                            src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&q=80&w=800" 
                            alt="Exterior Painting"
                            class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-1000 ease-out"
                        >
                    </div>
                </div>
                <div class="px-4 pt-8 pb-4 flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-slate-800 tracking-tight">Exterior Painting</h3>
                    <button class="w-12 h-12 bg-[#FBF9F7] neumo-button rounded-[20px] flex items-center justify-center text-slate-400 hover:text-rose-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 3 6 6-9 9-4 1 1-4Z"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    </button>
                </div>
            </div>

            <!-- Luxury Wallpaper Card -->
            <div class="group relative bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 border border-white/50 hover:-translate-y-1">
                <div class="aspect-[4/3] rounded-[40px] p-4 neumo-in relative flex items-center justify-center overflow-hidden isolate-rounding">
                    <div class="w-full h-full rounded-[32px] overflow-hidden">
                        <img 
                            src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=800" 
                            alt="Luxury Wallpaper"
                            class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-1000 ease-out"
                        >
                    </div>
                </div>
                <div class="px-4 pt-8 pb-4 flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-slate-800 tracking-tight">Luxury Wallpaper</h3>
                    <button class="w-12 h-12 bg-[#FBF9F7] neumo-button rounded-[20px] flex items-center justify-center text-slate-400 hover:text-rose-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 3 6 6-9 9-4 1 1-4Z"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    </button>
                </div>
            </div>

            <!-- Waterproofing Card -->
            <div class="group relative bg-[#FBF9F7] rounded-[48px] p-5 neumo-out transition-all duration-500 border border-white/50 hover:-translate-y-1">
                <div class="aspect-[4/3] rounded-[40px] p-4 neumo-in relative flex items-center justify-center overflow-hidden isolate-rounding">
                    <div class="w-full h-full rounded-[32px] overflow-hidden">
                        <img 
                            src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=800" 
                            alt="Waterproofing"
                            class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-1000 ease-out"
                        >
                    </div>
                </div>
                <div class="px-4 pt-8 pb-4 flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-slate-800 tracking-tight">Waterproofing</h3>
                    <button class="w-12 h-12 bg-[#FBF9F7] neumo-button rounded-[20px] flex items-center justify-center text-slate-400 hover:text-rose-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 3 6 6-9 9-4 1 1-4Z"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    </button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
