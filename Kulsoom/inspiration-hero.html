<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINTBHARAT CO. | Design Inspiration Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { 
            background-color: #0a0a0a; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
            margin: 0;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Brand Colors */
        .text-brand { color: #D1004B; }
        .bg-brand { background-color: #D1004B; }
        .border-brand { border-color: #D1004B; }
        
        /* Smooth transitions */
        .transition-slow { transition: all 1s cubic-bezier(0.22, 1, 0.36, 1); }
    </style>
</head>
<body 
    x-data="gallery()" 
    @wheel.passive="handleWheel($event)"
    class="h-screen w-full relative select-none overflow-hidden"
>

    <!-- 1. HERO BACKGROUND (Visible only when expanded) -->
    <div class="absolute inset-0 z-0">
        <template x-for="(slide, index) in slides" :key="slide.id">
            <div 
                x-show="isExpanded && currentIndex === index"
                x-transition:enter="transition opacity-0 duration-1000"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="transition opacity-0 duration-1000"
                class="absolute inset-0"
            >
                <!-- Overlays -->
                <div class="absolute inset-0 bg-gradient-to-r from-black/95 via-black/40 to-transparent z-10"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/40 z-10"></div>
                <!-- Image -->
                <img :src="slide.image" class="w-full h-full object-cover" :alt="slide.title">
            </div>
        </template>
    </div>

    <!-- 2. NAVIGATION BAR -->
    <nav class="relative z-50 flex items-center justify-between px-8 py-6 md:px-16">
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center bg-white p-1 shadow-lg">
                <img src="Logo2.png" alt="PAINTBHARAT Logo" class="w-full h-full object-contain" onerror="this.src='https://img.icons8.com/color/96/000000/color-palette.png'">
            </div>
            <span class="text-xl font-black tracking-tighter uppercase hidden md:block">PAINTBHARAT CO.</span>
        </div>

        <ul class="hidden lg:flex items-center gap-8 text-[10px] font-bold tracking-[0.2em] uppercase text-gray-400">
            <li class="cursor-pointer hover:text-white transition-colors">Interiors</li>
            <li class="cursor-pointer hover:text-white transition-colors">Exteriors</li>
            <li class="cursor-pointer hover:text-white transition-colors">Wallpapers</li>
            <li class="cursor-pointer hover:text-white transition-colors">Waterproofing</li>
        </ul>

        <div class="flex items-center gap-6">
            <svg class="w-5 h-5 cursor-pointer hover:text-brand transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <svg class="w-6 h-6 cursor-pointer hover:text-brand transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </div>
    </nav>

    <!-- GLOBAL NAVIGATION ARROWS (Next / Previous) -->
    <div class="absolute inset-y-0 left-0 z-50 flex items-center px-4 md:px-8 pointer-events-none">
        <button 
            @click="prev()"
            class="w-12 h-12 md:w-16 md:h-16 rounded-full border border-white/10 flex items-center justify-center text-white hover:bg-white/10 hover:border-white/30 transition-all pointer-events-auto group backdrop-blur-sm"
        >
            <svg class="w-6 h-6 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
    </div>

    <div class="absolute inset-y-0 right-0 z-50 flex items-center px-4 md:px-8 pointer-events-none">
        <button 
            @click="next()"
            class="w-12 h-12 md:w-16 md:h-16 rounded-full border border-white/10 flex items-center justify-center text-white hover:bg-white/10 hover:border-white/30 transition-all pointer-events-auto group backdrop-blur-sm"
        >
            <svg class="w-6 h-6 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>

    <!-- 3. GRID MODE VIEW -->
    <div 
        x-show="!isExpanded" 
        x-transition:enter="transition opacity-0 transform translate-y-12 duration-1000"
        x-transition:leave="transition opacity-0 transform scale-110 duration-1000"
        class="absolute inset-0 z-20 flex flex-col items-center justify-center px-8 md:px-16"
        x-cloak
    >
        <div class="flex gap-4 md:gap-6 w-full max-w-7xl justify-center h-[450px] md:h-[550px]">
            <template x-for="(slide, index) in slides" :key="slide.id">
                <div 
                    class="relative rounded-3xl overflow-hidden transition-all duration-700 ease-out cursor-pointer"
                    :class="index === currentIndex ? 'flex-[3] ring-1 ring-white/20' : 'flex-1 opacity-25 grayscale'"
                    @click="scrollStep = index * 2 + 1; updateState();"
                >
                    <img :src="slide.image" class="w-full h-full object-cover transition-transform duration-1000" :alt="slide.title">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    
                    <div 
                        class="absolute bottom-10 left-10 transition-all duration-700"
                        :class="index === currentIndex ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'"
                    >
                        <p class="text-brand text-[9px] font-black tracking-[0.4em] uppercase mb-2" x-text="slide.category"></p>
                        <h3 class="text-4xl font-serif font-bold tracking-tight" x-text="slide.title"></h3>
                    </div>
                </div>
            </template>
        </div>
        
        <button 
            @click="next()"
            class="mt-12 group flex flex-col items-center gap-3 text-white transition-all hover:text-brand"
        >
            <div class="px-6 py-2 border border-white/20 rounded-full text-[10px] font-bold tracking-[0.2em] uppercase group-hover:border-brand/50 transition-colors">
                Experience the Design
            </div>
            <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </button>
    </div>

    <!-- 4. HERO CONTENT (Expanded) -->
    <div class="relative z-20 h-full flex flex-col justify-center px-12 md:px-32 pointer-events-none">
        <template x-for="(slide, index) in slides" :key="'hero-content-' + slide.id">
            <div 
                x-show="isExpanded && currentIndex === index"
                x-transition:enter="transition opacity-0 transform -translate-x-12 duration-1000 delay-300"
                x-transition:leave="transition opacity-0 transform translate-x-12 duration-500"
                class="max-w-3xl pointer-events-auto absolute"
                x-cloak
            >
                <h2 class="text-brand font-bold tracking-[0.5em] uppercase mb-4 text-[11px]" x-text="slide.category"></h2>
                <h1 class="text-7xl md:text-[110px] font-serif font-bold mb-8 tracking-tighter leading-[0.85]" x-text="slide.title"></h1>
                <p class="text-gray-400 text-lg leading-relaxed mb-12 max-w-xl font-light" x-text="slide.description"></p>

                <div class="flex items-center gap-10">
                    <button class="group relative px-10 py-5 bg-transparent border border-white/20 rounded-full overflow-hidden transition-all hover:border-pink-500/50">
                        <span class="relative z-10 flex items-center gap-3 font-bold text-[11px] tracking-[0.3em] uppercase">
                            Book Consultation
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </span>
                        <div class="absolute inset-0 bg-white/5 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                    </button>
                    
                    <div class="flex flex-col text-[9px] text-gray-500 font-black uppercase tracking-[0.3em]">
                        <span>Scroll up</span>
                        <span class="text-white">To Browse</span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- 5. TIMELINE / FOOTER -->
    <div class="absolute bottom-0 left-0 w-full z-40 px-8 pb-10 md:px-16 flex items-end justify-between">
        <div class="flex items-center gap-12 w-full max-w-2xl">
            <div class="relative flex-1 h-[1px] bg-white/10">
                <div class="absolute top-1/2 -translate-y-1/2 w-full flex justify-between">
                    <template x-for="(s, idx) in slides" :key="'dot-'+idx">
                        <div
                            class="w-1.5 h-1.5 rounded-full transition-all duration-700 cursor-pointer"
                            @click="scrollStep = idx * 2; updateState();"
                            :class="idx === currentIndex ? 'bg-brand scale-[2.5]' : 'bg-white/20'"
                            :style="idx === currentIndex ? 'box-shadow: 0 0 20px rgba(209, 0, 75, 0.8)' : ''"
                        ></div>
                    </template>
                </div>
                <div 
                    class="absolute h-full bg-brand transition-all duration-700 ease-out"
                    :style="`width: ${(currentIndex / (slides.length - 1)) * 100}%`"
                ></div>
            </div>
            <div class="flex items-baseline gap-2">
                <span class="text-4xl font-serif italic text-brand tracking-tighter" x-text="`0${currentIndex + 1}`"></span>
                <span class="text-[10px] text-gray-600 font-black tracking-widest" x-text="`/ 0${slides.length}`"></span>
            </div>
        </div>
    </div>

    <script>
        function gallery() {
            return {
                scrollStep: 0,
                isScrolling: false,
                currentIndex: 0,
                isExpanded: false,
                slides: [
                    {
                        id: 1,
                        title: "Interior Artistry",
                        category: "Premium Finishes",
                        description: "Transform your living spaces with our curated interior palettes. From matte elegance to satin sophistication, we bring depth and character to every room.",
                        image: "images/bedroom_interior2.jpg",
                    },
                    {
                        id: 2,
                        title: "Modern Exteriors",
                        category: "Weather Protection",
                        description: "Durability meets curb appeal. Our exterior solutions are engineered to withstand the elements while providing a stunning first impression for your home.",
                        image: "images/ex_2.jpg",
                    },
                    {
                        id: 3,
                        title: "Designer Textures",
                        category: "Luxury Wallpaper",
                        description: "Bespoke wallpaper designs that redefine accent walls. Discover intricate patterns and tactile textures that turn your walls into a canvas of inspiration.",
                        image: "images/exterior2.jpg",
                    },
                    {
                        id: 4,
                        title: "Waterproof Shield",
                        category: "Technical Solutions",
                        description: "Protect your structural integrity with our advanced waterproofing systems. Invisible protection that ensures your design stays pristine for decades.",
                        image: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=2000",
                    }
                ],
                handleWheel(e) {
                    if (this.isScrolling) return;

                    if (Math.abs(e.deltaY) > 20) {
                        this.isScrolling = true;
                        
                        if (e.deltaY > 0) {
                            this.scrollStep = (this.scrollStep + 1) % (this.slides.length * 2);
                        } else {
                            this.scrollStep = (this.scrollStep - 1 + (this.slides.length * 2)) % (this.slides.length * 2);
                        }

                        this.updateState();

                        setTimeout(() => {
                            this.isScrolling = false;
                        }, 1200);
                    }
                },
                next() {
                    if (this.isScrolling) return;
                    this.isScrolling = true;
                    this.scrollStep = (this.scrollStep + 1) % (this.slides.length * 2);
                    this.updateState();
                    setTimeout(() => this.isScrolling = false, 1200);
                },
                prev() {
                    if (this.isScrolling) return;
                    this.isScrolling = true;
                    this.scrollStep = (this.scrollStep - 1 + (this.slides.length * 2)) % (this.slides.length * 2);
                    this.updateState();
                    setTimeout(() => this.isScrolling = false, 1200);
                },
                updateState() {
                    this.isExpanded = this.scrollStep % 2 !== 0;
                    this.currentIndex = Math.floor(this.scrollStep / 2);
                }
            }
        }
    </script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
