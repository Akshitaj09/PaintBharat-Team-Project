<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services | Premium Home Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfaf7; /* Cream background */
            color: #4a443e; /* Soft charcoal/taupe */
        }
        .serif-title {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.1em;
        }
        .main-heading {
            font-family: 'Playfair Display', serif;
            /* Large 60px font as requested, responsive for mobile */
            font-size: clamp(32px, 8vw, 60px); 
            line-height: 1.1;
            letter-spacing: 0.1em;
        }
        .treatment-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: transparent;
            /* Bolder Shining Gold Border */
            border: 3px solid #d4af37;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 320px; /* Adjusted for 4-in-a-row layout */
            margin: 0 auto;
        }
        .treatment-card:hover {
            transform: translateY(-8px);
            border-color: #fcf6ba; 
            box-shadow: 0 12px 24px -10px rgba(212, 175, 55, 0.3);
        }
        /* Shine effect overlay */
        .treatment-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 70%,
                transparent 100%
            );
            transform: rotate(45deg);
            transition: 0.8s;
            pointer-events: none;
        }
        .treatment-card:hover::after {
            left: 100%;
            top: 100%;
        }

        /* Organic wavy clip-path for images */
        .wave-bottom {
            clip-path: url(#wave-clip);
            -webkit-clip-path: url(#wave-clip);
        }
        .aspect-ratio-box {
            position: relative;
            padding-bottom: 90%; /* Balanced ratio for 4-column layout */
            overflow: hidden;
        }
        .aspect-ratio-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .price-tag {
            border-top: 1px solid #e5e0d8;
        }
    </style>
</head>
<body class="pt-8 pb-24 px-4 md:px-8 lg:px-12">

    <!-- SVG Clip Path Definition (Invisible) -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <clipPath id="wave-clip" clipPathUnits="objectBoundingBox">
                <path d="M0,0 L1,0 L1,0.88 C0.75,0.95 0.5,0.85 0.25,0.95 C0.1,1 0,0.92 0,0.88 L0,0 Z"></path>
            </clipPath>
        </defs>
    </svg>

    <!-- Header Section -->
    <header class="text-center max-w-5xl mx-auto mb-16">
        <h1 class="main-heading font-normal mb-6 uppercase">
            Services We Provide
        </h1>
        <div class="w-16 h-px bg-[#d4af37] mx-auto mb-6"></div>
        <p class="text-sm md:text-base text-gray-400 font-light leading-relaxed italic tracking-wide max-w-2xl mx-auto">
            Transforming spaces with precision, elegance, and a commitment to architectural excellence.
        </p>
    </header>

    <!-- Services Grid -->
    <main class="max-w-[1400px] mx-auto"> 
        <!-- Using 4 columns for desktop (lg) and 2 for tablet (md) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 xl:gap-8">
            
            <!-- Card 1: Interior Painting -->
            <div class="treatment-card p-4 rounded-sm">
                <div class="aspect-ratio-box wave-bottom mb-5">
                    <img src="https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&q=80&w=800" 
                        alt="Interior Painting">
                </div>
                <h3 class="serif-title text-[15px] mb-5 uppercase font-medium text-center">Interior Painting</h3>
                <div class="price-tag pt-4 flex justify-between items-center text-[9px] tracking-[0.12em] uppercase text-[#a39482]">
                    <span>Pro Finish</span>
                    <span class="font-semibold text-gray-700">Get Quote</span>
                </div>
            </div>

            <!-- Card 2: Exterior Painting -->
            <div class="treatment-card p-4 rounded-sm">
                <div class="aspect-ratio-box wave-bottom mb-5">
                    <img src="https://images.unsplash.com/photo-1516156008625-3a9d6067fab5?auto=format&fit=crop&q=80&w=800" 
                        alt="Exterior Painting">
                </div>
                <h3 class="serif-title text-[15px] mb-5 uppercase font-medium text-center">Exterior Painting</h3>
                <div class="price-tag pt-4 flex justify-between items-center text-[9px] tracking-[0.12em] uppercase text-[#a39482]">
                    <span>Durable</span>
                    <span class="font-semibold text-gray-700">Estimate</span>
                </div>
            </div>

            <!-- Card 3: Waterproofing -->
            <div class="treatment-card p-4 rounded-sm">
                <div class="aspect-ratio-box wave-bottom mb-5">
                    <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=800" 
                        alt="Waterproofing">
                </div>
                <h3 class="serif-title text-[15px] mb-5 uppercase font-medium text-center">Waterproofing</h3>
                <div class="price-tag pt-4 flex justify-between items-center text-[9px] tracking-[0.12em] uppercase text-[#a39482]">
                    <span>Sealant</span>
                    <span class="font-semibold text-gray-700">Inquiry</span>
                </div>
            </div>

            <!-- Card 4: Wallpaper -->
            <div class="treatment-card p-4 rounded-sm">
                <div class="aspect-ratio-box wave-bottom mb-5">
                    <img src="https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&q=80&w=800" 
                        alt="Luxury Wallpaper Design">
                </div>
                <h3 class="serif-title text-[15px] mb-5 uppercase font-medium text-center">Wallpaper</h3>
                <div class="price-tag pt-4 flex justify-between items-center text-[9px] tracking-[0.12em] uppercase text-[#a39482]">
                    <span>Designer</span>
                    <span class="font-semibold text-gray-700">Premium</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Action -->
    <footer class="mt-20 text-center">
        <div class="inline-block relative group cursor-pointer">
            <span class="serif-title text-xs uppercase tracking-[0.3em] pb-3 border-b border-[#d4af37] group-hover:text-[#d4af37] transition-colors duration-300">
                Begin Your Transformation
            </span>
        </div>
    </footer>

</body>
</html>
