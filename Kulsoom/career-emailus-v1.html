<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch | Superpower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030303;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Ambient Background Mesh */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 15%, rgba(191, 219, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(251, 207, 232, 0.15) 0%, transparent 40%);
        }

        .envelope-wrapper {
            perspective: 2000px;
            position: relative;
            width: 620px;
            height: 400px;
            margin-top: 120px; 
        }

        /* THE PASTEL ENVELOPE MATERIAL */
        .envelope-material {
            background: linear-gradient(135deg, #bfdbfe 0%, #e0e7ff 40%, #fbcfe8 100%);
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .envelope-material::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* THE WHITE CARD */
        .invite-card {
            background: #ffffff;
            position: absolute;
            inset: 20px;
            bottom: 40px;
            z-index: 20;
            border-radius: 28px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
            color: #000;
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0s, 
                        opacity 0.5s ease 0s;
            display: flex;
            flex-direction: column;
            padding: 45px;
            pointer-events: none;
        }

        .envelope-wrapper:not(.is-closing):hover .invite-card {
            opacity: 1;
            transform: translateY(-280px) scale(1.02);
            pointer-events: auto;
            z-index: 60; 
            transition: transform 0.9s cubic-bezier(0.2, 1.1, 0.4, 1) 0.4s, 
                        opacity 0.4s ease 0.4s;
        }

        /* THE FLAP - Added drop shadow to make V visible when closed */
        .flap {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            transform-origin: top;
            clip-path: polygon(0 0, 50% 50%, 100% 0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.6s, z-index 0s linear 0.6s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .envelope-wrapper:not(.is-closing):hover .flap {
            transform: rotateX(172deg);
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0s, z-index 0s linear 0.1s;
            filter: drop-shadow(0 0px 0px transparent);
        }

        /* FRONT POCKET - Added inner shadow to make pocket V visible when open */
        .front-pocket {
            position: absolute;
            inset: 0;
            z-index: 40;
            clip-path: polygon(0 25%, 50% 60%, 100% 25%, 100% 100%, 0 100%);
            border-radius: 0 0 40px 40px;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.05);
        }

        /* Visual separation lines on the V edges */
        .flap::before, .front-pocket::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            pointer-events: none;
        }

        /* FORM ELEMENTS */
        input {
            width: 100%;
            border-bottom: 2px solid #f1f5f9;
            padding: 10px 0;
            font-size: 16px;
            font-weight: 500;
            transition: border-color 0.3s;
            background: transparent;
            color: #000;
        }
        input:focus { outline: none; border-color: #000; }
        
        .resume-btn {
            border: 2px dashed #f1f5f9;
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
        }
        .resume-btn:hover { border-color: #000; background: #fafafa; }

        .send-btn {
            background: #000;
            color: #fff;
            width: 100%;
            padding: 16px;
            border-radius: 100px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 11px;
            margin-top: 28px;
            transition: all 0.3s;
        }
        .send-btn:hover { background: #222; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .send-btn:active { transform: translateY(0); }

        /* SUCCESS MESSAGE */
        .success-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: white;
            border-radius: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 100;
        }
        .is-sent .success-message { opacity: 1; }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="flex flex-col items-center">
        
        <div class="text-center mb-10">
            <h1 class="text-white text-5xl font-thin tracking-tighter">Step into the <span class="font-normal text-indigo-300">future.</span></h1>
        </div>

        <div id="envelope" class="envelope-wrapper">
            
            <!-- THE WHITE CARD -->
            <div class="invite-card">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-3 h-3 rounded-full bg-black"></div>
                    <span class="text-[10px] font-black tracking-[0.5em] uppercase text-black">Get in touch with us</span>
                </div>

                <div class="space-y-6 flex-1">
                    <div>
                        <label class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Full Name</label>
                        <input type="text" placeholder="Your Name">
                    </div>
                    <div>
                        <label class="text-[9px] font-black uppercase tracking-widest text-zinc-400">Email Address</label>
                        <input type="email" placeholder="hello@superpower.com">
                    </div>
                    <div class="resume-btn group">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 group-hover:text-black">Attach Resume (PDF)</span>
                    </div>
                </div>

                <button id="sendBtn" class="send-btn">Send Application</button>

                <div id="successMsg" class="success-message">
                    <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <span class="text-[11px] font-black uppercase tracking-[0.4em] text-black">Message Sent</span>
                </div>
            </div>

            <!-- ENVELOPE BACK -->
            <div class="absolute inset-0 envelope-material rounded-b-[40px] z-5"></div>

            <!-- ENVELOPE FLAP -->
            <div class="flap envelope-material"></div>

            <!-- ENVELOPE FRONT POCKET -->
            <div class="front-pocket envelope-material"></div>

        </div>

        <p class="mt-20 text-zinc-800 text-[10px] font-bold uppercase tracking-[0.6em] opacity-40">Hover to contact</p>

    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            envelope.classList.add('is-sent');
            
            setTimeout(() => {
                envelope.classList.add('is-closing');
                setTimeout(() => {
                    envelope.classList.remove('is-closing');
                    envelope.classList.remove('is-sent');
                }, 1500);
            }, 1200);
        });
    </script>

</body>
</html>
