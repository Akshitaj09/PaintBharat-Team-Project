<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Painting Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Custom Animations */
        @keyframes reveal-up {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in-down {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slow-zoom {
            from { transform: scale(1.1); }
            to { transform: scale(1); }
        }
        
        .animate-reveal-up { 
            opacity: 0;
            animation: reveal-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }
        .animate-fade-in-down { 
            opacity: 0;
            animation: fade-in-down 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }
        .animate-fade-in { 
            opacity: 0;
            animation: fade-in 1.5s ease-out forwards; 
        }
        .animate-slow-zoom {
            animation: slow-zoom 20s ease-out infinite alternate;
        }

        /* Staggered Delays */
        .delay-200 { animation-delay: 200ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-600 { animation-delay: 600ms; }
        .delay-1000 { animation-delay: 1000ms; }

        /* Hide loader initially or via JS */
        #loader.hidden { display: none; }
    </style>
</head>
<body class="bg-[#F9F8F6] min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- Hero Banner Container -->
    <div id="banner-container" class="relative overflow-hidden rounded-[32px] shadow-[0_32px_64px_-16px_rgba(45,41,38,0.15)] bg-[#E5E1DA]
        w-[375px] h-[520px] 
        md:w-[1024px] md:h-[460px] 
        lg:w-[1280px] lg:h-[520px]">
        
        <!-- Background Layer -->
        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-transform duration-[10s] ease-out scale-105 animate-slow-zoom"></div>
        
        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/85 via-black/40 to-transparent z-0"></div>

        <!-- Loader -->
        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 z-20 bg-[#E5E1DA]">
            <i data-lucide="loader-2" class="animate-spin text-[#8C8479] w-8 h-8"></i>
            <p class="text-sm tracking-[0.2em] uppercase font-medium text-[#8C8479]">Visualizing Quality...</p>
        </div>

        <!-- Content Area -->
        <div class="absolute inset-0 flex flex-col justify-center px-10 md:px-16 lg:px-24 z-10 text-white max-w-[75%] md:max-w-[60%] pointer-events-none">
            <span class="text-xs md:text-sm tracking-[0.4em] uppercase mb-4 opacity-80 font-bold animate-fade-in-down">
                Master Artisan Painters
            </span>
            
            <h1 class="text-3xl md:text-4xl lg:text-6xl font-serif mb-6 leading-[1.1] animate-reveal-up delay-200">
                Interior Painting <br /> 
                <span class="italic opacity-90 block mt-2">Excellence.</span>
            </h1>
            
            <p class="text-sm md:text-base opacity-70 mb-10 leading-relaxed font-light hidden sm:block max-w-sm animate-reveal-up delay-400">
                Refined finishes crafted for elegant living. Experience the transformational power of artisanal color and precision application.
            </p>
            
            <div class="pointer-events-auto animate-reveal-up delay-600">
                <button class="group relative flex items-center gap-4 bg-white text-black px-10 py-5 rounded-full text-xs md:text-sm font-bold tracking-[0.2em] uppercase transition-all duration-500 hover:bg-black hover:text-white hover:scale-105 hover:shadow-[0_20px_40px_rgba(0,0,0,0.3)]">
                    <span>Book Free Site Visit</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 transition-transform duration-500 group-hover:translate-x-2"></i>
                    <div class="absolute inset-0 rounded-full border border-white/20 scale-100 group-hover:scale-110 opacity-0 group-hover:opacity-100 transition-all duration-500"></div>
                </button>
            </div>
        </div>

        <!-- Editorial Detail -->
        <div class="absolute bottom-10 right-10 hidden lg:block text-white/40 text-[9px] tracking-[0.3em] uppercase pointer-events-none animate-fade-in delay-1000">
            Certified Luxury Surface Specialists • MMXXIV
        </div>
    </div>

    <script>
        const apiKey = ""; // Provided at runtime
        const prompt = "luxury modern living room with flawless premium matte paint finish on walls, soft neutral designer colors, warm natural sunlight through tall windows, minimalist elegant furniture, curated wall decor, stone and beige palette, cinematic architectural photography, ultra realistic, 16:9 composition, negative space on left for text, rounded corners framing, high-end editorial style";

        async function fetchHeroImage() {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            const payload = {
                instances: [{ prompt: prompt }],
                parameters: { sampleCount: 1 }
            };

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('Generation failed');

                    const result = await response.json();
                    const base64 = result.predictions[0].bytesBase64Encoded;
                    
                    const bgElement = document.getElementById('hero-bg');
                    bgElement.style.backgroundImage = `url(data:image/png;base64,${base64})`;
                    
                    // Hide loader once image is ready
                    document.getElementById('loader').classList.add('hidden');
                    return;
                } catch (err) {
                    if (i === 4) {
                        const loaderText = document.querySelector('#loader p');
                        if (loaderText) loaderText.innerText = "Error loading visual. Please refresh.";
                        if (loaderText) loaderText.classList.add('text-red-400');
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        window.onload = function() {
            lucide.createIcons();
            fetchHeroImage();
        };
    </script>
</body>
</html>
