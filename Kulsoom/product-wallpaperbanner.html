<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Wallpapers | Premium Interior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f7f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        /* Shadow implementation based on "Soft Luxury Shadow" */
        .luxury-shadow {
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.15), 
                        0 10px 20px -5px rgba(0, 0, 0, 0.05);
        }

        /* Viewport constraints from prompt */
        .viewport-container {
            width: 100%;
            max-width: 1280px; /* Desktop */
            height: 520px;
            position: relative;
            overflow: hidden;
            border-radius: 32px; /* Design System Rule */
            transition: all 0.5s ease-in-out;
        }

        /* Background Zoom Animation */
        @keyframes slowZoomOut {
            from { transform: scale(1.15); }
            to { transform: scale(1); }
        }

        .bg-animate-zoom {
            animation: slowZoomOut 20s ease-out forwards;
        }

        /* Entrance Animations for Text */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-reveal {
            opacity: 0;
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        /* --- NEW BUTTON ANIMATION (As seen in video) --- */
        .btn-premium {
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        /* The Fill Element */
        .btn-premium::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: -1;
        }

        /* Hover State */
        .btn-premium:hover::before {
            transform: translateY(0);
        }

        .btn-premium:hover {
            color: #171717 !important; /* Dark text on hover */
            border-color: white;
            transform: translateY(-2px);
        }

        /* Icon Animation */
        .btn-premium .arrow-icon {
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-premium:hover .arrow-icon {
            transform: translateX(4px);
        }

        /* Adaptive heights based on user specs */
        @media (max-width: 1024px) {
            .viewport-container {
                max-width: 1024px;
                height: 460px;
            }
        }
        @media (max-width: 768px) {
            .viewport-container {
                max-width: 375px;
                height: 520px;
            }
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .shimmer {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <div id="main-container" class="viewport-container luxury-shadow bg-neutral-200">
        <!-- Loading State -->
        <div id="loader" class="loading-overlay shimmer">
            <div class="text-neutral-500 font-medium">Curating your space...</div>
        </div>

        <!-- Background Image Container -->
        <div id="bg-image" class="absolute inset-0 bg-cover bg-center transition-opacity duration-[2000ms] opacity-0"></div>

        <!-- Gradient Overlay: Dark left to right -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/40 to-transparent"></div>

        <!-- Content Area -->
        <div class="relative z-10 h-full flex flex-col justify-center px-8 md:px-16 lg:px-24 text-white max-w-2xl">
            <span class="animate-reveal delay-1 uppercase tracking-[0.3em] text-xs md:text-sm mb-4 opacity-80 font-light block">
                Exquisite Interiors
            </span>
            
            <h1 class="animate-reveal delay-2 serif text-4xl md:text-5xl lg:text-6xl mb-4 leading-tight">
                Designer <br class="hidden md:block"> Wallpapers
            </h1>
            
            <p class="animate-reveal delay-3 text-base md:text-lg lg:text-xl font-light mb-8 opacity-90 max-w-md">
                Statement walls made effortless. Crafted for those who appreciate the tactile beauty of premium finishes.
            </p>

            <div class="animate-reveal delay-4 flex flex-wrap gap-4">
                <button class="btn-premium bg-neutral-900/40 backdrop-blur-md px-8 py-3.5 rounded-full font-medium text-white">
                    <span>View Collection</span>
                    <span class="arrow-icon text-lg">→</span>
                </button>
                <button class="btn-premium bg-transparent px-8 py-3.5 rounded-full font-medium text-white">
                    <span>Request Samples</span>
                    <span class="arrow-icon text-lg">→</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "";
        const imagePrompt = "luxury bedroom wallpaper feature wall, textured designer patterns, soft ambient lighting, premium wall finishes, neutral color scheme, modern interior styling, ultra realistic photography, wide banner crop, empty left area for text overlay, editorial interior magazine style";

        async function generateHeroImage() {
            const loader = document.getElementById('loader');
            const bgContainer = document.getElementById('bg-image');

            let retries = 0;
            const maxRetries = 5;

            async function attempt() {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: { prompt: imagePrompt },
                            parameters: { sampleCount: 1 }
                        })
                    });

                    if (!response.ok) throw new Error('Generation failed');

                    const result = await response.json();
                    const base64Image = result.predictions[0].bytesBase64Encoded;
                    const imageUrl = `data:image/png;base64,${base64Image}`;

                    // Set image, start zoom, and fade in
                    bgContainer.style.backgroundImage = `url(${imageUrl})`;
                    bgContainer.classList.add('bg-animate-zoom');
                    bgContainer.classList.remove('opacity-0');
                    bgContainer.classList.add('opacity-100');
                    
                    // Remove loader
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);

                } catch (error) {
                    if (retries < maxRetries) {
                        retries++;
                        const delay = Math.pow(2, retries) * 500;
                        setTimeout(attempt, delay);
                    } else {
                        loader.innerHTML = '<div class="text-neutral-500 text-center p-4">Unable to load luxury visuals.<br><button onclick="location.reload()" class="mt-4 underline">Retry</button></div>';
                        loader.classList.remove('shimmer');
                    }
                }
            }

            attempt();
        }

        window.onload = generateHeroImage;
    </script>
</body>
</html>
